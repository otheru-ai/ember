# Build and publish Ember's minimal release image. The `release` target builds
# through the full-toolchain `dev` stage, so this one job validates both image
# contracts without requiring a GPU. Use a dedicated high-disk host runner;
# target-hardware certification is a separate gfx1151 gate.
name: Container

env:
  CCACHE_COMPRESS: 'true'
  CCACHE_MAXSIZE: 2G

on:
  # Manual disaster-recovery publisher. Normal publication happens once on
  # GitHub after mirror + CI, avoiding two builders racing to update GHCR tags.
  workflow_dispatch:

jobs:
  source-gate:
    runs-on: docker
    container:
      image: node:24-bookworm@sha256:934240a162082fd8b8a2f90cd5114446443f1eba1c5378f6687167ca405e6584
      volumes:
        - ember-ci-ccache:/root/.cache/ccache
        - /home/mythos/.config/ember/forgejo-root.crt:/etc/ssl/certs/otheru-forgejo-root.crt:ro
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify and test the publish commit
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || {
            echo "checkout does not match the event commit"
            exit 1
          }
          apt-get update
          apt-get install -y --no-install-recommends build-essential ccache cmake python3
          python3 ci/check_invariants.py
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DEMBER_STRICT=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j"$(nproc)"
          ccache --show-stats
          ctest --test-dir build --output-on-failure --timeout 120

  release-image:
    needs: source-gate
    runs-on: docker-build
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact checkout and target certification
        env:
          CERTIFIED_SHA: ${{ vars.EMBER_GFX1151_CERTIFIED_SHA }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || {
            echo "checkout does not match the tested event commit"
            exit 1
          }
          case "${GITHUB_REF:-}" in
            refs/tags/*)
              test -n "$CERTIFIED_SHA" || {
                echo 'Set EMBER_GFX1151_CERTIFIED_SHA after target-hardware validation'
                exit 1
              }
              test "$CERTIFIED_SHA" = "$GITHUB_SHA" || {
                echo "gfx1151 certification is for $CERTIFIED_SHA, not $GITHUB_SHA"
                exit 1
              }
              ;;
          esac

      - name: Validate registry configuration
        env:
          REGISTRY: ${{ vars.EMBER_REGISTRY }}
          IMAGE_NAME: ${{ vars.EMBER_IMAGE }}
        run: |
          test -n "$REGISTRY" || { echo 'Set repository variable EMBER_REGISTRY'; exit 1; }
          test -n "$IMAGE_NAME" || { echo 'Set repository variable EMBER_IMAGE'; exit 1; }

      - name: Log in to registry
        env:
          REGISTRY: ${{ vars.EMBER_REGISTRY }}
          USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: echo "$TOKEN" | docker login "$REGISTRY" --username "$USERNAME" --password-stdin

      - name: Reuse persistent Buildx builder
        run: |
          docker buildx inspect ember-release >/dev/null 2>&1 || \
            docker buildx create --name ember-release --driver docker-container
          docker buildx use ember-release
          docker buildx inspect --bootstrap

      - name: Build and publish minimal release image
        env:
          REGISTRY: ${{ vars.EMBER_REGISTRY }}
          IMAGE_NAME: ${{ vars.EMBER_IMAGE }}
        run: |
          short_sha="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          project_version="$(tr -d '\n' < VERSION)"
          printf '%s\n' "$project_version" | grep -Eq \
            '^[0-9]{4}\.([1-9]|1[0-2])\.([1-9]|[12][0-9]|3[01])$' || {
              echo "VERSION must use unpadded YEAR.MONTH.DAY: $project_version"
              exit 1
            }
          case "${GITHUB_REF:-}" in
            refs/tags/*)
              expected_tag="v$project_version"
              test "$GITHUB_REF_NAME" = "$expected_tag" || {
                echo "Release tag $GITHUB_REF_NAME does not match VERSION ($expected_tag)"
                exit 1
              }
              version="$project_version"
              ;;
            *) version="dev-$short_sha" ;;
          esac
          image="$REGISTRY/$IMAGE_NAME"
          tag_args=(
            --tag "$image:$version"
            --tag "$image:sha-$short_sha"
          )
          case "${GITHUB_REF:-}" in
            refs/tags/*) tag_args+=(--tag "$image:latest") ;;
          esac
          docker buildx build \
            --platform linux/amd64 \
            --target release \
            --build-arg EMBER_VERSION="$version" \
            --build-arg EMBER_VCS_REF="$GITHUB_SHA" \
            "${tag_args[@]}" \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file image-metadata.json \
            --output type=registry,compression=gzip,compression-level=9,force-compression=true \
            -f docker/Dockerfile .

      - name: Report immutable digest
        run: python3 -c 'import json; d=json.load(open("image-metadata.json")); print(d.get("containerimage.digest", d))'

      - name: Pull, size, and scan the published commit image
        env:
          REGISTRY: ${{ vars.EMBER_REGISTRY }}
          IMAGE_NAME: ${{ vars.EMBER_IMAGE }}
        run: |
          short_sha="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          image="$REGISTRY/$IMAGE_NAME:sha-$short_sha"
          docker pull "$image"
          docker image inspect --format \
            'release image: {{.Size}} bytes (uncompressed)' "$image"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ember-trivy-cache:/root/.cache/trivy \
            aquasec/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            image --image-src docker --exit-code 1 \
            --severity CRITICAL --ignore-unfixed "$image"
