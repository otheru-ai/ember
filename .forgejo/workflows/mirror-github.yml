# Forgejo is Ember's source of truth. This workflow publishes only main and
# version tags to GitHub, where public CI and GHCR publication run. A dedicated
# fine-grained GitHub token is passed through GIT_ASKPASS by the script; it is
# never embedded in a URL or persisted in git configuration.
name: Mirror code to GitHub

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: mirror-github-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: docker
    container:
      image: node:20-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Push the exact event ref to GitHub
        env:
          EMBER_GITHUB_MIRROR_TOKEN: ${{ secrets.EMBER_GITHUB_MIRROR_TOKEN }}
        run: bash ci/push_github_mirror.sh
