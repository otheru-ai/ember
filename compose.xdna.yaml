services:
  ember:
    image: ember:xdna-local
    pull_policy: build
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: release-xdna
      network: host
      args:
        EMBER_VERSION: ${EMBER_VERSION:-dev}
        EMBER_VCS_REF: ${EMBER_VCS_REF:-unknown}
    devices:
      - /dev/accel/accel0:/dev/accel/accel0
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      # Gen53 placement: GPU main projection + authoritative q=1 verifier,
      # XDNA2 resident draft projections/shared experts, CPU routed experts,
      # and target-isolated exact support capture.
      # The provider stays optional unless an equivalence run explicitly makes
      # it required; ordinary HIP DSpark remains the safe fallback.
      # Values below are genuine overrides: the plugin path has no default, and
      # XDNA_GPU_MAIN defaults to OFF in the binary (spec_env_flag treats unset
      # as false), so 1 here is a real choice rather than a restatement.
      - DFLASH_DSPARK_XDNA_PLUGIN=/usr/local/lib/ember/libember_xdna_dspark.so
      - DFLASH_DSPARK_XDNA_REQUIRED=${DFLASH_DSPARK_XDNA_REQUIRED:-0}
      - DFLASH_DSPARK_XDNA_GPU_MAIN=${DFLASH_DSPARK_XDNA_GPU_MAIN:-1}
      # These three only ever restated the binary's own defaults (4, off, 0), so
      # they are pass-through: settable by an operator, but not a second
      # declaration free to drift from the code.
      - DFLASH_DS4_SPEC_SHADOW_SUFFIX_ROWS
      - DFLASH_DS4_TIMING
      - DFLASH_DS4_RESIDENT_MIN_CONFIDENCE_MILLI
    command: ["--batch-sessions", "${EMBER_XDNA_BATCH_SESSIONS:-2}"]
