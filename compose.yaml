services:
  ember:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: release
      args:
        EMBER_VERSION: ${EMBER_VERSION:-dev}
        EMBER_VCS_REF: ${EMBER_VCS_REF:-unknown}
    image: ember:local
    init: true
    network_mode: host
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    ipc: host
    security_opt:
      - seccomp=unconfined
    volumes:
      # Writable so first start can download the model; later starts reuse it.
      - ${EMBER_MODELS_DIR:-./models}:/models
      - ${EMBER_CACHE_DIR:-./cache}:/cache
    environment:
      EMBER_MODEL: ${EMBER_MODEL:-}
      EMBER_DRAFT_MODEL: ${EMBER_DRAFT_MODEL:-}
      EMBER_AUTO_DOWNLOAD: ${EMBER_AUTO_DOWNLOAD:-1}
      EMBER_MODEL_REPO: ${EMBER_MODEL_REPO:-otheru/DeepSeek-V4-Flash-Strix-Halo-GGUF}
      EMBER_MODEL_FILE: ${EMBER_MODEL_FILE:-DeepSeek-V4-Flash-0731-Abliterated-ROCMFPx-Strix-Lean-2.58bpw.gguf}
      EMBER_MODEL_REVISION: ${EMBER_MODEL_REVISION:-f6e507774f7133568f6fec0635057cb20134f307}
      EMBER_MODEL_SHA256: ${EMBER_MODEL_SHA256-18aec8c0be4087007e557aa6020b28f12cd4c5d1f9c67b2a815c152aea97b3ed}
      EMBER_MODEL_SIZE_BYTES: ${EMBER_MODEL_SIZE_BYTES:-91547243104}
      EMBER_PORT: ${EMBER_PORT:-8080}
      EMBER_DRY_MULTIPLIER: ${EMBER_DRY_MULTIPLIER:-0}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:$${EMBER_PORT:-8080}/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20m
    restart: unless-stopped
    stop_grace_period: 2m

  ember-dev:
    profiles: [dev]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    image: ember:dev
    network_mode: host
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    ipc: host
    security_opt:
      - seccomp=unconfined
    volumes:
      - .:/workspace
      - ${EMBER_MODELS_DIR:-./models}:/models
      - ${EMBER_CACHE_DIR:-./cache}:/cache
    working_dir: /workspace
    entrypoint: ["/bin/bash"]
    stdin_open: true
    tty: true
