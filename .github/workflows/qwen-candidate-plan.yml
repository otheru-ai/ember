name: Qwen runner-local candidate construction plan

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
      intent_payload_base64:
        required: true
        type: string
      intent_payload_sha256:
        required: true
        type: string
      intent_output:
        required: true
        type: string
    outputs:
      operation_request:
        value: ${{ jobs.plan.outputs.operation_request }}
      operation_request_sha256:
        value: ${{ jobs.plan.outputs.operation_request_sha256 }}

permissions:
  contents: read

concurrency:
  # The stable dispatcher owns the global gfx1151 group through the following
  # construction call; this non-GPU nested planner must not queue behind it.
  group: qwen-candidate-plan-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: [self-hosted, linux, x64, gfx1151]
    timeout-minutes: 30
    outputs:
      operation_request: ${{ steps.generate.outputs.operation_request }}
      operation_request_sha256: ${{ steps.generate.outputs.operation_request_sha256 }}
    env:
      TARGET_SHA: ${{ inputs.commit_sha }}
      INTENT_PAYLOAD_BASE64: ${{ inputs.intent_payload_base64 }}
      INTENT_PAYLOAD_SHA256: ${{ inputs.intent_payload_sha256 }}
      INTENT_OUTPUT: ${{ inputs.intent_output }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Persist and derive one exact intervention construction request
        id: generate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$INTENT_PAYLOAD_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --quiet --exit-code
          python3 - "$INTENT_PAYLOAD_BASE64" "$INTENT_PAYLOAD_SHA256" \
              "$INTENT_OUTPUT" <<'PY'
          import base64, binascii, hashlib, os, pathlib, stat, sys

          encoded, expected_sha, output_raw = sys.argv[1:]
          root = pathlib.Path(
              "/var/tmp/ember-qwen3.8-flash-next/artifacts/qwen-workset/"
              "evidence/operation-requests")
          output = pathlib.Path(output_raw)

          def fail(message):
              raise SystemExit(message)

          if (not output.is_absolute() or output.parent != root
                  or output.name in {"", ".", ".."} or "\n" in output.name
                  or "\0" in output.name
                  or not output.name.startswith("candidate-intent-")
                  or output.suffix != ".json"):
              fail("candidate intent output is not one safe child of the fixed evidence root")
          if (not root.is_dir() or root.is_symlink()
                  or any(parent.is_symlink() for parent in output.parents)):
              fail("candidate intent evidence root is absent or unsafe")
          try:
              payload = base64.b64decode(encoded, validate=True)
          except (binascii.Error, ValueError) as exc:
              fail(f"candidate intent is not strict base64: {exc}")
          if not payload or len(payload) > 32768:
              fail("decoded candidate intent must contain 1..32768 bytes")
          if hashlib.sha256(payload).hexdigest() != expected_sha:
              fail("decoded candidate intent digest differs")
          flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, "O_NOFOLLOW", 0)
          try:
              descriptor = os.open(output, flags, 0o600)
          except FileExistsError:
              if (output.is_symlink() or not output.is_file()
                      or hashlib.sha256(output.read_bytes()).hexdigest() != expected_sha):
                  fail("existing candidate intent differs")
          else:
              with os.fdopen(descriptor, "wb", closefd=True) as stream:
                  stream.write(payload); stream.flush(); os.fsync(stream.fileno())
              directory = os.open(root, os.O_RDONLY | getattr(os, "O_DIRECTORY", 0))
              try:
                  os.fsync(directory)
              finally:
                  os.close(directory)
          metadata = output.lstat()
          if (output.is_symlink() or not stat.S_ISREG(metadata.st_mode)
                  or metadata.st_size != len(payload)
                  or hashlib.sha256(output.read_bytes()).hexdigest() != expected_sha):
              fail("persisted candidate intent identity differs")
          PY
          result="$(python3 scripts/qwen_candidate_request.py \
            --intent "$INTENT_OUTPUT" --intent-sha256 "$INTENT_PAYLOAD_SHA256" \
            --ember-revision "$TARGET_SHA")"
          generated_output="$(python3 - "$result" <<'PY'
          import json,re,sys
          value=json.loads(sys.argv[1]); request=value.get("operation_request")
          if (value.get("status")!="complete" or value.get("mode")!="build-candidate"
                  or value.get("publishes") is not False or value.get("deletes") is not False
                  or not isinstance(request,dict) or set(request)!={"path","sha256"}
                  or not request["path"].startswith("/")
                  or re.fullmatch(r"[0-9a-f]{64}",str(request["sha256"])) is None):
              raise SystemExit("candidate planner did not produce one exact construction request")
          print(request["path"]);print(request["sha256"])
          PY
          )"
          mapfile -t generated <<<"$generated_output"
          (( ${#generated[@]} == 2 ))
          printf 'operation_request=%s\noperation_request_sha256=%s\n' \
            "${generated[0]}" "${generated[1]}" >>"$GITHUB_OUTPUT"

      - name: Summarize the nonpublishing candidate construction handoff
        run: |
          {
            echo '## Qwen candidate construction planned'
            echo
            echo "Intent: \`$INTENT_OUTPUT\`"
            echo "Intent SHA-256: \`$INTENT_PAYLOAD_SHA256\`"
            echo "Construction request: \`${{ steps.generate.outputs.operation_request }}\`"
            echo "Construction request SHA-256: \`${{ steps.generate.outputs.operation_request_sha256 }}\`"
            echo 'The planner did not acquire the GPU, publish, or delete artifacts.'
          } >>"$GITHUB_STEP_SUMMARY"
