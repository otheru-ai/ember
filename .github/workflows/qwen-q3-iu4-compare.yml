name: Qwen matched Q3 IU4 hardware comparison

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
      q3_construction:
        required: true
        type: string
      q3_construction_sha256:
        required: true
        type: string
      q3_hardware:
        required: true
        type: string
      q3_hardware_sha256:
        required: true
        type: string
      iu4_construction:
        required: true
        type: string
      iu4_construction_sha256:
        required: true
        type: string
      output:
        required: true
        type: string

permissions:
  contents: read
  packages: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: qwen-q3-iu4-compare-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  compare:
    runs-on: [self-hosted, linux, x64, gfx1151]
    timeout-minutes: 180
    env:
      TARGET_SHA: ${{ inputs.commit_sha }}
      Q3_CONSTRUCTION: ${{ inputs.q3_construction }}
      Q3_CONSTRUCTION_SHA256: ${{ inputs.q3_construction_sha256 }}
      Q3_HARDWARE: ${{ inputs.q3_hardware }}
      Q3_HARDWARE_SHA256: ${{ inputs.q3_hardware_sha256 }}
      IU4_CONSTRUCTION: ${{ inputs.iu4_construction }}
      IU4_CONSTRUCTION_SHA256: ${{ inputs.iu4_construction_sha256 }}
      COMPARISON_OUTPUT: ${{ inputs.output }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Validate Q3 prerequisite and bind the exact IU4 candidate
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --quiet --exit-code
          for digest in "$Q3_CONSTRUCTION_SHA256" "$Q3_HARDWARE_SHA256" \
                        "$IU4_CONSTRUCTION_SHA256"; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          done
          python3 - "$COMPARISON_OUTPUT" <<'PY'
          import os, pathlib, re, sys
          output = pathlib.Path(sys.argv[1])
          root = pathlib.Path(
              "/var/tmp/ember-qwen3.8-flash-next/artifacts/qwen-workset/evidence/comparisons")
          if (not output.is_absolute() or output.parent != root
                  or re.fullmatch(r"q3-iu4-[a-z0-9][a-z0-9._-]{0,79}", output.name) is None):
              raise SystemExit("comparison output escapes its fixed root or has an unsafe name")
          for parent in (root.parent.parent.parent, root.parent.parent, root.parent):
              if not parent.is_dir() or parent.is_symlink():
                  raise SystemExit(f"comparison parent differs: {parent}")
          if not root.exists():
              root.mkdir(mode=0o700)
          if not root.is_dir() or root.is_symlink():
              raise SystemExit("comparison root is not one real directory")
          if output.exists() or output.is_symlink():
              raise SystemExit("comparison output already exists")
          output.mkdir(mode=0o700)
          directory = os.open(root, os.O_RDONLY | getattr(os, "O_DIRECTORY", 0))
          try: os.fsync(directory)
          finally: os.close(directory)
          PY
          python3 scripts/qwen_quant_comparison.py validate-arm --arm q3 \
            --construction "$Q3_CONSTRUCTION" \
            --construction-sha256 "$Q3_CONSTRUCTION_SHA256" \
            --hardware "$Q3_HARDWARE" --hardware-sha256 "$Q3_HARDWARE_SHA256" \
            --output "$COMPARISON_OUTPUT/q3-prerequisite.json"
          python3 scripts/qwen_quant_comparison.py validate-pair \
            --q3-construction "$Q3_CONSTRUCTION" \
            --q3-construction-sha256 "$Q3_CONSTRUCTION_SHA256" \
            --iu4-construction "$IU4_CONSTRUCTION" \
            --iu4-construction-sha256 "$IU4_CONSTRUCTION_SHA256" \
            --output "$COMPARISON_OUTPUT/construction-pair.json"
          mapfile -t bound < <(python3 - "$COMPARISON_OUTPUT/construction-pair.json" \
              "$TARGET_SHA" <<'PY'
          import json, pathlib, re, sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text())
          target = sys.argv[2]
          if (value.get("schema") != "ember.qwen3.8.q3-iu4-construction-pair.v1"
                  or value.get("status") != "complete"
                  or value.get("publishes") is not False
                  or value.get("selection_allowed") is not False
                  or ((value.get("matched_identity") or {}).get("runtime") or {}).get(
                      "runtime_revision") != target):
              raise SystemExit("Q3/IU4 construction pair differs")
          binding = value.get("iu4") or {}
          if (binding.get("schema") != "ember.qwen3.8.quant-benchmark-binding.v1"
                  or binding.get("status") != "complete"
                  or binding.get("quantization_arm") != "rocmi4-q6k-embedding-head"
                  or binding.get("compute_mode") != "exact_dequant"
                  or binding.get("w4a4_enabled") is not False
                  or (binding.get("mtp") or {}).get("matrix_quant_contract") !=
                     "Q4_0_ROCMFP4_FAST"
                  or (binding.get("mtp") or {}).get("depth") != 3):
              raise SystemExit("IU4 benchmark binding differs")
          model=binding["model"]; build=binding["build_record"]; mtp=binding["mtp"]
          runtime=binding["runtime"]
          fields=(binding["candidate_id"], model["path"], model["sha256"],
                  str(model["total_bytes"]), build["path"], build["sha256"],
                  mtp["path"], mtp["sha256"], runtime["release_ref"],
                  runtime["release_digest"], runtime["dev_ref"], runtime["dev_digest"])
          if any("\n" in str(item) or "\0" in str(item) for item in fields):
              raise SystemExit("IU4 binding contains an unsafe value")
          for item in fields: print(item)
          PY
          )
          (( ${#bound[@]} == 12 ))
          names=(IU4_CANDIDATE_ID MODEL MODEL_SHA256 MODEL_TOTAL_BYTES BUILD_RECORD \
                 BUILD_RECORD_SHA256 MTP MTP_SHA256 RUNTIME_IMAGE \
                 RUNTIME_IMAGE_DIGEST RUNTIME_DEV_IMAGE RUNTIME_DEV_IMAGE_DIGEST)
          for index in "${!names[@]}"; do
            printf '%s=%s\n' "${names[$index]}" "${bound[$index]}" >>"$GITHUB_ENV"
          done
          docker_config="$RUNNER_TEMP/qwen-q3-iu4-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          install -d -m 700 "$docker_config"
          printf 'DOCKER_CONFIG=%s\n' "$docker_config" >>"$GITHUB_ENV"
          export DOCKER_CONFIG="$docker_config"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          docker pull "${bound[8]}"
          docker pull "${bound[10]}"
          python3 - "${bound[8]}" "${bound[9]}" "${bound[10]}" "${bound[11]}" \
              "$TARGET_SHA" <<'PY'
          import json, re, subprocess, sys
          release, release_digest, dev, dev_digest, revision = sys.argv[1:]
          for ref, expected in ((release, release_digest), (dev, dev_digest)):
              rows=json.loads(subprocess.check_output(["docker","image","inspect",ref]))
              if (len(rows) != 1 or expected not in {
                      item.split("@",1)[1] for item in rows[0].get("RepoDigests",[])
                      if "@" in item}):
                  raise SystemExit("runtime image digest differs")
              label=((rows[0].get("Config") or {}).get("Labels") or {}).get(
                  "org.opencontainers.image.revision")
              if label != revision:
                  raise SystemExit("runtime image revision differs")
          PY
          engine_sha="$(docker run --rm --entrypoint sha256sum "${bound[8]}" \
            /usr/local/bin/ember-dflash | awk '{print $1}')"
          [[ "$engine_sha" =~ ^[0-9a-f]{64}$ ]]
          printf 'RUNTIME_ENGINE_SHA256=%s\n' "$engine_sha" >>"$GITHUB_ENV"

      - name: Run the complete matched IU4 real-weight benchmark
        run: |
          set -euo pipefail
          gate_output="$COMPARISON_OUTPUT/iu4-full-benchmark"
          timeout --signal=TERM --kill-after=15m 120m \
            scripts/qwen_real_weight_gate.sh \
            --image "$RUNTIME_IMAGE" --image-digest "$RUNTIME_IMAGE_DIGEST" \
            --profile-image "$RUNTIME_DEV_IMAGE" \
            --profile-image-digest "$RUNTIME_DEV_IMAGE_DIGEST" \
            --model "$MODEL" --model-sha256 "$MODEL_SHA256" \
            --model-build-record "$BUILD_RECORD" \
            --model-build-record-sha256 "$BUILD_RECORD_SHA256" \
            --mtp "$MTP" --mtp-sha256 "$MTP_SHA256" --mtp-depth 3 \
            --integrity-cache "/var/tmp/ember-qwen3.8-flash-next/artifacts/qwen-workset/evidence/.artifact-integrity-v1.json" \
            --measurement-only --out-dir "$gate_output"
          evidence="$gate_output/hardware-measured.json"
          test -f "$evidence" && test ! -L "$evidence"
          printf 'IU4_HARDWARE=%s\nIU4_HARDWARE_SHA256=%s\n' \
            "$evidence" "$(sha256sum "$evidence" | awk '{print $1}')" >>"$GITHUB_ENV"

      - name: Surface retained IU4 benchmark diagnostics
        if: ${{ failure() && env.COMPARISON_OUTPUT != '' }}
        run: |
          set -euo pipefail
          for name in differential.json \
                      differential-decode-comparison.json \
                      differential-dispatch-server.log \
                      timing.jsonl \
                      timing-server.log \
                      timing-server-failure.log; do
            path="$COMPARISON_OUTPUT/iu4-full-benchmark/$name"
            if [[ -f "$path" && ! -L "$path" ]]; then
              printf '===== %s (%s bytes) =====\n' "$name" "$(stat -c %s -- "$path")"
              tail -n 1024 -- "$path"
            else
              printf '===== %s was not created =====\n' "$name"
            fi
          done

      - name: Compare matched Q3 and IU4 evidence
        run: |
          set -euo pipefail
          comparison="$COMPARISON_OUTPUT/q3-vs-iu4-hardware-comparison.json"
          python3 scripts/qwen_quant_comparison.py compare \
            --q3-construction "$Q3_CONSTRUCTION" \
            --q3-construction-sha256 "$Q3_CONSTRUCTION_SHA256" \
            --q3-hardware "$Q3_HARDWARE" --q3-hardware-sha256 "$Q3_HARDWARE_SHA256" \
            --iu4-construction "$IU4_CONSTRUCTION" \
            --iu4-construction-sha256 "$IU4_CONSTRUCTION_SHA256" \
            --iu4-hardware "$IU4_HARDWARE" \
            --iu4-hardware-sha256 "$IU4_HARDWARE_SHA256" \
            --output "$comparison"
          printf 'COMPARISON_EVIDENCE=%s\nCOMPARISON_EVIDENCE_SHA256=%s\n' \
            "$comparison" "$(sha256sum "$comparison" | awk '{print $1}')" >>"$GITHUB_ENV"

      - name: Attest IU4 hardware evidence
        if: success()
        id: attest_iu4
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-path: ${{ env.IU4_HARDWARE }}

      - name: Attest matched comparison evidence
        if: success()
        id: attest_comparison
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-path: ${{ env.COMPARISON_EVIDENCE }}

      - name: Retain and verify attestations
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          IU4_BUNDLE_SOURCE: ${{ steps.attest_iu4.outputs.bundle-path }}
          COMPARISON_BUNDLE_SOURCE: ${{ steps.attest_comparison.outputs.bundle-path }}
        run: |
          set -euo pipefail
          iu4_bundle="$COMPARISON_OUTPUT/iu4-full-benchmark/hardware-measured.sigstore.json"
          comparison_bundle="$COMPARISON_OUTPUT/q3-vs-iu4-hardware-comparison.sigstore.json"
          install -m 0600 -- "$IU4_BUNDLE_SOURCE" "$iu4_bundle"
          install -m 0600 -- "$COMPARISON_BUNDLE_SOURCE" "$comparison_bundle"
          for pair in "$IU4_HARDWARE:$iu4_bundle" \
                      "$COMPARISON_EVIDENCE:$comparison_bundle"; do
            subject="${pair%%:*}"; bundle="${pair#*:}"
            gh attestation verify "$subject" --bundle "$bundle" \
              --repo OtherU-AI/ember \
              --signer-workflow OtherU-AI/ember/.github/workflows/qwen-q3-iu4-compare.yml \
              --source-digest "$TARGET_SHA" --signer-digest "$TARGET_SHA" >/dev/null
          done

      - name: Remove temporary registry credentials
        if: always() && env.DOCKER_CONFIG != ''
        run: |
          rm -f -- "$DOCKER_CONFIG/config.json"
          rmdir -- "$DOCKER_CONFIG" 2>/dev/null || true

      - name: Record matched descriptive comparison
        if: success()
        run: |
          python3 - "$COMPARISON_EVIDENCE" >>"$GITHUB_STEP_SUMMARY" <<'PY'
          import json, pathlib, sys
          value=json.loads(pathlib.Path(sys.argv[1]).read_text())
          q3=value["arms"]["q3"]["metrics"]; iu4=value["arms"]["iu4"]["metrics"]
          delta=value["deltas"]
          print("## Qwen matched Q3 versus IU4 benchmark completed\n")
          print(f"Q3 prefill peak / decode median: `{q3['prefill_peak_tps']} / {q3['decode_median_tps']} tok/s`")
          print(f"IU4 prefill peak / decode median: `{iu4['prefill_peak_tps']} / {iu4['decode_median_tps']} tok/s`")
          for label, metrics in (("Q3", q3), ("IU4", iu4)):
              print(f"{label} clean MTP acceptance: `{metrics['clean_mtp_accept_rate']}`")
              print(f"{label} same-process AR / warm MTP: "
                    f"`{metrics['differential_ar_tps']} / "
                    f"{metrics['differential_warm_mtp_tps']} tok/s`")
              print(f"{label} differential MTP acceptance / speedup: "
                    f"`{metrics['differential_mtp_accept_rate']} / "
                    f"{metrics['differential_warm_mtp_speedup_vs_ar']}x`")
          print("IU4−Q3 decode median / AR / warm-MTP deltas: "
                f"`{delta['iu4_minus_q3_decode_median_tps']} / "
                f"{delta['iu4_minus_q3_differential_ar_tps']} / "
                f"{delta['iu4_minus_q3_differential_warm_mtp_tps']} tok/s`")
          print(f"Comparison evidence: `{sys.argv[1]}`")
          print("Selection allowed: `false` — the counterbalanced bakeoff remains authoritative.")
          PY

      - name: Upload bounded comparison evidence
        if: ${{ always() && env.COMPARISON_OUTPUT != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qwen-q3-iu4-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.COMPARISON_OUTPUT }}/*.json
            ${{ env.COMPARISON_OUTPUT }}/*.sigstore.json
            ${{ env.COMPARISON_OUTPUT }}/iu4-full-benchmark/*.json
            ${{ env.COMPARISON_OUTPUT }}/iu4-full-benchmark/*.jsonl
            ${{ env.COMPARISON_OUTPUT }}/iu4-full-benchmark/*.log
            ${{ env.COMPARISON_OUTPUT }}/iu4-full-benchmark/*.txt
            ${{ env.COMPARISON_OUTPUT }}/iu4-full-benchmark/profile/**
          if-no-files-found: warn
          retention-days: 30
