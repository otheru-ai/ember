name: Qwen gfx1151 sequential quant bakeoff

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character runtime Ember revision (artifact builder may differ)
        required: true
        type: string
      candidate_manifest:
        description: Absolute runner path to one immutable v3 candidate/workset manifest
        required: true
        type: string
      candidate_manifest_sha256:
        description: Exact lowercase SHA-256 of the candidate manifest
        required: true
        type: string
      phase:
        description: Canonical sequential phase
        required: true
        type: choice
        options: [sweep, format, mtp-depth, final]
      phase_request:
        description: Exact accumulator/prior-ledger attestation request manifest
        required: true
        type: string
      phase_request_sha256:
        description: SHA-256 of the phase request manifest
        required: true
        type: string

permissions:
  contents: read
  packages: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: gfx1151-certification
  cancel-in-progress: false

jobs:
  sequential-bakeoff:
    runs-on: [self-hosted, linux, x64, gfx1151]
    timeout-minutes: 1440
    env:
      TARGET_SHA: ${{ inputs.commit_sha }}
      CANDIDATE_MANIFEST: ${{ inputs.candidate_manifest }}
      CANDIDATE_MANIFEST_SHA256: ${{ inputs.candidate_manifest_sha256 }}
      QWEN_BAKEOFF_PHASE: ${{ inputs.phase }}
      QWEN_PHASE_REQUEST: ${{ inputs.phase_request }}
      QWEN_PHASE_REQUEST_SHA256: ${{ inputs.phase_request_sha256 }}
      ATTEST_REPOSITORY: OtherU-AI/ember
      ATTEST_WORKFLOW: .github/workflows/qwen-gfx1151-bakeoff.yml
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Bind one workset, immutable cache, companions, identities, and sealed phase
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          [[ "$CANDIDATE_MANIFEST" = /* && -f "$CANDIDATE_MANIFEST" && ! -L "$CANDIDATE_MANIFEST" ]]
          [[ "$CANDIDATE_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum "$CANDIDATE_MANIFEST" | awk '{print $1}')" = "$CANDIDATE_MANIFEST_SHA256"
          [[ "$QWEN_BAKEOFF_PHASE" =~ ^(sweep|format|mtp-depth|final)$ ]]
          [[ "$QWEN_PHASE_REQUEST" = /* && -f "$QWEN_PHASE_REQUEST" && ! -L "$QWEN_PHASE_REQUEST" ]]
          [[ "$QWEN_PHASE_REQUEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum "$QWEN_PHASE_REQUEST" | awk '{print $1}')" = "$QWEN_PHASE_REQUEST_SHA256"
          test -x /usr/local/sbin/ember-gpu-lock
          test -x /usr/local/sbin/ember-cert-production

          mapfile -t phase_request < <(python3 - "$QWEN_PHASE_REQUEST" \
              "$QWEN_BAKEOFF_PHASE" <<'PY'
          import json,pathlib,re,sys
          path,phase=sys.argv[1:]
          value=json.loads(pathlib.Path(path).read_text())
          if (not isinstance(value,dict) or set(value)!={"schema","phase","results_accumulator",
                  "prior_ledger","publishes","deletes"}
                  or value.get("schema")!="ember.qwen3.8.sequential-bakeoff-phase-request.v1"
                  or value.get("phase")!=phase or value.get("publishes") is not False
                  or value.get("deletes") is not False):
              raise SystemExit("bakeoff phase request schema/phase/lifecycle differs")
          def attested(name,schema,required):
              item=value.get(name)
              if item is None:
                  if required: raise SystemExit(f"{name} is required for {phase}")
                  return "","","",""
              if not isinstance(item,dict) or set(item)!={"subject","bundle"}:
                  raise SystemExit(f"{name} attestation descriptor is malformed")
              subject=item.get("subject"); bundle=item.get("bundle")
              if (not isinstance(subject,dict) or set(subject)!={"path","sha256","schema"}
                      or subject.get("schema")!=schema or not isinstance(bundle,dict)
                      or set(bundle)!={"path","sha256"}):
                  raise SystemExit(f"{name} subject/bundle schema differs")
              values=(subject["path"],subject["sha256"],bundle["path"],bundle["sha256"])
              if (any(not isinstance(item,str) or "\n" in item or "\0" in item for item in values)
                      or not subject["path"].startswith("/") or not bundle["path"].startswith("/")
                      or any(re.fullmatch(r"[0-9a-f]{64}",digest) is None
                             for digest in (subject["sha256"],bundle["sha256"]))):
                  raise SystemExit(f"{name} path/digest is malformed")
              return values
          accumulator=attested("results_accumulator",
              "ember.qwen3.8.sequential-bakeoff-accumulator.v2",False)
          ledger=attested("prior_ledger","ember.qwen3.8.sequential-bakeoff-ledger.v3",
                          phase!="sweep")
          if phase=="sweep" and value.get("prior_ledger") is not None:
              raise SystemExit("sweep phase forbids a prior ledger")
          print("\n".join((*accumulator,*ledger)))
          PY
          )
          (( ${#phase_request[@]} == 8 ))
          QWEN_RESULTS_ACCUMULATOR="${phase_request[0]}"
          QWEN_RESULTS_ACCUMULATOR_SHA256="${phase_request[1]}"
          QWEN_RESULTS_ACCUMULATOR_BUNDLE="${phase_request[2]}"
          QWEN_RESULTS_ACCUMULATOR_BUNDLE_SHA256="${phase_request[3]}"
          QWEN_PRIOR_LEDGER="${phase_request[4]}"
          QWEN_PRIOR_LEDGER_SHA256="${phase_request[5]}"
          QWEN_PRIOR_LEDGER_BUNDLE="${phase_request[6]}"
          QWEN_PRIOR_LEDGER_BUNDLE_SHA256="${phase_request[7]}"
          for name in QWEN_RESULTS_ACCUMULATOR QWEN_RESULTS_ACCUMULATOR_SHA256 \
              QWEN_RESULTS_ACCUMULATOR_BUNDLE QWEN_RESULTS_ACCUMULATOR_BUNDLE_SHA256 \
              QWEN_PRIOR_LEDGER QWEN_PRIOR_LEDGER_SHA256 QWEN_PRIOR_LEDGER_BUNDLE \
              QWEN_PRIOR_LEDGER_BUNDLE_SHA256; do
            export "$name"
            printf '%s=%s\n' "$name" "${!name}" >>"$GITHUB_ENV"
          done

          attest_verify() {
            local subject="$1" subject_sha="$2" bundle="$3" bundle_sha="$4"
            [[ "$subject" = /* && -f "$subject" && ! -L "$subject" ]]
            [[ "$bundle" = /* && -f "$bundle" && ! -L "$bundle" ]]
            [[ "$subject_sha" =~ ^[0-9a-f]{64}$ && "$bundle_sha" =~ ^[0-9a-f]{64}$ ]]
            test "$(sha256sum "$subject" | awk '{print $1}')" = "$subject_sha"
            test "$(sha256sum "$bundle" | awk '{print $1}')" = "$bundle_sha"
            gh attestation verify "$subject" --bundle "$bundle" --repo "$ATTEST_REPOSITORY" \
              --signer-workflow "$ATTEST_WORKFLOW" >/dev/null
          }
          prior_count=0
          if [[ -n "$QWEN_RESULTS_ACCUMULATOR" ]]; then
            attest_verify "$QWEN_RESULTS_ACCUMULATOR" "$QWEN_RESULTS_ACCUMULATOR_SHA256" \
              "$QWEN_RESULTS_ACCUMULATOR_BUNDLE" "$QWEN_RESULTS_ACCUMULATOR_BUNDLE_SHA256"
            prior_count="$(python3 - "$QWEN_RESULTS_ACCUMULATOR" <<'PY'
          import json, pathlib, sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if value.get("schema") != "ember.qwen3.8.sequential-bakeoff-accumulator.v2":
              raise SystemExit("prior accumulator schema differs")
          rows = value.get("assessments")
          if not isinstance(rows, list):
              raise SystemExit("prior accumulator has no compact assessment descriptors")
          print(len(rows))
          PY
            )"
          else
            test -z "$QWEN_RESULTS_ACCUMULATOR_SHA256$QWEN_RESULTS_ACCUMULATOR_BUNDLE$QWEN_RESULTS_ACCUMULATOR_BUNDLE_SHA256"
          fi
          if [[ "$QWEN_BAKEOFF_PHASE" = sweep ]]; then
            test -z "$QWEN_PRIOR_LEDGER$QWEN_PRIOR_LEDGER_SHA256$QWEN_PRIOR_LEDGER_BUNDLE$QWEN_PRIOR_LEDGER_BUNDLE_SHA256"
          else
            attest_verify "$QWEN_PRIOR_LEDGER" "$QWEN_PRIOR_LEDGER_SHA256" \
              "$QWEN_PRIOR_LEDGER_BUNDLE" "$QWEN_PRIOR_LEDGER_BUNDLE_SHA256"
          fi

          mapfile -t manifest < <(python3 - "$CANDIDATE_MANIFEST" "$QWEN_BAKEOFF_PHASE" "$TARGET_SHA" <<'PY'
          import hashlib, json, pathlib, re, sys
          p = pathlib.Path(sys.argv[1]); phase, runtime_revision = sys.argv[2:]
          m = json.loads(p.read_text())
          if m.get("schema") != "ember.qwen3.8.sequential-bakeoff-candidate.v3":
              raise SystemExit("candidate manifest schema differs")
          if m.get("runtime_revision") != runtime_revision:
              raise SystemExit("runtime engine revision differs from dispatch revision")
          builder_revision = m.get("builder_revision")
          if not isinstance(builder_revision, str) or not re.fullmatch(r"[0-9a-f]{40}", builder_revision):
              raise SystemExit("artifact builder revision is not exact")
          c = m.get("candidate")
          if not isinstance(c, dict):
              raise SystemExit("one-candidate-per-dispatch is required")
          if c.get("stage") not in ({"stock", "sweep"} if phase == "sweep" else {phase}):
              raise SystemExit("candidate stage differs from dispatch phase")
          for key in ("selection_plan", "bf16_cache", "builder_attestation", "build_record"):
              d = c.get(key) if key == "builder_attestation" else m.get(key)
              if not isinstance(d, dict) or set(d) != {"path", "sha256"}:
                  raise SystemExit(f"{key} descriptor is not exact")
              path=pathlib.Path(d["path"])
              if path.is_symlink() or not path.is_file(): raise SystemExit(f"{key} is not a regular file")
              if hashlib.sha256(path.read_bytes()).hexdigest() != d["sha256"]:
                  raise SystemExit(f"{key} digest differs")
          cache = m["bf16_cache"]
          cache_path = pathlib.Path(cache["path"]).resolve()
          workset = pathlib.Path(m["workset_root"]).resolve()
          if workset not in cache_path.parents or "bf16-cache" not in cache_path.parts:
              raise SystemExit("BF16 cache is not content-addressed beneath the workset")
          companions = m.get("shared_companions")
          if not isinstance(companions, dict) or set(companions) != {
                  "Q4_0_ROCMI4", "Q4_0_ROCMFP4_FAST"}:
              raise SystemExit("shared MTP/mmproj companion inventories are incomplete")
          companion = companions.get(c.get("mtp_matrix_quant_contract"))
          if not isinstance(companion, dict) or set(companion) != {"path", "sha256"}:
              raise SystemExit("candidate has no exact shared companion inventory")
          images = m.get("images") or {}; builder = images.get("builder") or {}; runtime = images.get("runtime") or {}
          for row, keys in ((builder, {"ref", "digest"}),
                            (runtime, {"release_ref", "release_digest", "dev_ref", "dev_digest",
                                       "tensor_format_contract_sha256"})):
              if set(row) != keys:
                  raise SystemExit("builder/runtime image identities are not separate and exact")
          if phase == "final" and c.get("corpus_sha256") is not None:
              raise SystemExit("final corpus must remain unavailable in the candidate manifest")
          elif phase != "final" and not re.fullmatch(r"[0-9a-f]{64}", str(c.get("corpus_sha256", ""))):
              raise SystemExit("selection-only corpus digest is missing")
          values = [m["selection_plan"]["path"], m["selection_plan"]["sha256"],
                    str(workset), m["corpus_dir"], m["evidence_root"], builder_revision,
                    builder["ref"], builder["digest"], runtime["release_ref"], runtime["release_digest"],
                    runtime["dev_ref"], runtime["dev_digest"], runtime["tensor_format_contract_sha256"],
                    c["id"], c["candidate_id"],
                    c["builder_attestation"]["path"], c["builder_attestation"]["sha256"],
                    m["build_record"]["path"], m["build_record"]["sha256"],
                    companion["path"], companion["sha256"], str(c.get("corpus_sha256") or "")]
          if any("\n" in str(v) for v in values): raise SystemExit("manifest value contains newline")
          print("\n".join(map(str, values)))
          PY
          )
          (( ${#manifest[@]} == 22 ))
          SELECTION_PLAN="${manifest[0]}"; SELECTION_PLAN_SHA256="${manifest[1]}"
          QWEN_WORKSET_ROOT="${manifest[2]}"; QWEN_CORPUS_DIR="${manifest[3]}"; QWEN_BAKEOFF_EVIDENCE_ROOT="${manifest[4]}"
          BUILDER_SHA="${manifest[5]}"; BUILDER_IMAGE="${manifest[6]}"; BUILDER_IMAGE_DIGEST="${manifest[7]}"
          RUNTIME_IMAGE="${manifest[8]}"; RUNTIME_IMAGE_DIGEST="${manifest[9]}"
          RUNTIME_DEV_IMAGE="${manifest[10]}"; RUNTIME_DEV_IMAGE_DIGEST="${manifest[11]}"
          RUNTIME_FORMAT_SHA256="${manifest[12]}"
          CANDIDATE_ROW_ID="${manifest[13]}"; CANDIDATE_ARTIFACT_ID="${manifest[14]}"
          BUILDER_ATTESTATION="${manifest[15]}"; BUILDER_ATTESTATION_SHA256="${manifest[16]}"
          BUILD_RECORD="${manifest[17]}"; BUILD_RECORD_SHA256="${manifest[18]}"
          COMPANION_INVENTORY="${manifest[19]}"; COMPANION_INVENTORY_SHA256="${manifest[20]}"
          CORPUS_SHA256="${manifest[21]}"
          for descriptor in "$SELECTION_PLAN:$SELECTION_PLAN_SHA256" "$BUILDER_ATTESTATION:$BUILDER_ATTESTATION_SHA256" \
                            "$BUILD_RECORD:$BUILD_RECORD_SHA256" "$COMPANION_INVENTORY:$COMPANION_INVENTORY_SHA256"; do
            path="${descriptor%:*}"; digest="${descriptor##*:}"
            [[ "$path" = /* && -f "$path" && ! -L "$path" && "$digest" =~ ^[0-9a-f]{64}$ ]]
            test "$(sha256sum "$path" | awk '{print $1}')" = "$digest"
          done
          mkdir -p -- "$QWEN_BAKEOFF_EVIDENCE_ROOT"
          python3 scripts/qwen_bakeoff.py --plan "$SELECTION_PLAN" --stage verify \
            --output "$QWEN_BAKEOFF_EVIDENCE_ROOT/$QWEN_BAKEOFF_PHASE-$CANDIDATE_ROW_ID-selection-plan-verified-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          python3 - "$SELECTION_PLAN" "$QWEN_BAKEOFF_PHASE" "$CANDIDATE_ROW_ID" \
            "$prior_count" "$QWEN_RESULTS_ACCUMULATOR" "$SELECTION_PLAN_SHA256" \
            "$CORPUS_SHA256" <<'PY'
          import json, pathlib, sys
          plan_path,phase,row_id,count,accumulator,plan_sha,corpus_sha=sys.argv[1:]
          plan=json.loads(pathlib.Path(plan_path).read_text()); count=int(count)
          if phase == "sweep":
              expected=[plan["stock_control"]["id"],*[x["id"] for x in plan["sweep_configurations"]]]
          elif phase == "format": expected=[x["id"] for x in plan["format_arms"]]
          elif phase == "mtp-depth": expected=[x["id"] for x in plan["mtp_depth_configurations"]]
          else: expected=["final-confirmation"]
          if count >= len(expected) or row_id != expected[count]:
              raise SystemExit("candidate is not the next row in the canonical serial phase order")
          if phase != "final" and corpus_sha != plan["corpora"]["sweep-validation.jsonl"]["sha256"]:
              raise SystemExit("selection candidate is not bound to the selection-only corpus")
          if accumulator:
              old=json.loads(pathlib.Path(accumulator).read_text())
              if old.get("phase") != phase or old.get("plan_sha256") != plan_sha:
                  raise SystemExit("prior accumulator belongs to another phase or plan")
          PY
          EFFECTIVE_PLAN="$SELECTION_PLAN"
          EFFECTIVE_PLAN_SHA256="$SELECTION_PLAN_SHA256"
          if [[ "$QWEN_BAKEOFF_PHASE" = final ]]; then
            EFFECTIVE_PLAN="$QWEN_BAKEOFF_EVIDENCE_ROOT/final-$CANDIDATE_ROW_ID-plan-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
            python3 scripts/qwen_bakeoff.py --plan "$SELECTION_PLAN" --stage unlock-final \
              --corpus-dir "$QWEN_CORPUS_DIR" --prior-ledger "$QWEN_PRIOR_LEDGER" \
              --prior-ledger-sha256 "$QWEN_PRIOR_LEDGER_SHA256" \
              --prior-attestation-bundle "$QWEN_PRIOR_LEDGER_BUNDLE" \
              --prior-attestation-bundle-sha256 "$QWEN_PRIOR_LEDGER_BUNDLE_SHA256" \
              --output "$EFFECTIVE_PLAN"
            EFFECTIVE_PLAN_SHA256="$(python3 - "$EFFECTIVE_PLAN" <<'PY'
          import hashlib, json, pathlib, sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text())
          print(hashlib.sha256(json.dumps(value, sort_keys=True, separators=(",", ":"),
                                            ensure_ascii=True).encode()).hexdigest())
          PY
            )"
            CORPUS_SHA256="$(python3 - "$EFFECTIVE_PLAN" <<'PY'
          import json, pathlib, sys
          p = json.loads(pathlib.Path(sys.argv[1]).read_text())
          print(p["corpora"]["final-heldout.jsonl"]["sha256"])
          PY
            )"
          fi

          for pair in \
            "SELECTION_PLAN=$SELECTION_PLAN" "SELECTION_PLAN_SHA256=$SELECTION_PLAN_SHA256" \
            "EFFECTIVE_PLAN=$EFFECTIVE_PLAN" "EFFECTIVE_PLAN_SHA256=$EFFECTIVE_PLAN_SHA256" \
            "QWEN_BAKEOFF_EVIDENCE_ROOT=$QWEN_BAKEOFF_EVIDENCE_ROOT" \
            "QWEN_WORKSET_ROOT=$QWEN_WORKSET_ROOT" "CANDIDATE_ROW_ID=$CANDIDATE_ROW_ID" \
            "CANDIDATE_ARTIFACT_ID=$CANDIDATE_ARTIFACT_ID" "CORPUS_SHA256=$CORPUS_SHA256" \
            "BUILDER_SHA=$BUILDER_SHA" "BUILDER_IMAGE=$BUILDER_IMAGE" \
            "BUILDER_IMAGE_DIGEST=$BUILDER_IMAGE_DIGEST" \
            "RUNTIME_IMAGE=$RUNTIME_IMAGE" "RUNTIME_IMAGE_DIGEST=$RUNTIME_IMAGE_DIGEST" \
            "RUNTIME_DEV_IMAGE=$RUNTIME_DEV_IMAGE" \
            "RUNTIME_DEV_IMAGE_DIGEST=$RUNTIME_DEV_IMAGE_DIGEST" \
            "RUNTIME_FORMAT_SHA256=$RUNTIME_FORMAT_SHA256" \
            "BUILDER_ATTESTATION=$BUILDER_ATTESTATION" \
            "BUILDER_ATTESTATION_SHA256=$BUILDER_ATTESTATION_SHA256" \
            "BUILD_RECORD=$BUILD_RECORD" "BUILD_RECORD_SHA256=$BUILD_RECORD_SHA256" \
            "COMPANION_INVENTORY=$COMPANION_INVENTORY" \
            "COMPANION_INVENTORY_SHA256=$COMPANION_INVENTORY_SHA256" \
            "QWEN_PRIOR_COUNT=$prior_count"; do
            printf '%s\n' "$pair" >>"$GITHUB_ENV"
          done

      - name: Bind candidate provenance and exact runtime identity
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          python3 - "$CANDIDATE_MANIFEST" "$BUILDER_ATTESTATION" "$BUILDER_SHA" \
            "$BUILD_RECORD" "$COMPANION_INVENTORY" "$CORPUS_SHA256" "$QWEN_BAKEOFF_PHASE" \
            "$QWEN_PRIOR_LEDGER" <<'PY'
          import hashlib, json, pathlib, re, sys
          manifest, attestation, builder_sha, record, companions, corpus_sha, phase, prior_path = sys.argv[1:]
          m = json.loads(pathlib.Path(manifest).read_text()); c = m["candidate"]
          a = json.loads(pathlib.Path(attestation).read_text()); r = json.loads(pathlib.Path(record).read_text())
          inv = json.loads(pathlib.Path(companions).read_text())
          if a.get("schema") != "ember.qwen3.8.candidate-workset-attestation.v1":
              raise SystemExit("builder workset attestation schema differs")
          if a.get("candidate_id") != c["candidate_id"]:
              raise SystemExit("builder attestation candidate differs")
          stock_capture = a.get("stock_capture")
          if c.get("stage") == "stock":
              declared_capture = c.get("stock_capture")
              if (not isinstance(stock_capture, dict) or not isinstance(declared_capture, dict)
                      or stock_capture.get("byte_identical") is not True
                      or {key:stock_capture.get(key) for key in ("path","sha256")} != declared_capture
                      or a.get("intervention_manifest_sha256") != declared_capture.get("sha256")
                      or c.get("intervention_manifest") is not None
                      or c.get("intervention_manifest_sha256") != "0"*64):
                  raise SystemExit("cache-built stock is not byte-identical to activation capture")
          elif (stock_capture is not None or c.get("stock_capture") is not None
                or a.get("intervention_manifest_sha256") != c.get("intervention_manifest_sha256")):
              raise SystemExit("directional candidate weight-source provenance differs")
          builder = a.get("builder_identity") or {}
          if set(builder) != {"ember_revision", "quantizer_tool_sha256", "container_digest",
                             "tensor_format_contract_sha256"} or builder["ember_revision"] != builder_sha:
              raise SystemExit("exact builder identity differs")
          if a.get("tensor_format_compatibility_sha256") != builder["tensor_format_contract_sha256"]:
              raise SystemExit("builder format compatibility differs")
          measurement=a.get("measurement") or {}
          if (measurement.get("status") != "measured_target_cgroup_v2"
                  or measurement.get("swap_limit_bytes") != 0
                  or measurement.get("cgroup_peak_bytes", 1) > measurement.get("memory_limit_bytes", 0)
                  or measurement.get("child_maximum_resident_set_kib", 1)*1024 > measurement.get("memory_limit_bytes", 0)):
              raise SystemExit("candidate builder did not fail closed on its measured cgroup peak")
          if r.get("status") != "complete" or r.get("tools", {}).get("ember_revision") != builder_sha:
              raise SystemExit("build record is not bound to the artifact builder revision")
          if a.get("build_record_sha256") != m["build_record"]["sha256"]:
              raise SystemExit("build record digest differs from builder attestation")
          if (m["build_record"]["path"] != c.get("build_record")
                  or m["build_record"]["sha256"] != c.get("build_record_sha256")):
              raise SystemExit("candidate build-record path/digest differs from the immutable descriptor")
          cache=(r.get("bf16_cache") or {}).get("manifest") or {}
          if (cache.get("path") != m["bf16_cache"]["path"]
                  or cache.get("sha256") != m["bf16_cache"]["sha256"]):
              raise SystemExit("candidate was not built from the declared immutable BF16 cache")
          if c.get("tensor_format_compatibility_sha256") != a.get("tensor_format_compatibility_sha256"):
              raise SystemExit("candidate tensor-format compatibility differs")
          if (set(inv) != {"schema", "source", "companions"}
                  or inv.get("schema") != "ember.qwen3.8-flash-next.companion-inventory.v1"):
              raise SystemExit("canonical companion inventory contract differs")
          rows = inv.get("companions")
          if not isinstance(rows, list) or len(rows) != 2:
              raise SystemExit("canonical companion inventory must contain MTP and vision_mmproj")
          by_role = {row.get("role"): row for row in rows if isinstance(row, dict)}
          if set(by_role) != {"mtp", "vision_mmproj"}:
              raise SystemExit("canonical companion inventory roles differ")
          mtp = by_role["mtp"]
          if (mtp.get("enabled") is not True
                  or mtp.get("matrix_quant_contract") != c.get("mtp_matrix_quant_contract")):
              raise SystemExit("MTP companion inventory contract differs")
          if (c.get("companion_inventory") != companions
                  or c.get("companion_inventory_sha256") != m["shared_companions"][
                      c["mtp_matrix_quant_contract"]]["sha256"]):
              raise SystemExit("candidate does not bind its selected shared companion inventory")
          mmproj = by_role["vision_mmproj"]
          if (mmproj.get("enabled") is not True
                  or mmproj.get("format") != c.get("vision_mmproj_format")
                  or c.get("vision_mmproj_format") != "BF16"):
              raise SystemExit("shared BF16 mmproj inventory differs")
          vocab=mmproj.get("text_model") or {}
          if (vocab.get("path") != c.get("vision_vocab")
                  or vocab.get("size_bytes") != c.get("vision_vocab_bytes")
                  or vocab.get("sha256") != c.get("vision_vocab_sha256")
                  or vocab.get("format") != c.get("vision_vocab_format")
                  or c.get("vision_vocab_format") != "GGUF_VOCAB_ONLY"
                  or vocab.get("metadata_sha256") != c.get("vision_vocab_metadata_sha256")):
              raise SystemExit("shared vision vocab inventory differs")
          if corpus_sha != c.get("corpus_sha256") and phase != "final":
              raise SystemExit("stock/sweep candidate uses the wrong selection-only corpus")
          if phase == "final":
              prior = json.loads(pathlib.Path(prior_path).read_text())
              selected = prior.get("selected_artifact_identity")
              if not isinstance(selected, dict): raise SystemExit("MTP-depth ledger has no selected artifact identity")
              identity = {
                  "candidate_id": c.get("candidate_id"),
                  "build_record_sha256": m["build_record"]["sha256"],
                  "intervention_manifest_sha256": c.get("intervention_manifest_sha256"),
                  "profile_sha256": c.get("profile_sha256"),
                  "quantization_overrides_sha256": c.get("override_sha256"),
                  "model_inventory_sha256": c.get("model_inventory_sha256"),
                  "companion_inventory_sha256": c.get("companion_inventory_sha256"),
                  "mtp_matrix_quant_contract": c.get("mtp_matrix_quant_contract"),
                  "mtp_depth": c.get("mtp_depth"),
                  "artifact_bytes": c.get("artifact_bytes"),
                  "companion_artifact_bytes": {"mtp": c.get("mtp_bytes"),
                                                   "vision_mmproj": c.get("vision_mmproj_bytes"),
                                                   "vision_vocab": c.get("vision_vocab_bytes")},
                  "quantization_arm": c.get("quantization_arm"),
                  "intervention_configuration_id": c.get("intervention_configuration_id"),
                  "builder_identity": builder,
                  "tensor_format_compatibility_sha256": c.get(
                      "tensor_format_compatibility_sha256"),
              }
              if identity != selected:
                  raise SystemExit("final-confirmation is not the exact attested MTP-depth winner")
              if c.get("id") != "final-confirmation":
                  raise SystemExit("final row id must be final-confirmation")
          PY

          umask 077
          DOCKER_CONFIG="$(mktemp -d /tmp/ember-qwen-docker.XXXXXX)"
          export DOCKER_CONFIG
          printf 'DOCKER_CONFIG=%s\n' "$DOCKER_CONFIG" >>"$GITHUB_ENV"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          verify_image_digest() {
            local image="$1" expected="$2"
            [[ "$image" =~ ^ghcr\.io/ && "$expected" =~ ^sha256:[0-9a-f]{64}$ ]]
            docker pull "$image"
            docker image inspect "$image" | python3 -c \
              'import json,sys; e=sys.argv[1]; d=json.load(sys.stdin)[0].get("RepoDigests",[]); raise SystemExit(0 if any(x.endswith("@"+e) for x in d) else 1)' \
              "$expected"
          }
          verify_image_digest "$BUILDER_IMAGE" "$BUILDER_IMAGE_DIGEST"
          verify_image_digest "$RUNTIME_IMAGE" "$RUNTIME_IMAGE_DIGEST"
          verify_image_digest "$RUNTIME_DEV_IMAGE" "$RUNTIME_DEV_IMAGE_DIGEST"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$BUILDER_IMAGE")" = "$BUILDER_SHA"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$RUNTIME_IMAGE")" = "$TARGET_SHA"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$RUNTIME_DEV_IMAGE")" = "$TARGET_SHA"
          test "$(python3 - "$BUILDER_ATTESTATION" "$BUILDER_IMAGE_DIGEST" <<'PY'
          import json, pathlib, sys
          a=json.loads(pathlib.Path(sys.argv[1]).read_text()); print(a["builder_identity"]["container_digest"] == sys.argv[2])
          PY
          )" = True
          RUNTIME_ENGINE_SHA256="$(docker run --rm --entrypoint sha256sum "$RUNTIME_IMAGE" /usr/local/bin/ember-dflash | awk '{print $1}')"
          [[ "$RUNTIME_ENGINE_SHA256" =~ ^[0-9a-f]{64}$ && "$RUNTIME_FORMAT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(python3 - "$BUILDER_ATTESTATION" "$RUNTIME_FORMAT_SHA256" <<'PY'
          import json, pathlib, sys
          a=json.loads(pathlib.Path(sys.argv[1]).read_text()); print(a["tensor_format_compatibility_sha256"] == sys.argv[2])
          PY
          )" = True
          python3 - "$QWEN_RESULTS_ACCUMULATOR" "$QWEN_PRIOR_LEDGER" "$TARGET_SHA" \
            "$RUNTIME_ENGINE_SHA256" "$RUNTIME_IMAGE_DIGEST" "$RUNTIME_FORMAT_SHA256" <<'PY'
          import hashlib, json, pathlib, sys
          accumulator,ledger,revision,binary,image,contract=sys.argv[1:]
          current={"ember_revision":revision,"engine_binary_sha256":binary,
                   "container_digest":image,"tensor_format_contract_sha256":contract}
          expected=[]
          if accumulator:
              value=json.loads(pathlib.Path(accumulator).read_text())
              for descriptor in value["assessments"]:
                  subject=descriptor["subject"]; path=pathlib.Path(subject["path"])
                  raw=path.read_bytes()
                  if hashlib.sha256(raw).hexdigest() != subject["sha256"]:
                      raise SystemExit("prior assessment changed after its attested accumulator")
                  expected.append(json.loads(raw)["runtime_identity"])
          if ledger:
              expected.append(json.loads(pathlib.Path(ledger).read_text())["runtime_identity"])
          if any(identity != current for identity in expected):
              raise SystemExit("comparative phase attempted to change the exact runtime engine identity")
          PY

          sudo -n /usr/local/sbin/ember-cert-production is-active >/dev/null
          curl --fail --silent --max-time 2 http://127.0.0.1:8000/health >/dev/null
          for pair in \
            "DOCKER_CONFIG=$DOCKER_CONFIG" "SELECTION_PLAN=$SELECTION_PLAN" \
            "SELECTION_PLAN_SHA256=$SELECTION_PLAN_SHA256" "EFFECTIVE_PLAN=$EFFECTIVE_PLAN" \
            "EFFECTIVE_PLAN_SHA256=$EFFECTIVE_PLAN_SHA256" "QWEN_BAKEOFF_EVIDENCE_ROOT=$QWEN_BAKEOFF_EVIDENCE_ROOT" \
            "QWEN_WORKSET_ROOT=$QWEN_WORKSET_ROOT" "CANDIDATE_ROW_ID=$CANDIDATE_ROW_ID" \
            "CANDIDATE_ARTIFACT_ID=$CANDIDATE_ARTIFACT_ID" "CORPUS_SHA256=$CORPUS_SHA256" \
            "BUILDER_SHA=$BUILDER_SHA" "BUILDER_IMAGE_DIGEST=$BUILDER_IMAGE_DIGEST" \
            "RUNTIME_IMAGE=$RUNTIME_IMAGE" "RUNTIME_IMAGE_DIGEST=$RUNTIME_IMAGE_DIGEST" \
            "RUNTIME_DEV_IMAGE=$RUNTIME_DEV_IMAGE" "RUNTIME_DEV_IMAGE_DIGEST=$RUNTIME_DEV_IMAGE_DIGEST" \
            "RUNTIME_ENGINE_SHA256=$RUNTIME_ENGINE_SHA256" "RUNTIME_FORMAT_SHA256=$RUNTIME_FORMAT_SHA256" \
            "BUILD_RECORD=$BUILD_RECORD" "BUILD_RECORD_SHA256=$BUILD_RECORD_SHA256" \
            "COMPANION_INVENTORY=$COMPANION_INVENTORY" "COMPANION_INVENTORY_SHA256=$COMPANION_INVENTORY_SHA256" \
            "QWEN_PRIOR_COUNT=$QWEN_PRIOR_COUNT"; do
            printf '%s\n' "$pair" >>"$GITHUB_ENV"
          done
      - name: Measure target-only then matching-MTP for the one live artifact
        run: |
          set -euo pipefail
          target_dir="$QWEN_BAKEOFF_EVIDENCE_ROOT/$QWEN_BAKEOFF_PHASE-$CANDIDATE_ROW_ID-target-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mtp_dir="$QWEN_BAKEOFF_EVIDENCE_ROOT/$QWEN_BAKEOFF_PHASE-$CANDIDATE_ROW_ID-mtp-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          legacy_manifest="$QWEN_BAKEOFF_EVIDENCE_ROOT/$QWEN_BAKEOFF_PHASE-$CANDIDATE_ROW_ID-gate-v2-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          python3 - "$CANDIDATE_MANIFEST" "$legacy_manifest" "$SELECTION_PLAN" \
            "$SELECTION_PLAN_SHA256" "$RUNTIME_IMAGE" "$RUNTIME_IMAGE_DIGEST" \
            "$RUNTIME_DEV_IMAGE" "$RUNTIME_DEV_IMAGE_DIGEST" <<'PY'
          import json, pathlib, sys
          source, output, plan, plan_sha, image, image_sha, dev, dev_sha = sys.argv[1:]
          m=json.loads(pathlib.Path(source).read_text()); c=m["candidate"]
          keys={
            "id", "candidate_id", "stage", "configuration_id", "arm_id", "corpus_sha256",
            "quantization_arm", "model", "model_sha256", "build_record",
            "build_record_sha256", "intervention_configuration_id",
            "intervention_manifest", "intervention_manifest_sha256", "profile_sha256",
            "override_sha256", "companion_inventory", "companion_inventory_sha256",
            "mtp", "mtp_bytes", "mtp_sha256", "mtp_export_manifest",
            "mtp_export_manifest_sha256", "mtp_matrix_quant_contract", "vision_mmproj",
            "vision_mmproj_bytes", "vision_mmproj_sha256", "vision_mmproj_format",
            "vision_vocab", "vision_vocab_bytes", "vision_vocab_sha256",
            "vision_vocab_format", "vision_vocab_metadata_sha256",
            "quality_contract", "quality_contract_sha256", "mtp_depth", "runtime_mode",
            "final_release_eligible", "model_inventory_sha256",
            "tensor_format_compatibility_sha256", "artifact_bytes",
          }
          if not keys.issubset(c): raise SystemExit(f"candidate lacks legacy gate fields: {sorted(keys-set(c))}")
          row={key:c[key] for key in keys}
          if c["stage"] == "stock":
              # v3 binds byte-identical activation capture separately; the
              # legacy target gate correctly keeps intervention provenance null.
              row["intervention_manifest"] = None
              row["intervention_manifest_sha256"] = "0" * 64
          row.update(image=image, image_digest=image_sha, profile_image=dev, profile_image_digest=dev_sha)
          if c["stage"] == "final": row["corpus_sha256"] = None
          # The final corpus becomes available only after unlock-final; it is
          # supplied through the environment, never persisted in the input manifest.
          if row["corpus_sha256"] is None:
              import os
              row["corpus_sha256"] = os.environ["CORPUS_SHA256"]
          value={"schema":"ember.qwen3.8.sequential-bakeoff-candidates.v2",
                 "ember_revision":m["builder_revision"], "images":m["images"],
                 "release_profile":m["release_profile"],
                 "bakeoff_plan":{"path":plan,"sha256":plan_sha},
                 "candidates":[row], "evidence_root":m["evidence_root"]}
          pathlib.Path(output).write_text(json.dumps(value,indent=2,sort_keys=True)+"\n")
          PY
          legacy_sha="$(sha256sum "$legacy_manifest" | awk '{print $1}')"
          mapfile -t candidate < <(python3 - "$legacy_manifest" <<'PY'
          import json, pathlib, sys
          c=json.loads(pathlib.Path(sys.argv[1]).read_text())["candidates"][0]
          print("\n".join(map(str,[c["model"],c["model_sha256"],c["mtp"],c["mtp_sha256"],c["mtp_depth"]])))
          PY
          )
          scripts/qwen_target_only_gate.sh \
            --image "$RUNTIME_IMAGE" --image-digest "$RUNTIME_IMAGE_DIGEST" \
            --profile-image "$RUNTIME_DEV_IMAGE" --profile-image-digest "$RUNTIME_DEV_IMAGE_DIGEST" \
            --model "${candidate[0]}" --model-sha256 "${candidate[1]}" \
            --model-build-record "$BUILD_RECORD" --model-build-record-sha256 "$BUILD_RECORD_SHA256" \
            --bakeoff-manifest "$legacy_manifest" --bakeoff-manifest-sha256 "$legacy_sha" \
            --candidate-id "$CANDIDATE_ROW_ID" --out-dir "$target_dir"
          scripts/qwen_real_weight_gate.sh \
            --image "$RUNTIME_IMAGE" --image-digest "$RUNTIME_IMAGE_DIGEST" \
            --profile-image "$RUNTIME_DEV_IMAGE" --profile-image-digest "$RUNTIME_DEV_IMAGE_DIGEST" \
            --model "${candidate[0]}" --model-sha256 "${candidate[1]}" \
            --model-build-record "$BUILD_RECORD" --model-build-record-sha256 "$BUILD_RECORD_SHA256" \
            --mtp "${candidate[2]}" --mtp-sha256 "${candidate[3]}" --mtp-depth "${candidate[4]}" \
            --measurement-only --out-dir "$mtp_dir"

          measurement="$QWEN_BAKEOFF_EVIDENCE_ROOT/$QWEN_BAKEOFF_PHASE-$CANDIDATE_ROW_ID-measurement-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          python3 - "$CANDIDATE_MANIFEST" "$BUILDER_ATTESTATION" "$target_dir/complete.json" \
            "$mtp_dir/hardware-measured.json" "$measurement" "$TARGET_SHA" \
            "$RUNTIME_ENGINE_SHA256" "$RUNTIME_IMAGE_DIGEST" "$RUNTIME_FORMAT_SHA256" \
            "$CORPUS_SHA256" <<'PY'
          import hashlib, json, pathlib, sys
          (manifest_path, builder_path, target_path, hardware_path, output, runtime_sha,
           engine_sha, runtime_image_sha, format_sha, corpus_sha)=sys.argv[1:]
          sys.path.insert(0,"scripts"); import qwen_bakeoff as qb
          def load(path): return json.loads(pathlib.Path(path).read_text())
          def sha(path):
              h=hashlib.sha256()
              with open(path,"rb") as f:
                  for b in iter(lambda:f.read(1024*1024),b""): h.update(b)
              return h.hexdigest()
          def desc(path): return {"path":str(pathlib.Path(path).resolve()),"sha256":sha(path)}
          m=load(manifest_path); c=m["candidate"]; builder=load(builder_path)["builder_identity"]
          hardware=load(hardware_path); hp=pathlib.Path(hardware_path).resolve()
          timing=(hp.parent/hardware["evidence"]["timing"]["path"]).resolve()
          facts=qb.timing_facts(timing,True)
          inventory=hardware["model"]["ordered_inventory"]
          identities=[{"index":i,"sha256":row["sha256"],"bytes":row["size_bytes"]}
                      for i,row in enumerate(inventory["shards"],1)]
          inventory_sha=qb.canonical_sha256(identities); artifact_bytes=sum(x["bytes"] for x in identities)
          companions={"mtp":c["mtp_bytes"],"vision_mmproj":c["vision_mmproj_bytes"],
                      "vision_vocab":c["vision_vocab_bytes"]}
          runtime={"ember_revision":runtime_sha,"engine_binary_sha256":engine_sha,
                   "container_digest":runtime_image_sha,"tensor_format_contract_sha256":format_sha}
          quality=None if c["stage"]=="stock" else {"path":c["quality_contract"],"sha256":c["quality_contract_sha256"]}
          intervention=None if c["stage"]=="stock" else {"path":c["intervention_manifest"],
                                                           "sha256":c["intervention_manifest_sha256"]}
          provenance={"quantization_arm":c["quantization_arm"],"override_sha256":c["override_sha256"],
             "intervention_configuration_id":c["intervention_configuration_id"],
             "intervention_manifest_sha256":c["intervention_manifest_sha256"],
             "build_record_sha256":c["build_record_sha256"],
             "companion_inventory_sha256":c["companion_inventory_sha256"],
             "mtp_matrix_quant_contract":c["mtp_matrix_quant_contract"],"mtp_depth":c["mtp_depth"],
             "profile_sha256":c["profile_sha256"],"builder_identity":builder,
             "runtime_identity":runtime,"tensor_format_compatibility_sha256":format_sha}
          evidence={"schema":"ember.qwen3.8.sequential-bakeoff-result.v4",
             "candidate_id":c["candidate_id"],"status":"complete","publishes":False,
             "provenance":provenance,
             "artifacts":{"combined_fits":True,"model_artifact_bytes":artifact_bytes,
                          "mtp":{"path":c["mtp"],"bytes":c["mtp_bytes"],"sha256":c["mtp_sha256"]},
                          "vision_mmproj":{"path":c["vision_mmproj"],"bytes":c["vision_mmproj_bytes"],
                                           "sha256":c["vision_mmproj_sha256"]},
                          "vision_vocab":{"path":c["vision_vocab"],"bytes":c["vision_vocab_bytes"],
                                          "sha256":c["vision_vocab_sha256"]}},
             "evidence":{"target_complete":desc(target_path),
                         "matching_mtp_hardware_measurement":desc(hardware_path),
                         "matching_mtp_timing":desc(timing),"quality_contract":quality},
             "measurement_contract":{"prefill_statistic":"peak","decode_statistic":"median",
               "evaluated_prefill_tokens":facts["evaluated_prefill_tokens"],
               "completion_tokens":facts["completion_tokens"],"mtp_spec_ran":facts["mtp_spec_ran"],
               "mtp_depth":c["mtp_depth"]}}
          ep=pathlib.Path(output).with_suffix(".evidence.json")
          ep.write_text(json.dumps(evidence,indent=2,sort_keys=True)+"\n")
          row={"id":c["id"],"candidate_id":c["candidate_id"],"stage":c["stage"],
             "configuration_id":c["configuration_id"],"arm_id":c["arm_id"],
             "final_release_eligible":c["final_release_eligible"],"runtime_mode":c["runtime_mode"],
             "mtp_matrix_quant_contract":c["mtp_matrix_quant_contract"],"mtp_depth":c["mtp_depth"],
             "corpus_sha256":corpus_sha,
             "measurement_kind":"measured","status":"complete","quantization_arm":c["quantization_arm"],
             "quantization_overrides_sha256":c["override_sha256"],"profile_sha256":c["profile_sha256"],
             "build_record_sha256":c["build_record_sha256"],"intervention_configuration_id":c["intervention_configuration_id"],
             "intervention_manifest_sha256":c["intervention_manifest_sha256"],"intervention_manifest":intervention,
             "companion_inventory_sha256":c["companion_inventory_sha256"],"quality_contract":quality,
             "builder_identity":builder,"runtime_identity":runtime,
             "tensor_format_compatibility_sha256":format_sha,"model_inventory_sha256":inventory_sha,
             "enabled_companions":["mtp","vision_mmproj","vision_vocab"],"artifact_bytes":artifact_bytes,
             "companion_artifact_bytes":companions,"prefill_tps_samples":facts["prefill_tps_samples"],
             "decode_tps_samples":facts["decode_tps_samples"],
             "evaluated_prefill_tokens":facts["evaluated_prefill_tokens"],
             "completion_tokens":facts["completion_tokens"],"mtp_spec_ran":facts["mtp_spec_ran"],
             **{k:facts["resources"].get(k) for k in ("runner_memtotal_bytes","runner_gtt_pages_limit",
                 "peak_memory_measurement_method","measured_peak_rss_bytes","measured_peak_gtt_bytes","measured_peak_uma_bytes")},
             "evidence_manifest":{"path":str(ep.resolve()),"sha256":sha(ep),"schema":evidence["schema"]}}
          pathlib.Path(output).write_text(json.dumps({"measurement":row},indent=2,sort_keys=True)+"\n")
          PY
          printf 'QWEN_MEASUREMENT=%s\n' "$measurement" >>"$GITHUB_ENV"

      - name: Assess the candidate while its quantized artifact still exists
        run: |
          set -euo pipefail
          assessment="$QWEN_BAKEOFF_EVIDENCE_ROOT/$QWEN_BAKEOFF_PHASE-$CANDIDATE_ROW_ID-assessment-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          python3 scripts/qwen_bakeoff.py --plan "$EFFECTIVE_PLAN" --stage assess \
            --results "$QWEN_MEASUREMENT" --output "$assessment"
          printf 'QWEN_ASSESSMENT=%s\n' "$assessment" >>"$GITHUB_ENV"

      - name: GitHub-attest candidate assessment
        id: attest_assessment
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-path: ${{ env.QWEN_ASSESSMENT }}

      - name: Retain and verify candidate assessment attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTION_BUNDLE: ${{ steps.attest_assessment.outputs.bundle-path }}
        run: |
          set -euo pipefail
          bundle="$QWEN_BAKEOFF_EVIDENCE_ROOT/$QWEN_BAKEOFF_PHASE-$CANDIDATE_ROW_ID-assessment-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.sigstore.json"
          install -m 0600 -- "$ACTION_BUNDLE" "$bundle"
          gh attestation verify "$QWEN_ASSESSMENT" --bundle "$bundle" --repo "$ATTEST_REPOSITORY" \
            --signer-workflow "$ATTEST_WORKFLOW" >/dev/null
          printf 'QWEN_ASSESSMENT_SHA256=%s\n' "$(sha256sum "$QWEN_ASSESSMENT" | awk '{print $1}')" >>"$GITHUB_ENV"
          printf 'QWEN_ASSESSMENT_BUNDLE=%s\n' "$bundle" >>"$GITHUB_ENV"
          printf 'QWEN_ASSESSMENT_BUNDLE_SHA256=%s\n' "$(sha256sum "$bundle" | awk '{print $1}')" >>"$GITHUB_ENV"

      - name: Append only the externally-attested compact assessment descriptor
        run: |
          set -euo pipefail
          accumulator="$QWEN_BAKEOFF_EVIDENCE_ROOT/$QWEN_BAKEOFF_PHASE-accumulator-$((QWEN_PRIOR_COUNT + 1))-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          python3 - "$QWEN_RESULTS_ACCUMULATOR" "$QWEN_ASSESSMENT" "$QWEN_ASSESSMENT_SHA256" \
            "$QWEN_ASSESSMENT_BUNDLE" "$QWEN_ASSESSMENT_BUNDLE_SHA256" "$accumulator" \
            "$QWEN_BAKEOFF_PHASE" "$SELECTION_PLAN_SHA256" <<'PY'
          import json, pathlib, sys
          prior, subject, subject_sha, bundle, bundle_sha, output, phase, plan_sha = sys.argv[1:]
          rows=[]
          if prior:
              old=json.loads(pathlib.Path(prior).read_text())
              rows=old["assessments"]
          descriptor={"subject":{"path":str(pathlib.Path(subject).resolve()),"sha256":subject_sha,
                                 "schema":"ember.qwen3.8.candidate-assessment.v2"},
                      "bundle":{"path":str(pathlib.Path(bundle).resolve()),"sha256":bundle_sha},
                      "repository":"OtherU-AI/ember",
                      "signer_workflow":".github/workflows/qwen-gfx1151-bakeoff.yml"}
          value={"schema":"ember.qwen3.8.sequential-bakeoff-accumulator.v2","phase":phase,
                 "plan_sha256":plan_sha,"assessments":[*rows,descriptor],
                 "contains_raw_measurements":False,"external_attestation_required":True,
                 "publication_allowed":False}
          pathlib.Path(output).write_text(json.dumps(value,indent=2,sort_keys=True)+"\n")
          PY
          printf 'QWEN_CURRENT_ACCUMULATOR=%s\n' "$accumulator" >>"$GITHUB_ENV"

      - name: GitHub-attest compact accumulator
        id: attest_accumulator
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-path: ${{ env.QWEN_CURRENT_ACCUMULATOR }}

      - name: Retain and verify compact accumulator; decide only at phase boundary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTION_BUNDLE: ${{ steps.attest_accumulator.outputs.bundle-path }}
        run: |
          set -euo pipefail
          bundle="$QWEN_CURRENT_ACCUMULATOR.sigstore.json"
          install -m 0600 -- "$ACTION_BUNDLE" "$bundle"
          gh attestation verify "$QWEN_CURRENT_ACCUMULATOR" --bundle "$bundle" \
            --repo "$ATTEST_REPOSITORY" --signer-workflow "$ATTEST_WORKFLOW" >/dev/null
          accumulator_sha="$(sha256sum "$QWEN_CURRENT_ACCUMULATOR" | awk '{print $1}')"
          bundle_sha="$(sha256sum "$bundle" | awk '{print $1}')"
          mapfile -t counts < <(python3 - "$SELECTION_PLAN" "$QWEN_BAKEOFF_PHASE" "$QWEN_CURRENT_ACCUMULATOR" <<'PY'
          import json, pathlib, sys
          plan=json.loads(pathlib.Path(sys.argv[1]).read_text()); phase=sys.argv[2]
          acc=json.loads(pathlib.Path(sys.argv[3]).read_text())
          expected=(1+len(plan["sweep_configurations"]) if phase=="sweep"
                    else len(plan["format_arms"]) if phase=="format"
                    else len(plan["mtp_depth_configurations"]) if phase=="mtp-depth" else 1)
          print(len(acc["assessments"])); print(expected)
          PY
          )
          current="${counts[0]}"; expected="${counts[1]}"
          (( current <= expected ))
          printf 'QWEN_CURRENT_ACCUMULATOR_SHA256=%s\n' "$accumulator_sha" >>"$GITHUB_ENV"
          printf 'QWEN_ACCUMULATOR_BUNDLE=%s\n' "$bundle" >>"$GITHUB_ENV"
          printf 'QWEN_ACCUMULATOR_BUNDLE_SHA256=%s\n' "$bundle_sha" >>"$GITHUB_ENV"
          printf 'QWEN_EXPECTED_COUNT=%s\n' "$expected" >>"$GITHUB_ENV"
          if [[ "$QWEN_BAKEOFF_PHASE" = sweep || "$QWEN_BAKEOFF_PHASE" = format ]]; then
            authority="$QWEN_BAKEOFF_EVIDENCE_ROOT/$QWEN_BAKEOFF_PHASE-rolling-retention-$current-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
            python3 scripts/qwen_candidate_builder.py authorize-rolling-retention \
              --plan "$SELECTION_PLAN" --plan-sha256 "$SELECTION_PLAN_SHA256" \
              --phase "$QWEN_BAKEOFF_PHASE" \
              --accumulator "$QWEN_CURRENT_ACCUMULATOR" \
              --accumulator-sha256 "$accumulator_sha" \
              --accumulator-bundle "$bundle" --accumulator-bundle-sha256 "$bundle_sha" \
              --output "$authority"
            authority_sha="$(sha256sum "$authority" | awk '{print $1}')"
            retirement_output="$(python3 - "$authority" "$QWEN_CURRENT_ACCUMULATOR" <<'PY'
          import json,pathlib,sys
          authority=json.loads(pathlib.Path(sys.argv[1]).read_text())
          accumulator=json.loads(pathlib.Path(sys.argv[2]).read_text())
          requested=set(authority["retire_candidate_ids"]); found={}
          for descriptor in accumulator["assessments"]:
              assessment=json.loads(pathlib.Path(descriptor["subject"]["path"]).read_text())
              artifact=assessment["artifact_identity"]; candidate=artifact["candidate_id"]
              if candidate in requested:
                  if candidate in found: raise SystemExit("retired candidate appears more than once")
                  found[candidate]=artifact["build_record_sha256"]
          if set(found) != requested: raise SystemExit("retirement authority candidate is absent")
          print(len(authority["retire_candidate_ids"]))
          for candidate in authority["retire_candidate_ids"]:
              print(candidate); print(found[candidate])
          PY
            )"
            mapfile -t retirement_rows <<<"$retirement_output"
            expected_retirements="${retirement_rows[0]}"
            [[ "$expected_retirements" =~ ^[0-9]+$ ]]
            retirement=("${retirement_rows[@]:1}")
            (( ${#retirement[@]} == 2 * expected_retirements ))
            completions=()
            for ((index=0; index<${#retirement[@]}; index+=2)); do
              retired_candidate="${retirement[index]}"
              retired_record_sha="${retirement[index+1]}"
              candidate_dir="$QWEN_WORKSET_ROOT/candidates/$retired_candidate"
              retired_record="$candidate_dir/qwen-quant-build-record.json"
              test -d "$candidate_dir" && test ! -L "$candidate_dir"
              test -f "$retired_record" && test ! -L "$retired_record"
              test "$(sha256sum "$retired_record" | awk '{print $1}')" = "$retired_record_sha"
              retirement_record="$QWEN_BAKEOFF_EVIDENCE_ROOT/$QWEN_BAKEOFF_PHASE-$retired_candidate-retirement-$current-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
              result="$(python3 scripts/qwen_candidate_builder.py retire-reconstructable \
                --retention-authority "$authority" --retention-authority-sha256 "$authority_sha" \
                --candidate-id "$retired_candidate" --candidate-dir "$candidate_dir" \
                --build-record-sha256 "$retired_record_sha" --output "$retirement_record" --execute)"
              completion="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["completion"])' "$result")"
              completions+=("$completion")
            done
            printf 'QWEN_RETENTION_AUTHORITY=%s\n' "$authority" >>"$GITHUB_ENV"
            printf 'QWEN_RETENTION_AUTHORITY_SHA256=%s\n' "$authority_sha" >>"$GITHUB_ENV"
            printf 'QWEN_RETIREMENT_COMPLETIONS=%s\n' "${completions[*]}" >>"$GITHUB_ENV"
          fi
          if (( current == expected )); then
            ledger="$QWEN_BAKEOFF_EVIDENCE_ROOT/$QWEN_BAKEOFF_PHASE-ledger-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
            selection_results="$QWEN_CURRENT_ACCUMULATOR"
            if [[ "$QWEN_BAKEOFF_PHASE" = format ]]; then
              confirmation_dir="$QWEN_BAKEOFF_EVIDENCE_ROOT/format-balanced-confirmation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
              scripts/qwen_balanced_confirmation.sh \
                --plan "$EFFECTIVE_PLAN" --plan-sha256 "$EFFECTIVE_PLAN_SHA256" \
                --accumulator "$QWEN_CURRENT_ACCUMULATOR" \
                --accumulator-sha256 "$(sha256sum "$QWEN_CURRENT_ACCUMULATOR" | awk '{print $1}')" \
                --evidence-root "$QWEN_BAKEOFF_EVIDENCE_ROOT" \
                --image "$RUNTIME_IMAGE" --image-digest "$RUNTIME_IMAGE_DIGEST" \
                --runtime-revision "$TARGET_SHA" \
                --engine-binary-sha256 "$RUNTIME_ENGINE_SHA256" \
                --tensor-format-contract-sha256 "$RUNTIME_FORMAT_SHA256" \
                --out-dir "$confirmation_dir"
              selection_results="$QWEN_BAKEOFF_EVIDENCE_ROOT/format-selection-input-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
              python3 - "$QWEN_CURRENT_ACCUMULATOR" \
                "$confirmation_dir/balanced-confirmation.json" "$selection_results" <<'PY'
          import json,pathlib,sys
          accumulator,confirmation,output=map(pathlib.Path,sys.argv[1:])
          value=json.loads(accumulator.read_text())
          if "balanced_confirmation" in value:
              raise SystemExit("format accumulator unexpectedly contains confirmation evidence")
          value["balanced_confirmation"]=json.loads(confirmation.read_text())
          output.write_text(json.dumps(value,indent=2,sort_keys=True)+"\n")
          PY
            fi
            args=(--plan "$EFFECTIVE_PLAN" --results "$selection_results"
                  --stage "$QWEN_BAKEOFF_PHASE" --output "$ledger")
            if [[ "$QWEN_BAKEOFF_PHASE" != sweep ]]; then
              args+=(--prior-ledger "$QWEN_PRIOR_LEDGER" --prior-ledger-sha256 "$QWEN_PRIOR_LEDGER_SHA256"
                     --prior-attestation-bundle "$QWEN_PRIOR_LEDGER_BUNDLE"
                     --prior-attestation-bundle-sha256 "$QWEN_PRIOR_LEDGER_BUNDLE_SHA256")
            fi
            python3 scripts/qwen_bakeoff.py "${args[@]}"
            printf 'QWEN_LEDGER=%s\nQWEN_LEDGER_PRESENT=yes\n' "$ledger" >>"$GITHUB_ENV"
          else
            printf 'QWEN_LEDGER_PRESENT=no\n' >>"$GITHUB_ENV"
          fi

      - name: GitHub-attest completed phase ledger
        if: ${{ env.QWEN_LEDGER_PRESENT == 'yes' }}
        id: attest_ledger
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-path: ${{ env.QWEN_LEDGER }}

      - name: Retain and verify completed phase ledger
        if: ${{ env.QWEN_LEDGER_PRESENT == 'yes' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTION_BUNDLE: ${{ steps.attest_ledger.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test "$(python3 - "$QWEN_LEDGER" <<'PY'
          import json, pathlib, sys
          print(json.loads(pathlib.Path(sys.argv[1]).read_text()).get("schema"))
          PY
          )" = ember.qwen3.8.sequential-bakeoff-ledger.v3
          bundle="$QWEN_LEDGER.sigstore.json"
          install -m 0600 -- "$ACTION_BUNDLE" "$bundle"
          gh attestation verify "$QWEN_LEDGER" --bundle "$bundle" --repo "$ATTEST_REPOSITORY" \
            --signer-workflow "$ATTEST_WORKFLOW" >/dev/null
          ledger_sha="$(sha256sum "$QWEN_LEDGER" | awk '{print $1}')"
          bundle_sha="$(sha256sum "$bundle" | awk '{print $1}')"
          printf 'QWEN_LEDGER_SHA256=%s\n' "$ledger_sha" >>"$GITHUB_ENV"
          printf 'QWEN_LEDGER_BUNDLE=%s\n' "$bundle" >>"$GITHUB_ENV"
          printf 'QWEN_LEDGER_BUNDLE_SHA256=%s\n' "$bundle_sha" >>"$GITHUB_ENV"
          if [[ "$QWEN_BAKEOFF_PHASE" = format ]]; then
            authority="$QWEN_BAKEOFF_EVIDENCE_ROOT/format-sealed-winner-retention-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
            result="$(python3 scripts/qwen_candidate_builder.py authorize-sealed-retention \
              --plan "$SELECTION_PLAN" --plan-sha256 "$SELECTION_PLAN_SHA256" \
              --ledger "$QWEN_LEDGER" --ledger-sha256 "$ledger_sha" \
              --ledger-bundle "$bundle" --ledger-bundle-sha256 "$bundle_sha" \
              --output "$authority")"
            authority_sha="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["authority_sha256"])' "$result")"
            retirement_output="$(python3 - "$authority" "$QWEN_LEDGER" <<'PY'
          import json,pathlib,sys
          authority=json.loads(pathlib.Path(sys.argv[1]).read_text())
          ledger=json.loads(pathlib.Path(sys.argv[2]).read_text())
          requested=set(authority["retire_candidate_ids"]); found={}
          for assessment in ledger["assessments"]:
              artifact=assessment["artifact_identity"]; candidate=artifact["candidate_id"]
              if candidate in requested:
                  if candidate in found: raise SystemExit("sealed loser appears more than once")
                  found[candidate]=artifact["build_record_sha256"]
          if set(found) != requested: raise SystemExit("sealed loser is absent from the ledger")
          print(len(authority["retire_candidate_ids"]))
          for candidate in authority["retire_candidate_ids"]:
              print(candidate); print(found[candidate])
          PY
            )"
            mapfile -t retirement_rows <<<"$retirement_output"
            [[ "${retirement_rows[0]}" = 1 && ${#retirement_rows[@]} -eq 3 ]]
            retired_candidate="${retirement_rows[1]}"; retired_record_sha="${retirement_rows[2]}"
            candidate_dir="$QWEN_WORKSET_ROOT/candidates/$retired_candidate"
            retired_record="$candidate_dir/qwen-quant-build-record.json"
            test -d "$candidate_dir" && test ! -L "$candidate_dir"
            test -f "$retired_record" && test ! -L "$retired_record"
            test "$(sha256sum "$retired_record" | awk '{print $1}')" = "$retired_record_sha"
            retirement_record="$QWEN_BAKEOFF_EVIDENCE_ROOT/format-$retired_candidate-sealed-retirement-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
            python3 scripts/qwen_candidate_builder.py retire-reconstructable \
              --retention-authority "$authority" --retention-authority-sha256 "$authority_sha" \
              --candidate-id "$retired_candidate" --candidate-dir "$candidate_dir" \
              --build-record-sha256 "$retired_record_sha" --output "$retirement_record" --execute
            printf 'QWEN_SEALED_RETENTION_AUTHORITY=%s\n' "$authority" >>"$GITHUB_ENV"
          fi

      - name: Preserve shared and non-rolling artifacts
        run: |
          set -euo pipefail
          if [[ "$QWEN_BAKEOFF_PHASE" = sweep || "$QWEN_BAKEOFF_PHASE" = format ]]; then
            test -n "$QWEN_RETENTION_AUTHORITY"
            printf '%s\n' 'Rolling retention was derived from the verified accumulator; every eviction is reconstructable.'
          elif [[ "$QWEN_BAKEOFF_PHASE" = mtp-depth ]]; then
            python3 - "$QWEN_ASSESSMENT" "$QWEN_PRIOR_LEDGER" <<'PY'
          import json,pathlib,sys
          assessment=json.loads(pathlib.Path(sys.argv[1]).read_text())
          prior=json.loads(pathlib.Path(sys.argv[2]).read_text())
          artifact=assessment.get("artifact_identity"); selected=prior.get("selected_artifact_identity")
          def without_depth(value):
              if not isinstance(value,dict): raise SystemExit("MTP-depth artifact identity is malformed")
              return {key:item for key,item in value.items() if key != "mtp_depth"}
          if without_depth(artifact) != without_depth(selected):
              raise SystemExit("MTP-depth row is not the shared format-selected artifact")
          PY
            printf '%s\n' 'MTP-depth row retained: every depth reuses the format-selected artifact bytes.'
          else
            printf '%s\n' 'Final confirmation retains the already-selected release artifact.'
          fi

      - name: Remove temporary registry credentials
        if: ${{ always() && env.DOCKER_CONFIG != '' }}
        run: |
          set +e
          credential_cleanup_failed=0
          rm -f -- "$DOCKER_CONFIG/config.json" || credential_cleanup_failed=1
          rmdir -- "$DOCKER_CONFIG" || credential_cleanup_failed=1
          exit "$credential_cleanup_failed"

      - name: Summarize non-publishing sequential result
        if: ${{ success() }}
        run: |
          {
            echo '## Qwen sequential gfx1151 candidate assessed'
            echo
            echo "Artifact builder revision: \`$BUILDER_SHA\`"
            echo "Runtime engine revision: \`$TARGET_SHA\`"
            echo "Candidate artifact: \`$CANDIDATE_ARTIFACT_ID\`"
            echo "Attested compact accumulator: \`$QWEN_CURRENT_ACCUMULATOR\`"
            echo "Attested compact accumulator SHA-256: \`$QWEN_CURRENT_ACCUMULATOR_SHA256\`"
            echo "Accumulator attestation bundle: \`$QWEN_ACCUMULATOR_BUNDLE\`"
            echo "Accumulator attestation bundle SHA-256: \`$QWEN_ACCUMULATOR_BUNDLE_SHA256\`"
            if [[ "${QWEN_LEDGER_PRESENT:-no}" = yes ]]; then
              echo "Completed phase ledger: \`$QWEN_LEDGER\`"
              echo "Completed phase ledger SHA-256: \`$QWEN_LEDGER_SHA256\`"
              echo "Ledger attestation bundle: \`$QWEN_LEDGER_BUNDLE\`"
              echo "Ledger attestation bundle SHA-256: \`$QWEN_LEDGER_BUNDLE_SHA256\`"
            fi
            echo 'Prefill is the exact-2074 three-sample peak; decode is the three-sample median.'
            echo 'The final-heldout corpus is inaccessible until unlock-final verifies the attested MTP-depth ledger.'
            echo 'No model or evidence artifact was published.'
          } >>"$GITHUB_STEP_SUMMARY"
