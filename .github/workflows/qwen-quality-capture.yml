name: Qwen gfx1151 staged quality capture

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
      phase_descriptor:
        required: true
        type: string
      phase_descriptor_sha256:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character Ember revision containing the capture and judge drivers
        required: true
        type: string
      phase_descriptor:
        description: Absolute runner path to one already-unlocked sweep or final quality descriptor
        required: true
        type: string
      phase_descriptor_sha256:
        description: Exact lowercase SHA-256 of the phase descriptor
        required: true
        type: string

permissions:
  contents: read
  packages: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  # The stable default-branch dispatcher already owns the global hardware
  # group.  A called workflow therefore needs a run-unique nested group while
  # direct manual dispatches continue to serialize globally.
  group: ${{ contains(github.workflow_ref, '/.github/workflows/gfx1151-certify.yml@') && format('qwen-quality-called-{0}', github.run_id) || 'gfx1151-certification' }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: [self-hosted, linux, x64, gfx1151]
    timeout-minutes: 1440
    env:
      TARGET_SHA: ${{ inputs.commit_sha }}
      PHASE_DESCRIPTOR: ${{ inputs.phase_descriptor }}
      PHASE_DESCRIPTOR_SHA256: ${{ inputs.phase_descriptor_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Bind the unlocked phase, models, judge, drivers, and images before GPU work
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +x
          [[ "$GITHUB_REPOSITORY" = OtherU-AI/ember ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --quiet --exit-code
          [[ "$PHASE_DESCRIPTOR" = /* && -f "$PHASE_DESCRIPTOR" && ! -L "$PHASE_DESCRIPTOR" ]]
          [[ "$PHASE_DESCRIPTOR_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum "$PHASE_DESCRIPTOR" | awk '{print $1}')" = "$PHASE_DESCRIPTOR_SHA256"
          test -x /usr/local/sbin/ember-gpu-lock
          test -x /usr/local/sbin/ember-cert-production
          command -v docker >/dev/null
          command -v curl >/dev/null
          command -v dd >/dev/null
          command -v gh >/dev/null
          [[ -r /dev/kfd && -d /dev/dri ]]

          docker_config="$RUNNER_TEMP/qwen-quality-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$docker_config"
          printf 'DOCKER_CONFIG=%s\n' "$docker_config" >>"$GITHUB_ENV"
          export DOCKER_CONFIG="$docker_config"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null

          mapfile -t binding < <(python3 - "$PHASE_DESCRIPTOR" "$PHASE_DESCRIPTOR_SHA256" \
            "$TARGET_SHA" "$RUNNER_TEMP" <<'PY'
          import hashlib, json, os, re, subprocess, sys, urllib.parse
          from pathlib import Path

          descriptor_path = Path(sys.argv[1])
          expected_descriptor_sha, target_sha, runner_temp = sys.argv[2:]
          HEX40 = re.compile(r"[0-9a-f]{40}")
          HEX64 = re.compile(r"[0-9a-f]{64}")
          IMAGE = re.compile(r"[^\s@]+@sha256:([0-9a-f]{64})")
          SAFE_CONTAINER = re.compile(r"qwen-quality-[a-z0-9][a-z0-9_.-]{0,62}")
          FINAL_SHA = "493ad8c9ed44fe635697ebdb27308ac0d3be80ec322ee28e1fd89c441b0df515"
          SWEEP_SHA = "e50105eeff560e9cd6695f52ea240dbbfa64aa6288b51f33b4999422bb9fa451"
          AGENTIC_SHA = "079f73454951e0089094ff28df480cbf5d79616b921211f241a2dde74de1ec6a"
          RUBRIC_SHA = "ce26e1eb276bc9730aba2ee3ef5915eceeb8a81b699b609b0f0ec3ae972d6fb2"

          def fail(message):
              raise SystemExit(message)

          def canonical(value):
              return (json.dumps(value, ensure_ascii=False, sort_keys=True,
                                  separators=(",", ":")) + "\n").encode()

          def exact_file(value, expected, label, expected_bytes=None):
              if not isinstance(value, str) or not value.startswith("/") or "\0" in value or "\n" in value:
                  fail(f"{label} path must be absolute and single-line")
              if not isinstance(expected, str) or HEX64.fullmatch(expected) is None:
                  fail(f"{label} SHA-256 is malformed")
              path = Path(value)
              before = path.lstat()
              if path.is_symlink() or not path.is_file():
                  fail(f"{label} must be a regular non-symlink file")
              digest = hashlib.sha256(); count = 0
              if before.st_size >= 512 * 1024 * 1024:
                  process = subprocess.Popen(
                      ["dd", f"if={path}", "iflag=direct", "bs=8M", "status=none"],
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  assert process.stdout is not None
                  for block in iter(lambda: process.stdout.read(8 * 1024 * 1024), b""):
                      digest.update(block); count += len(block)
                  process.stdout.close()
                  assert process.stderr is not None
                  detail = process.stderr.read().decode("utf-8", "replace").strip()
                  process.stderr.close()
                  if process.wait() != 0: fail(f"{label} O_DIRECT hash failed: {detail}")
              else:
                  with path.open("rb") as stream:
                      for block in iter(lambda: stream.read(1024 * 1024), b""):
                          digest.update(block); count += len(block)
              after = path.lstat()
              identity = lambda row: (row.st_dev, row.st_ino, row.st_size, row.st_mtime_ns, row.st_ctime_ns)
              if count != before.st_size or identity(before) != identity(after):
                  fail(f"{label} changed while hashed")
              if digest.hexdigest() != expected:
                  fail(f"{label} SHA-256 mismatch")
              if expected_bytes is not None and (isinstance(expected_bytes, bool)
                      or expected_bytes != count):
                  fail(f"{label} byte count mismatch")
              return path

          raw = descriptor_path.read_bytes()
          if hashlib.sha256(raw).hexdigest() != expected_descriptor_sha:
              fail("phase descriptor changed after shell binding")
          descriptor = json.loads(raw)
          required = {"schema", "ember_revision", "phase", "unlocked_plan", "capture_plan",
                      "output_dir", "launches", "release_scope"}
          if not isinstance(descriptor, dict) or set(descriptor) != required:
              fail("phase descriptor keys differ")
          if descriptor["schema"] != "ember.qwen3.8.quality-phase-descriptor.v1":
              fail("unsupported quality phase descriptor")
          if descriptor["ember_revision"] != target_sha or HEX40.fullmatch(target_sha) is None:
              fail("phase descriptor Ember revision mismatch")
          phase = descriptor["phase"]
          if phase not in {"sweep", "final"}:
              fail("quality phase must be sweep or final")
          if descriptor["release_scope"] != {
                  "modality": "text_only", "multimodal_release_claim": False,
                  "vision_mmproj_differential_pass": False}:
              fail("quality capture must remain explicitly text-only")
          output = descriptor["output_dir"]
          if (not isinstance(output, str) or not output.startswith("/") or "\0" in output
                  or "\n" in output or Path(output) == Path("/") or Path(output).exists()
                  or not Path(output).parent.is_dir() or Path(output).parent.is_symlink()
                  or Path(output).resolve() != Path(output)):
              fail("output_dir must be a new absolute runner path")

          def pinned_json(item, label):
              if not isinstance(item, dict) or set(item) != {"path", "sha256"}:
                  fail(f"{label} descriptor is malformed")
              path = exact_file(item["path"], item["sha256"], label)
              return json.loads(path.read_bytes()), path

          unlocked, unlocked_path = pinned_json(descriptor["unlocked_plan"], "unlocked plan")
          capture, capture_path = pinned_json(descriptor["capture_plan"], "capture plan")
          if not isinstance(capture, dict) or set(capture) != {
                  "schema", "contract_id", "corpus", "rubric", "agentic_cases",
                  "models", "judge", "runs"}:
              fail("quality capture plan keys differ")
          if capture["schema"] != "ember.qwen3.8.quality-capture-plan.v1":
              fail("unsupported quality capture plan")

          if phase == "sweep":
              if (unlocked.get("phase_scope") != "selection"
                      or unlocked.get("status") != "planned_unmeasured"
                      or "final_corpus_manifest" in unlocked):
                  fail("sweep quality requires the selection-only unlocked plan")
              expected_corpus = (unlocked.get("corpora") or {}).get("sweep-validation.jsonl")
              if not isinstance(expected_corpus, dict): fail("sweep corpus is absent")
              if (capture.get("corpus") or {}).get("sha256") == FINAL_SHA:
                  fail("final-heldout quality is inaccessible to the sweep workflow")
              capture_text = json.dumps(capture, ensure_ascii=False, sort_keys=True)
              if "final-heldout.jsonl" in capture_text or FINAL_SHA in capture_text:
                  fail("sweep capture plan references final-heldout capability")
              expected_sha = SWEEP_SHA
          else:
              if (unlocked.get("phase_scope") != "final_confirmation"
                      or unlocked.get("status") !=
                      "final_heldout_unlocked_after_mtp_depth_selection"):
                  fail("final quality requires the separately unlocked final plan")
              expected_corpus = (unlocked.get("corpora") or {}).get("final-heldout.jsonl")
              if not isinstance(expected_corpus, dict): fail("unlocked final corpus is absent")
              expected_sha = FINAL_SHA
          expected_binding = {key: expected_corpus.get(key) for key in ("path", "sha256")}
          if (capture.get("corpus") != expected_binding
                  or capture["corpus"].get("sha256") != expected_sha):
              fail("capture corpus differs from the already-unlocked phase corpus")
          if capture.get("agentic_cases", {}).get("sha256") != AGENTIC_SHA:
              fail("agentic cases are not the pinned 15-case corpus")
          if capture.get("rubric", {}).get("sha256") != RUBRIC_SHA:
              fail("judge rubric is not the pinned checked rubric")
          for key, label in (("corpus", "quality corpus"), ("rubric", "quality rubric"),
                             ("agentic_cases", "agentic cases")):
              item = capture[key]
              if not isinstance(item, dict) or set(item) != {"path", "sha256"}:
                  fail(f"{label} descriptor is malformed")
              exact_file(item["path"], item["sha256"], label)

          models = capture.get("models")
          if not isinstance(models, dict) or set(models) != {"stock", "candidate"}:
              fail("capture plan must bind exactly stock and candidate models")
          inventories = {}
          model_dirs = {}
          for variant in ("stock", "candidate"):
              model = models[variant]
              if not isinstance(model, dict) or set(model) != {
                      "candidate_id", "build_record_sha256", "intervention_manifest_sha256",
                      "profile_sha256", "quantization_overrides_sha256", "shards"}:
                  fail(f"{variant} model descriptor keys differ")
              for key in ("build_record_sha256", "intervention_manifest_sha256",
                          "profile_sha256", "quantization_overrides_sha256"):
                  if HEX64.fullmatch(str(model.get(key))) is None:
                      fail(f"{variant} {key} is malformed")
              shards = model.get("shards")
              if not isinstance(shards, list) or not shards: fail(f"{variant} has no shards")
              identity = []
              seen = set()
              for index, item in enumerate(shards, 1):
                  if not isinstance(item, dict) or set(item) != {"path", "sha256", "bytes"}:
                      fail(f"{variant} shard descriptor differs")
                  path = exact_file(item["path"], item["sha256"],
                                    f"{variant} shard {index}", item["bytes"])
                  if path in seen: fail(f"{variant} repeats a shard")
                  seen.add(path); identity.append({"index": index, "sha256": item["sha256"],
                                                   "bytes": item["bytes"]})
              parents = {str(path.parent.resolve()) for path in seen}
              if len(parents) != 1: fail(f"{variant} shards do not share one directory")
              model_dirs[variant] = next(iter(parents))
              inventories[variant] = hashlib.sha256(canonical(identity)).hexdigest()
          if inventories["stock"] == inventories["candidate"]:
              fail("stock and candidate inventories must differ")

          judge = capture.get("judge")
          if not isinstance(judge, dict) or set(judge) != {"artifact", "settings"}:
              fail("judge descriptor keys differ")
          artifact = judge["artifact"]
          if not isinstance(artifact, dict) or set(artifact) != {"path", "sha256", "bytes"}:
              fail("judge artifact descriptor is malformed")
          judge_path = exact_file(artifact["path"], artifact["sha256"],
                                  "judge artifact", artifact["bytes"])
          if judge.get("settings") != {"temperature": 0, "seed": 7301, "batch_size": 1,
                  "target_only": True, "speculative_decode": False,
                  "required_tool": "submit_verdict"}:
              fail("judge settings are not the deterministic target-only contract")
          model_dirs["judge"] = str(judge_path.parent.resolve())

          runs = capture.get("runs")
          launches = descriptor.get("launches")
          if (not isinstance(runs, dict) or set(runs) != {"stock", "candidate", "judge"}
                  or not isinstance(launches, dict) or set(launches) != set(runs)):
              fail("runtime launch set must be exactly stock, candidate, and judge")
          ports = set(); containers = set()
          for role in ("stock", "candidate", "judge"):
              run = runs[role]; launch = launches[role]
              if not isinstance(run, dict) or set(run) != {"container", "endpoint", "image", "loaded_path"}:
                  fail(f"{role} run definition keys differ")
              if (not isinstance(launch, dict)
                      or set(launch) != {"extra_arguments", "startup_timeout_seconds"}):
                  fail(f"{role} launch definition keys differ")
              if SAFE_CONTAINER.fullmatch(str(run.get("container"))) is None:
                  fail(f"{role} container name is unsafe")
              if run["container"] in containers: fail("capture containers must be unique")
              containers.add(run["container"])
              endpoint = urllib.parse.urlsplit(str(run.get("endpoint")))
              if (endpoint.scheme != "http" or endpoint.hostname not in {"127.0.0.1", "localhost"}
                      or endpoint.path != "/v1/chat/completions" or endpoint.query or endpoint.fragment
                      or endpoint.port is None or not 1024 <= endpoint.port <= 65535):
                  fail(f"{role} endpoint must be one loopback chat-completions URL")
              if endpoint.port in ports: fail("capture runtime ports must be unique")
              ports.add(endpoint.port)
              if IMAGE.fullmatch(str(run.get("image"))) is None:
                  fail(f"{role} image must be an immutable digest reference")
              loaded = run.get("loaded_path")
              host_first = (models[role]["shards"][0]["path"] if role != "judge"
                            else artifact["path"])
              if (not isinstance(loaded, str) or not loaded.startswith("/")
                      or Path(loaded).name != Path(host_first).name):
                  fail(f"{role} loaded path does not name its pinned artifact")
              arguments = launch["extra_arguments"]
              timeout = launch["startup_timeout_seconds"]
              if (not isinstance(arguments, list) or len(arguments) > 64
                      or not all(isinstance(arg, str) and arg and "\0" not in arg and "\n" not in arg
                                 for arg in arguments)
                      or isinstance(timeout, bool) or not isinstance(timeout, int)
                      or not 1 <= timeout <= 3600):
                  fail(f"{role} launch arguments/timeout are malformed")
              forbidden = re.compile(r"(^|[-_])(auth|credential|key|password|secret|token)([-_]|$)", re.I)
              owned = ("-m", "--model", "--host", "--port", "--draft")
              if any(arg in owned or any(arg.startswith(name + "=") for name in owned)
                     or forbidden.search(arg) for arg in arguments):
                  fail(f"{role} launch arguments override identity or may expose credentials")
              try:
                  subprocess.run(["docker", "container", "inspect", run["container"]],
                                 stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=True)
              except subprocess.CalledProcessError:
                  pass
              else:
                  fail(f"{role} capture container name already exists")

          if (runs["stock"]["image"] != runs["candidate"]["image"]
                  or launches["stock"] != launches["candidate"]):
              fail("stock and candidate must use the same runtime image and launch policy")
          print(phase)
          print(unlocked_path)
          print(capture_path)
          print(output)
          print(descriptor["unlocked_plan"]["sha256"])
          print(descriptor["capture_plan"]["sha256"])
          for role in ("stock", "candidate", "judge"):
              print(runs[role]["image"])
          PY
          )
          test "${#binding[@]}" -eq 9
          QUALITY_PHASE="${binding[0]}"
          UNLOCKED_PLAN="${binding[1]}"
          CAPTURE_PLAN="${binding[2]}"
          QUALITY_OUTPUT="${binding[3]}"
          UNLOCKED_PLAN_SHA256="${binding[4]}"
          CAPTURE_PLAN_SHA256="${binding[5]}"
          binding_dir="$RUNNER_TEMP/qwen-quality-binding-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$binding_dir"
          cp --no-clobber "$PHASE_DESCRIPTOR" "$binding_dir/phase-descriptor.json"
          cp --no-clobber "$UNLOCKED_PLAN" "$binding_dir/unlocked-plan.json"
          cp --no-clobber "$CAPTURE_PLAN" "$binding_dir/capture-plan.json"
          chmod 400 "$binding_dir"/*.json
          PHASE_DESCRIPTOR="$binding_dir/phase-descriptor.json"
          UNLOCKED_PLAN="$binding_dir/unlocked-plan.json"
          CAPTURE_PLAN="$binding_dir/capture-plan.json"
          test "$(sha256sum "$PHASE_DESCRIPTOR" | awk '{print $1}')" = "$PHASE_DESCRIPTOR_SHA256"
          test "$(sha256sum "$UNLOCKED_PLAN" | awk '{print $1}')" = "$UNLOCKED_PLAN_SHA256"
          test "$(sha256sum "$CAPTURE_PLAN" | awk '{print $1}')" = "$CAPTURE_PLAN_SHA256"
          printf 'QUALITY_PHASE=%s\nUNLOCKED_PLAN=%s\nCAPTURE_PLAN=%s\nQUALITY_OUTPUT=%s\n' \
            "$QUALITY_PHASE" "$UNLOCKED_PLAN" "$CAPTURE_PLAN" "$QUALITY_OUTPUT" >>"$GITHUB_ENV"
          printf 'QUALITY_CONTRACT=%s/quality-contract.json\nQUALITY_ASSESSMENT=%s/quality-assessment.json\n' \
            "$QUALITY_OUTPUT" "$QUALITY_OUTPUT" >>"$GITHUB_ENV"

          verify_path="$RUNNER_TEMP/qwen-quality-unlocked-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          python3 scripts/qwen_bakeoff.py --plan "$UNLOCKED_PLAN" --stage verify --output "$verify_path"
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$verify_path")" = canonical_plan_verified
          for image in "${binding[@]:6}"; do
            docker pull "$image" >/dev/null
            docker image inspect "$image" >/dev/null
          done
          python3 - "$CAPTURE_PLAN" "$TARGET_SHA" <<'PY'
          import json, re, subprocess, sys
          plan = json.load(open(sys.argv[1], encoding="utf-8")); target = sys.argv[2]
          for role, run in plan["runs"].items():
              records = json.loads(subprocess.check_output(
                  ["docker", "image", "inspect", run["image"]], text=True))
              if len(records) != 1 or run["image"] not in (records[0].get("RepoDigests") or []):
                  raise SystemExit(f"{role} immutable image did not resolve exactly")
              revision = (((records[0].get("Config") or {}).get("Labels") or {})
                          .get("org.opencontainers.image.revision"))
              if re.fullmatch(r"[0-9a-f]{40}", str(revision)) is None:
                  raise SystemExit(f"{role} image lacks an exact engine revision")
              if role in {"stock", "candidate"} and revision != target:
                  raise SystemExit(f"{role} runtime revision differs from the capture driver revision")
          PY
          echo 'ready=yes' >>"$GITHUB_OUTPUT"

      - name: Take the GPU lock and quiesce supervised production
        id: exclusive
        if: ${{ steps.preflight.outputs.ready == 'yes' }}
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/ember-gpu-lock acquire
          echo 'lock_acquired=yes' >>"$GITHUB_OUTPUT"
          if sudo -n /usr/local/sbin/ember-cert-production is-active >/dev/null 2>&1; then
            echo 'production_was_active=yes' >>"$GITHUB_OUTPUT"
            sudo -n /usr/local/sbin/ember-cert-production stop
          else
            echo 'production_was_active=no' >>"$GITHUB_OUTPUT"
          fi
          sudo -n /usr/local/sbin/ember-cert-production mask
          echo 'armed=yes' >>"$GITHUB_OUTPUT"

      - name: Capture stock, candidate, judge, assemble, and verify serially
        id: quality
        if: ${{ steps.exclusive.outputs.armed == 'yes' }}
        run: |
          set -euo pipefail
          current_container=''
          remove_current() {
            if [[ -n "$current_container" ]]; then
              docker rm -f "$current_container" >/dev/null 2>&1 || true
              current_container=''
            fi
          }
          cleanup_capture() { local rc=$?; trap - EXIT INT TERM; remove_current; exit "$rc"; }
          trap cleanup_capture EXIT INT TERM

          start_runtime() {
            local role="$1"
            local available_kib=0
            for _ in $(seq 1 300); do
              available_kib="$(awk '/^MemAvailable:/ { print $2 }' /proc/meminfo)"
              (( available_kib >= 100 * 1024 * 1024 )) && break
              sleep 2
            done
            (( available_kib >= 100 * 1024 * 1024 )) || {
              echo "less than 100 GiB is available before the $role residency" >&2
              return 1
            }
            current_container="$(python3 - "$PHASE_DESCRIPTOR" "$CAPTURE_PLAN" "$role" <<'PY'
          import json, subprocess, sys, time, urllib.parse, urllib.request
          from pathlib import Path
          descriptor = json.load(open(sys.argv[1], encoding="utf-8")); role = sys.argv[3]
          plan = json.load(open(sys.argv[2], encoding="utf-8"))
          run = plan["runs"][role]; launch = descriptor["launches"][role]
          artifact = (plan["models"][role]["shards"][0] if role != "judge"
                      else plan["judge"]["artifact"])
          source = str(Path(artifact["path"]).parent.resolve())
          destination = str(Path(run["loaded_path"]).parent)
          port = urllib.parse.urlsplit(run["endpoint"]).port
          command = ["docker", "run", "-d", "--pull", "never", "--name", run["container"],
              "--network", "host", "--device", "/dev/kfd", "--device", "/dev/dri",
              "--group-add", "video", "--group-add", "render", "--ipc", "host",
              "--security-opt", "seccomp=unconfined", "--ulimit", "memlock=-1:-1",
              "--mount", f"type=bind,source={source},target={destination},readonly",
              "--env", "DFLASH_DS4_SPEC=0", "--env", "DFLASH_DSPARK_XDNA_PLUGIN=",
              "--env", "DFLASH_DSPARK_XDNA_GPU_MAIN=", "--env", "DFLASH_DSPARK_XDNA_REQUIRED=",
              "--entrypoint", "/usr/local/bin/ember-dflash", run["image"],
              "-m", run["loaded_path"], "--host", "127.0.0.1", "--port", str(port),
              *launch["extra_arguments"]]
          container = subprocess.check_output(command, text=True).strip()
          if not container: raise SystemExit(f"{role} container did not start")
          health = f"http://127.0.0.1:{port}/health"
          deadline = time.monotonic() + launch["startup_timeout_seconds"]
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen(health, timeout=2) as response:
                      if response.status == 200:
                          print(run["container"]); raise SystemExit(0)
              except Exception:
                  pass
              state = subprocess.run(["docker", "inspect", "--format", "{{.State.Running}}",
                                      run["container"]], text=True, capture_output=True)
              if state.returncode != 0 or state.stdout.strip() != "true":
                  subprocess.run(["docker", "logs", "--tail", "200", run["container"]], check=False)
                  raise SystemExit(f"{role} container exited before health")
              time.sleep(2)
          subprocess.run(["docker", "logs", "--tail", "200", run["container"]], check=False)
          raise SystemExit(f"{role} runtime health timed out")
          PY
            )"
          }

          start_runtime stock
          python3 scripts/qwen_quality_capture.py --plan "$CAPTURE_PLAN" \
            --output-dir "$QUALITY_OUTPUT" responses --variant stock
          python3 scripts/qwen_quality_capture.py --plan "$CAPTURE_PLAN" \
            --output-dir "$QUALITY_OUTPUT" agentic --variant stock
          remove_current

          start_runtime candidate
          python3 scripts/qwen_quality_capture.py --plan "$CAPTURE_PLAN" \
            --output-dir "$QUALITY_OUTPUT" responses --variant candidate
          python3 scripts/qwen_quality_capture.py --plan "$CAPTURE_PLAN" \
            --output-dir "$QUALITY_OUTPUT" agentic --variant candidate
          remove_current

          start_runtime judge
          python3 scripts/qwen_quality_capture.py --plan "$CAPTURE_PLAN" \
            --output-dir "$QUALITY_OUTPUT" judge
          remove_current

          python3 scripts/qwen_quality_capture.py --plan "$CAPTURE_PLAN" \
            --output-dir "$QUALITY_OUTPUT" assemble
          contract_sha="$(sha256sum "$QUALITY_CONTRACT" | awk '{print $1}')"
          set +e
          python3 scripts/qwen_quality_judge.py --contract "$QUALITY_CONTRACT" \
            --contract-sha256 "$contract_sha" --output "$QUALITY_ASSESSMENT"
          judge_status=$?
          set -e
          (( judge_status == 0 || judge_status == 1 )) || exit "$judge_status"
          mkdir "$QUALITY_OUTPUT/workflow"
          cp --no-clobber "$PHASE_DESCRIPTOR" "$QUALITY_OUTPUT/workflow/phase-descriptor.json"
          cp --no-clobber "$UNLOCKED_PLAN" "$QUALITY_OUTPUT/workflow/unlocked-plan.json"
          cp --no-clobber "$CAPTURE_PLAN" "$QUALITY_OUTPUT/workflow/capture-plan.json"
          cp --no-clobber scripts/qwen_quality_judge.py "$QUALITY_OUTPUT/runtime/qwen_quality_judge.py"
          printf 'QUALITY_CONTRACT_SHA256=%s\n' "$contract_sha" >>"$GITHUB_ENV"
          printf 'audited_quality_pass=%s\n' "$(python3 -c \
            'import json,sys; print(str(json.load(open(sys.argv[1]))["audited_quality_pass"]).lower())' \
            "$QUALITY_ASSESSMENT")" >>"$GITHUB_OUTPUT"

      - name: Restore production and release the GPU lock
        id: restore
        if: ${{ always() && steps.exclusive.outputs.lock_acquired == 'yes' }}
        run: |
          set +e
          restore_failed=0
          python3 - "$PHASE_DESCRIPTOR" "$CAPTURE_PLAN" <<'PY' || restore_failed=1
          import json, subprocess, sys
          descriptor = json.load(open(sys.argv[1], encoding="utf-8"))
          plan = json.load(open(sys.argv[2], encoding="utf-8"))
          failed = False
          for run in plan["runs"].values():
              exists = subprocess.run(["docker", "container", "inspect", run["container"]],
                                      stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              if exists.returncode == 0:
                  removed = subprocess.run(["docker", "rm", "-f", run["container"]],
                                           stdout=subprocess.DEVNULL,
                                           stderr=subprocess.DEVNULL)
                  failed = failed or removed.returncode != 0
          if failed: raise SystemExit("one or more capture containers could not be removed")
          PY
          sudo -n /usr/local/sbin/ember-cert-production unmask || restore_failed=1
          if [[ "${{ steps.exclusive.outputs.production_was_active }}" = yes ]]; then
            sudo -n /usr/local/sbin/ember-cert-production start || restore_failed=1
            production_healthy=0
            for _ in $(seq 1 300); do
              if sudo -n /usr/local/sbin/ember-cert-production is-active >/dev/null 2>&1 &&
                 curl --fail --silent --max-time 2 http://127.0.0.1:8000/health >/dev/null 2>&1; then
                production_healthy=1
                break
              fi
              sleep 2
            done
            (( production_healthy )) || restore_failed=1
          fi
          sudo -n /usr/local/sbin/ember-gpu-lock release || restore_failed=1
          exit "$restore_failed"

      - name: Attest the exact verified quality contract
        id: attest
        if: ${{ steps.quality.outcome == 'success' && steps.restore.outcome == 'success' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.QUALITY_CONTRACT }}

      - name: Retain and independently verify the attestation before bakeoff handoff
        id: handoff
        if: ${{ steps.attest.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEST_BUNDLE_SOURCE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          set +x
          [[ "$ATTEST_BUNDLE_SOURCE" = /* && -f "$ATTEST_BUNDLE_SOURCE" && ! -L "$ATTEST_BUNDLE_SOURCE" ]]
          retained_bundle="$QUALITY_OUTPUT/quality-contract.sigstore.json"
          test ! -e "$retained_bundle"
          cp "$ATTEST_BUNDLE_SOURCE" "$retained_bundle"
          gh attestation verify "$QUALITY_CONTRACT" --bundle "$retained_bundle" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow .github/workflows/qwen-quality-capture.yml
          python3 - "$PHASE_DESCRIPTOR" "$QUALITY_CONTRACT" "$QUALITY_ASSESSMENT" \
            "$retained_bundle" "$QUALITY_OUTPUT/quality-contract-handoff.json" \
            "$GITHUB_REPOSITORY" <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          descriptor, contract, assessment, bundle, output = map(Path, sys.argv[1:6])
          repository = sys.argv[6]
          def item(path):
              raw = path.read_bytes()
              return {"path": str(path.resolve()), "sha256": hashlib.sha256(raw).hexdigest(),
                      "bytes": len(raw)}
          result = {
              "schema": "ember.qwen3.8.quality-contract-handoff.v1",
              "release_scope": {"modality": "text_only", "multimodal_release_claim": False,
                                "vision_mmproj_differential_pass": False},
              "phase_descriptor": item(descriptor), "quality_contract": item(contract),
              "quality_assessment": item(assessment), "attestation_bundle": item(bundle),
              "repository": repository,
              "signer_workflow": ".github/workflows/qwen-quality-capture.yml",
              "external_attestation_verified": True,
              "ready_for_bakeoff_adjudication": True,
              "publication_allowed": False,
          }
          flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
          fd = os.open(output, flags, 0o644)
          with os.fdopen(fd, "w", encoding="utf-8") as stream:
              json.dump(result, stream, indent=2, sort_keys=True); stream.write("\n")
              stream.flush(); os.fsync(stream.fileno())
          PY
          printf 'ATTESTATION_BUNDLE=%s\nQUALITY_HANDOFF=%s\n' \
            "$retained_bundle" "$QUALITY_OUTPUT/quality-contract-handoff.json" >>"$GITHUB_ENV"
          echo 'verified=yes' >>"$GITHUB_OUTPUT"

      - name: Upload the retained text-only quality evidence and attestation bundle
        if: ${{ steps.handoff.outputs.verified == 'yes' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qwen-quality-${{ env.QUALITY_PHASE }}-${{ inputs.commit_sha }}
          path: ${{ env.QUALITY_OUTPUT }}
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary registry credentials
        if: ${{ always() && env.DOCKER_CONFIG != '' }}
        run: |
          rm -f -- "$DOCKER_CONFIG/config.json"
          rmdir -- "$DOCKER_CONFIG" 2>/dev/null || true

      - name: Record the non-publishing quality handoff
        if: ${{ steps.handoff.outputs.verified == 'yes' }}
        run: |
          {
            echo '## Qwen staged quality evidence captured and externally verified'
            echo
            echo "Phase: \`$QUALITY_PHASE\`"
            echo "Contract SHA-256: \`$QUALITY_CONTRACT_SHA256\`"
            echo "Audited quality pass: \`${{ steps.quality.outputs.audited_quality_pass }}\`"
            echo "Retained attestation bundle: \`$ATTESTATION_BUNDLE\`"
            echo "Bakeoff handoff: \`$QUALITY_HANDOFF\`"
            echo
            echo 'The release scope is text-only. No multimodal/mmproj claim was made.'
            echo 'This workflow captures evidence only and never publishes a model.'
          } >>"$GITHUB_STEP_SUMMARY"
