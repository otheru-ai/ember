name: Qwen Q3 PLE first-token construction plan

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
    outputs:
      operation_request:
        value: ${{ jobs.plan.outputs.operation_request }}
      operation_request_sha256:
        value: ${{ jobs.plan.outputs.operation_request_sha256 }}
      candidate_id:
        value: ${{ jobs.plan.outputs.candidate_id }}
      construction_mode:
        value: ${{ jobs.plan.outputs.construction_mode }}

permissions:
  contents: read
  packages: read

concurrency:
  group: qwen-q3-first-token-plan-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: [self-hosted, linux, x64, gfx1151]
    timeout-minutes: 15
    outputs:
      operation_request: ${{ steps.plan.outputs.operation_request }}
      operation_request_sha256: ${{ steps.plan.outputs.operation_request_sha256 }}
      candidate_id: ${{ steps.plan.outputs.candidate_id }}
      construction_mode: ${{ steps.plan.outputs.construction_mode }}
    env:
      TARGET_SHA: ${{ inputs.commit_sha }}
      CAPTURE_MANIFEST: /var/tmp/ember-qwen3.8-flash-next/evidence/qwen-capture-control-e58581e2f19e-33122633860-1/capture-manifest.json
      CAPTURE_MANIFEST_SHA256: 7fdb3e0320b99694752aa6b178f9d5affabe13677bfc0461f10792fe12a20957
      CACHE_MANIFEST: /var/tmp/ember-qwen3.8-flash-next/artifacts/qwen-workset/bf16-cache/bf16-b73372ab7cc900588d4c865507a1578919a1cc292b51425cbf3c5ed778702f0f/bf16-cache-manifest.json
      CACHE_MANIFEST_SHA256: f34a7b81240eb7f37816c1097c617e7f68eaf41920c93268a069989c2059fdeb
      COMPANION_ROCMI4: /var/tmp/ember-qwen3.8-flash-next/artifacts/qwen-workset/companions/ROCMI4.json
      COMPANION_ROCMI4_SHA256: 0129ff135c9f0bd889f9d7d036e73e97d38013ccdaa4b425e8e5549cab670924
      COMPANION_FAST: /var/tmp/ember-qwen3.8-flash-next/artifacts/qwen-workset/companions/ROCMFP4-FAST.json
      COMPANION_FAST_SHA256: 88145a45d05c669527125de842350d3917e4e175227c3aee7eeb6e20acca1bea
      INTERVENTION_ID: lambda-0.25-band-10-42
      QUANTIZATION_ARM: rocmfp4-fast-matrix-q3-ple-q6k-embedding-head
      FORMAT_ROW_ID: rocmfp4-fast-matrix-q3-ple-main-rocmfp4-fast-mtp-d3
      ARTIFACT_BUILDER_SHA: b753813605fb84da5e262464d9cd2747a9fbdb73
      REUSABLE_CONSTRUCTION: /var/tmp/ember-qwen3.8-flash-next/artifacts/qwen-workset/evidence/construction-q3-ple-first-token-b753813605fb.json
      REUSABLE_CONSTRUCTION_SHA256: a2bbf152f41439a45faa348756d51d725e6f0f651aa973c36c00c63bca6d332a
    steps:
      - name: Remove bounded legacy profiler residue before checkout
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          profiler_residue="$GITHUB_WORKSPACE/.rocprofv3"
          if [[ ! -e "$profiler_residue" && ! -L "$profiler_residue" ]]; then
            exit 0
          fi
          test -d "$profiler_residue" && test ! -L "$profiler_residue"
          docker_config="$RUNNER_TEMP/qwen-plan-cleanup-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          install -d -m 700 "$docker_config"
          cleanup() {
            rm -f -- "$docker_config/config.json"
            rmdir -- "$docker_config" 2>/dev/null || true
          }
          trap cleanup EXIT
          export DOCKER_CONFIG="$docker_config"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          builder_tag="$repository:dev-sha-${TARGET_SHA:0:12}"
          docker pull "$builder_tag"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' \
            "$builder_tag")" = "$TARGET_SHA"
          docker run --rm --network none --memory 64m --memory-swap 64m \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 16 \
            --user 0:0 -v "$profiler_residue:/residue" \
            --entrypoint /usr/bin/find "$builder_tag" \
            /residue -mindepth 1 -delete
          rmdir -- "$profiler_residue"
          test ! -e "$profiler_residue" && test ! -L "$profiler_residue"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Derive one create-only non-promotable Q3 runtime-smoke request
        id: plan
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --quiet --exit-code
          workset=/var/tmp/ember-qwen3.8-flash-next/artifacts/qwen-workset
          evidence="$workset/evidence"
          requests="$evidence/operation-requests"
          corpus="$workset/selection-corpus"
          for directory in "$workset" "$evidence" "$requests" "$corpus"; do
            test -d "$directory" && test ! -L "$directory"
          done
          for descriptor in \
              "$CAPTURE_MANIFEST:$CAPTURE_MANIFEST_SHA256" \
              "$CACHE_MANIFEST:$CACHE_MANIFEST_SHA256" \
              "$COMPANION_ROCMI4:$COMPANION_ROCMI4_SHA256" \
              "$COMPANION_FAST:$COMPANION_FAST_SHA256"; do
            path="${descriptor%:*}"; digest="${descriptor##*:}"
            test -f "$path" && test ! -L "$path"
            test "$(sha256sum "$path" | awk '{print $1}')" = "$digest"
          done
          short="${TARGET_SHA:0:12}"
          # Candidate weights are content artifacts, not runtime builds.  Reuse
          # the completed b753 artifact when none of the quantizer, recipe, or
          # immutable-input interpretation sources changed. Runtime/server/HIP
          # graph changes are intentionally outside this list.
          artifact_inputs=(
            CMakeLists.txt
            scripts/qwen_quantize.py
            tools/gguf_quantize.cpp tools/gguf_quantize_common.cpp
            tools/gguf_quantize_common.h
            engine/ggml/include/ggml.h engine/ggml/include/gguf.h
            engine/ggml/src/CMakeLists.txt engine/ggml/src/ggml.c
            engine/ggml/src/ggml.cpp engine/ggml/src/ggml-quants.c
            engine/ggml/src/ggml-quants.h engine/ggml/src/gguf.cpp
            engine/ggml/src/rocmfp4 engine/ggml/src/rocmfpx
            engine/third_party
            patches/llama.cpp
            share/release_profiles/qwen3.8-flash-next-rocmi4-strix-halo.json
            share/quant_eval/qwen3.8-flash-next-bakeoff.json
          )
          # Candidate-builder retention/reconstruction bookkeeping cannot
          # change weight bytes.  Compare its AST with only an explicit set of
          # retirement-only definitions omitted; every other edit rebuilds.
          if git diff --quiet "$ARTIFACT_BUILDER_SHA..$TARGET_SHA" -- \
                "${artifact_inputs[@]}" && \
              python3 scripts/qwen_builder_change_scope.py \
                --repository "$GITHUB_WORKSPACE" \
                --base "$ARTIFACT_BUILDER_SHA" --target "$TARGET_SHA"; then
            test -f "$REUSABLE_CONSTRUCTION" && test ! -L "$REUSABLE_CONSTRUCTION"
            test "$(sha256sum "$REUSABLE_CONSTRUCTION" | awk '{print $1}')" = \
              "$REUSABLE_CONSTRUCTION_SHA256"
            candidate_id="$(python3 - "$REUSABLE_CONSTRUCTION" <<'PY'
          import json, pathlib, sys
          value=json.loads(pathlib.Path(sys.argv[1]).read_text())
          if (value.get("schema")!="ember.qwen3.8.candidate-construction.v1"
                  or value.get("builder_revision")!=
                     "b753813605fb84da5e262464d9cd2747a9fbdb73"
                  or value.get("quantization_arm")!=
                     "rocmfp4-fast-matrix-q3-ple-q6k-embedding-head"):
              raise SystemExit("reusable Q3 construction identity differs")
          print(value["candidate_id"])
          PY
            )"
            request="$requests/reuse-q3-first-token-$short.json"
            test ! -e "$request" && test ! -L "$request"
            python3 - "$request" "$REUSABLE_CONSTRUCTION" \
                "$REUSABLE_CONSTRUCTION_SHA256" <<'PY'
          import json, os, pathlib, sys
          destination, construction, digest = sys.argv[1:]
          value={"schema":"ember.qwen3.8.candidate-construction-request.v1",
                 "mode":"reuse-candidate",
                 "parameters":{"construction_descriptor":{
                     "path":str(pathlib.Path(construction).resolve()),"sha256":digest}},
                 "publishes":False,"deletes":False}
          raw=(json.dumps(value,indent=2,sort_keys=True)+"\n").encode()
          output=pathlib.Path(destination)
          if output.exists() or output.is_symlink():
              if output.is_symlink() or not output.is_file() or output.read_bytes()!=raw:
                  raise SystemExit("existing reuse request differs")
          else:
              fd=os.open(destination,os.O_WRONLY|os.O_CREAT|os.O_EXCL|
                         getattr(os,"O_NOFOLLOW",0),0o600)
              with os.fdopen(fd,"wb") as stream:
                  stream.write(raw);stream.flush();os.fsync(stream.fileno())
          PY
            request_sha="$(sha256sum "$request" | awk '{print $1}')"
            printf 'operation_request=%s\noperation_request_sha256=%s\ncandidate_id=%s\nconstruction_mode=reuse-candidate\n' \
              "$request" "$request_sha" "$candidate_id" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          candidate_id="q3-ple-first-token-$short"
          candidate="$workset/candidates/$candidate_id"
          test ! -e "$candidate" && test ! -L "$candidate"
          plan="$evidence/selection-plan-q3-first-token-$short.json"
          expected="$RUNNER_TEMP/qwen-q3-first-token-plan-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          python3 scripts/qwen_bakeoff.py --corpus-dir "$corpus" --output "$expected"
          if [[ -e "$plan" || -L "$plan" ]]; then
            test -f "$plan" && test ! -L "$plan"
            cmp "$expected" "$plan"
          else
            install -m 0600 -- "$expected" "$plan"
          fi
          plan_sha="$(sha256sum "$plan" | awk '{print $1}')"
          python3 scripts/qwen_bakeoff.py --plan "$plan" --stage verify \
            --output "$RUNNER_TEMP/qwen-q3-first-token-plan-verified-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          intervention="$CAPTURE_MANIFEST"
          mapfile -t intervention_pair < <(python3 - "$CAPTURE_MANIFEST" \
              "$INTERVENTION_ID" "$QUANTIZATION_ARM" "$FORMAT_ROW_ID" "$plan" <<'PY'
          import hashlib, json, pathlib, sys
          capture_path, intervention_id, arm, row_id, plan_path = sys.argv[1:]
          capture = json.loads(pathlib.Path(capture_path).read_text())
          if (capture.get("schema") != "ember.qwen3.8.stock-control-activation-capture.v1"
                  or capture.get("status") != "complete"
                  or capture.get("publishes") is not False
                  or capture.get("stock_rocmi4_only") is not True):
              raise SystemExit("capture manifest is not completed immutable stock evidence")
          rows = [row for row in capture.get("interventions", [])
                  if row.get("id") == intervention_id]
          if len(rows) != 1:
              raise SystemExit("selected intervention does not occur exactly once")
          path = (pathlib.Path(capture_path).parent / rows[0]["filename"]).resolve()
          if (not path.is_file() or path.is_symlink()
                  or hashlib.sha256(path.read_bytes()).hexdigest() != rows[0]["sha256"]):
              raise SystemExit("selected intervention bytes differ from capture inventory")
          plan = json.loads(pathlib.Path(plan_path).read_text())
          formats = [row for row in plan.get("format_arms", [])
                     if row.get("id") == row_id]
          if (len(formats) != 1 or formats[0].get("quantization_arm") != arm
                  or formats[0].get("mtp_matrix_quant_contract") != "Q4_0_ROCMFP4_FAST"
                  or formats[0].get("mtp_depth") != 3):
              raise SystemExit("current plan lacks the exact Q3-PLE/FAST-MTP smoke row")
          print(path); print(rows[0]["sha256"])
          PY
          )
          (( ${#intervention_pair[@]} == 2 ))
          request="$requests/construction-q3-first-token-$short.json"
          test ! -e "$request" && test ! -L "$request"
          python3 - "$request" "$CAPTURE_MANIFEST" "$CAPTURE_MANIFEST_SHA256" \
              "$CACHE_MANIFEST" "$CACHE_MANIFEST_SHA256" \
              "$COMPANION_ROCMI4" "$COMPANION_ROCMI4_SHA256" \
              "$COMPANION_FAST" "$COMPANION_FAST_SHA256" "$plan" "$plan_sha" \
              "$candidate_id" "$FORMAT_ROW_ID" "$INTERVENTION_ID" \
              "${intervention_pair[0]}" "${intervention_pair[1]}" "$QUANTIZATION_ARM" <<'PY'
          import json, os, pathlib, sys
          (destination, capture, capture_sha, cache, cache_sha, rocmi4, rocmi4_sha,
           fast, fast_sha, plan, plan_sha, candidate_id, row_id, intervention_id,
           intervention, intervention_sha, arm) = sys.argv[1:]
          def desc(path, digest): return {"path": str(pathlib.Path(path).resolve()), "sha256": digest}
          value = {
              "schema": "ember.qwen3.8.candidate-construction-request.v1",
              "mode": "build-candidate",
              "parameters": {
                  "capture_manifest": desc(capture, capture_sha),
                  "cache_manifest": desc(cache, cache_sha),
                  "companion_rocmi4": desc(rocmi4, rocmi4_sha),
                  "companion_fast": desc(fast, fast_sha),
                  "selection_plan": desc(plan, plan_sha),
                  "candidate_kind": "intervention",
                  "candidate_stage": "format",
                  "row_id": row_id,
                  "candidate_id": candidate_id,
                  "intervention_configuration_id": intervention_id,
                  "intervention_manifest": desc(intervention, intervention_sha),
                  "quantization_arm": arm,
                  "mtp_matrix_quant_contract": "Q4_0_ROCMFP4_FAST",
              },
              "publishes": False,
              "deletes": False,
          }
          output = pathlib.Path(destination)
          fd = os.open(output, os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, "O_NOFOLLOW", 0), 0o600)
          with os.fdopen(fd, "w", encoding="utf-8") as stream:
              json.dump(value, stream, indent=2, sort_keys=True)
              stream.write("\n"); stream.flush(); os.fsync(stream.fileno())
          directory = os.open(output.parent, os.O_RDONLY | getattr(os, "O_DIRECTORY", 0))
          try: os.fsync(directory)
          finally: os.close(directory)
          PY
          request_sha="$(sha256sum "$request" | awk '{print $1}')"
          printf 'operation_request=%s\noperation_request_sha256=%s\ncandidate_id=%s\nconstruction_mode=build-candidate\n' \
            "$request" "$request_sha" "$candidate_id" >>"$GITHUB_OUTPUT"

      - name: Summarize the nonpublishing runtime-smoke construction request
        run: |
          {
            echo '## Qwen Q3 PLE first-token construction planned'
            echo
            echo "Candidate: \`${{ steps.plan.outputs.candidate_id }}\`"
            echo "Request: \`${{ steps.plan.outputs.operation_request }}\`"
            echo "Request SHA-256: \`${{ steps.plan.outputs.operation_request_sha256 }}\`"
            echo 'This smoke lane is non-promotable and made no GPU, publication, or deletion claim.'
          } >>"$GITHUB_STEP_SUMMARY"
