name: gfx1151 certification

on:
  workflow_call:
    inputs:
      commit_sha:
        description: Full 40-character candidate SHA to certify and promote
        required: true
        type: string
      release_version:
        description: Optional YEAR.M.D override; defaults to the current UTC date
        required: false
        type: string
    secrets:
      RELEASE_AUTOMATION_TOKEN:
        required: true
      FORGEJO_RELEASE_SSH_KEY:
        required: true
      FORGEJO_SSH_HOST_KEYS:
        required: true
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA whose sha-* image will be certified
        required: true
        type: string
      release_version:
        description: Optional YEAR.M.D override; defaults to the current UTC date
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: gfx1151-certification
  cancel-in-progress: false

jobs:
  qwen-preflight:
    # Feature-branch research uses the existing release_version input so this
    # branch can be dispatched before a new workflow interface reaches main.
    # It is read-only: no GPU lock, production quiesce, model load, or artifact
    # download occurs in this mode.
    if: startsWith(inputs.release_version, 'qwen-preflight')
    runs-on: [self-hosted, linux, x64, gfx1151]
    timeout-minutes: 10
    steps:
      - name: Inspect Qwen conversion and benchmark capacity
        run: |
          set -euo pipefail
          echo 'host:' "$(hostname)"
          echo 'kernel:' "$(uname -srmo)"
          awk '/^(MemTotal|MemAvailable|SwapTotal):/ { print }' /proc/meminfo
          for path in / /scratch /models /srv/models; do
            [[ ! -e "$path" ]] || df -B1 --output=source,size,avail,target "$path"
          done
          printf 'kfd_readable=%s dri_present=%s\n' \
            "$([[ -r /dev/kfd ]] && echo true || echo false)" \
            "$([[ -d /dev/dri ]] && echo true || echo false)"
          revision=f5d08274bafd880402bd16f5e3e6c514136ec06c
          for path in \
            "/models/Qwen3.8-Flash-Next/snapshots/$revision" \
            "/srv/models/Qwen3.8-Flash-Next/snapshots/$revision" \
            "/scratch/Qwen3.8-Flash-Next/snapshots/$revision"; do
            [[ ! -e "$path" ]] || {
              printf 'snapshot_candidate=%s config=%s index=%s\n' "$path" \
                "$([[ -f "$path/config.json" ]] && echo true || echo false)" \
                "$([[ -f "$path/model.safetensors.index.json" ]] && echo true || echo false)"
            }
          done

  certify:
    # This reusable workflow is called only after the exact main-branch
    # candidate image passes every hosted and container gate. It is never
    # referenced by pull_request jobs: the runner has direct GPU and production
    # Docker access.
    if: ${{ !startsWith(inputs.release_version, 'qwen-') }}
    runs-on: [self-hosted, linux, x64, gfx1151]
    timeout-minutes: 180
    env:
      TARGET_SHA: ${{ inputs.commit_sha }}
      MODEL_PATH: ${{ vars.EMBER_CERT_MODEL_PATH }}
      DRAFT_PATH: ${{ vars.EMBER_CERT_DRAFT_PATH }}
      PORT: ${{ vars.EMBER_CERT_PORT || '18080' }}
      PRODUCTION_CONTAINER: ${{ vars.EMBER_PRODUCTION_CONTAINER || 'ember-server' }}
    steps:
      - name: Validate configured artifacts and devices
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MODEL_PATH" = /* && -f "$MODEL_PATH" ]]
          [[ "$DRAFT_PATH" = /* && -f "$DRAFT_PATH" ]]
          [[ "$PORT" =~ ^[0-9]+$ ]] && (( PORT >= 1024 && PORT <= 65535 ))
          [[ -r /dev/kfd && -d /dev/dri ]]
          if grep -Eq '(^| )(iommu|amd_iommu)=off( |$)' /proc/cmdline; then
            echo 'IOMMU is disabled in the kernel command line'
            exit 1
          fi
          find /sys/kernel/iommu_groups -mindepth 1 -maxdepth 1 -type d \
            -print -quit | grep -q .
          command -v docker >/dev/null
          command -v curl >/dev/null
          command -v dd >/dev/null
          command -v python3 >/dev/null
          [[ -x /usr/local/sbin/ember-cert-production ]]
          docker_config="$RUNNER_TEMP/ember-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$docker_config"
          prompt_path="$RUNNER_TEMP/ember-cert-short-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt"
          disk_prompt_path="$RUNNER_TEMP/ember-cert-disk-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt"
          printf '%s\n' \
            'Explain why deterministic validation matters for an inference server. Use at least eight sentences.' \
            >"$prompt_path"
          awk 'BEGIN { for (i = 1; i <= 700; i++) printf "Validation sentence %d preserves a deterministic model context.\n", i }' \
            >"$disk_prompt_path"
          printf 'PROMPT_PATH=%s\nDISK_PROMPT_PATH=%s\n' \
            "$prompt_path" "$disk_prompt_path" >>"$GITHUB_ENV"
          printf 'DOCKER_CONFIG=%s\n' "$docker_config" >>"$GITHUB_ENV"
          if curl --fail --silent --max-time 2 \
              "http://127.0.0.1:$PORT/health" >/dev/null 2>&1; then
            echo "port $PORT already serves an HTTP health endpoint"
            exit 1
          fi

      - name: Take the GPU lock
        # /root/GPU-LOCK.md is the protocol both agents on this box follow, and
        # certification was not following it. Two model-loading processes do not
        # fail loudly: the second falls back to hybrid expert placement, which
        # disables DSpark and changes generated tokens.
        #
        # Through the wrapper, because /root is dr-xr-x--- and the runner cannot
        # open the lock file itself. Calling flock directly here looked like a
        # hang: it had already failed with EACCES and the wait had nothing to
        # wait for.
        run: sudo -n /usr/local/sbin/ember-gpu-lock acquire

      - name: Quiesce production for exclusive GPU validation
        id: production
        run: |
          set -euo pipefail
          echo 'restore=none' >>"$GITHUB_OUTPUT"
          if sudo -n /usr/local/sbin/ember-cert-production is-active >/dev/null 2>&1; then
            echo 'restore=service' >>"$GITHUB_OUTPUT"
            sudo -n /usr/local/sbin/ember-cert-production stop
          elif docker inspect "$PRODUCTION_CONTAINER" >/dev/null 2>&1 &&
              [[ "$(docker inspect --format '{{.State.Running}}' "$PRODUCTION_CONTAINER")" = true ]]; then
            echo 'restore=container' >>"$GITHUB_OUTPUT"
            docker stop --timeout 180 "$PRODUCTION_CONTAINER"
          fi
          if docker inspect "$PRODUCTION_CONTAINER" >/dev/null 2>&1 &&
              [[ "$(docker inspect --format '{{.State.Running}}' "$PRODUCTION_CONTAINER")" = true ]]; then
            echo 'production remained active after quiesce request'
            exit 1
          fi
          # Stopping is not enough. Quiescing happens once and the job then runs
          # for twenty minutes assuming production stays down; the other agent on
          # this box restarted it mid-run through this same wrapper, and two
          # loaders on one 125 GiB device degraded the candidate to hybrid expert
          # placement. Block starts for the duration, so an attempt fails with an
          # assertion error rather than quietly costing the run.
          sudo -n /usr/local/sbin/ember-cert-production mask
          echo 'blocked=yes' >>"$GITHUB_OUTPUT"

      - name: Log in to GHCR and pull the exact candidate
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! login_output="$(echo "$GHCR_TOKEN" | \
              docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin 2>&1)"; then
            printf '%s\n' "$login_output"
            exit 1
          fi
          echo 'GHCR login succeeded'
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${TARGET_SHA:0:12}"
          docker pull "$image"
          revision="$(docker image inspect --format \
            '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")"
          test "$revision" = "$TARGET_SHA" || {
            echo "candidate label identifies $revision, not $TARGET_SHA"
            exit 1
          }

      - name: Verify the model artifact
        env:
          MODEL_SHA256: a936e0a514385c8ae964c0f42263a4314a34fbc6efea9d9aced5320f320a3d54
          DRAFT_SHA256: 1a01c80eceae302bcc1d70836759ee97974d7983c5084ef43f6ef772a8970ae6
        run: |
          set -euo pipefail
          python3 -c '
          import hashlib, json, os, subprocess, sys, time

          ttl = 7 * 24 * 60 * 60
          cache_path = os.path.join(
              os.path.dirname(os.environ["RUNNER_WORKSPACE"]),
              ".ember-model-integrity-v1.json",
          )
          try:
              with open(cache_path, encoding="utf-8") as stream:
                  cache = json.load(stream)
          except (FileNotFoundError, json.JSONDecodeError, OSError):
              cache = {"version": 1, "records": {}}
          if cache.get("version") != 1 or not isinstance(cache.get("records"), dict):
              cache = {"version": 1, "records": {}}

          now = int(time.time())
          pairs = zip(sys.argv[1::2], sys.argv[2::2])
          for expected, path in pairs:
              stat = os.stat(path)
              identity = {
                  "device": stat.st_dev,
                  "inode": stat.st_ino,
                  "size": stat.st_size,
                  "mtime_ns": stat.st_mtime_ns,
                  "ctime_ns": stat.st_ctime_ns,
              }
              record = cache["records"].get(path, {})
              age = now - int(record.get("verified_at", 0))
              if (
                  record.get("digest") == expected
                  and record.get("identity") == identity
                  and 0 <= age < ttl
              ):
                  print(f"{path}: OK (integrity cache hit, age {age}s)")
                  continue

              # The 96 GiB model pair shares DRAM with gfx1151.  Buffered reads
              # consume the UMA budget even when POSIX_FADV_DONTNEED is issued
              # afterward on XFS.  O_DIRECT keeps a cold integrity check from
              # making the immediately following HIP allocation fail.
              digest = hashlib.sha256()
              process = subprocess.Popen(
                  ["dd", f"if={path}", "iflag=direct", "bs=8M", "status=none"],
                  stdout=subprocess.PIPE,
              )
              assert process.stdout is not None
              while chunk := process.stdout.read(8 * 1024 * 1024):
                  digest.update(chunk)
              if process.wait() != 0:
                  raise SystemExit(f"O_DIRECT read failed for {path}")
              actual = digest.hexdigest()
              if actual != expected:
                  raise SystemExit(f"{path}: expected {expected}, got {actual}")
              cache["records"][path] = {
                  "digest": actual,
                  "identity": identity,
                  "verified_at": now,
              }
              print(f"{path}: OK (O_DIRECT integrity check)")

          temporary = f"{cache_path}.{os.getpid()}.tmp"
          with open(temporary, "w", encoding="utf-8") as stream:
              json.dump(cache, stream, sort_keys=True)
              stream.write("\n")
              stream.flush()
              os.fsync(stream.fileno())
          os.chmod(temporary, 0o600)
          os.replace(temporary, cache_path)
          ' "$MODEL_SHA256" "$MODEL_PATH" "$DRAFT_SHA256" "$DRAFT_PATH"
          available_kib="$(awk '/^MemAvailable:/ { print $2 }' /proc/meminfo)"
          minimum_kib=$((100 * 1024 * 1024))
          printf 'UMA memory available after verification: %d GiB\n' \
            "$((available_kib / 1024 / 1024))"
          (( available_kib >= minimum_kib )) || {
            echo 'less than 100 GiB is available for monolithic model placement'
            exit 1
          }

      - name: Run HIP GEMM and generation differential validators
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${TARGET_SHA:0:12}"
          gpu_args=(
            --device /dev/kfd --device /dev/dri
            --group-add video --group-add render
            --ipc host --security-opt seccomp=unconfined
            --ulimit memlock=-1:-1
          )
          docker run --rm "${gpu_args[@]}" \
            --entrypoint /usr/local/bin/ember-dflash "$image" \
            --validate-gemm-batch 64

          model_dir="$(dirname -- "$MODEL_PATH")"
          model_file="$(basename -- "$MODEL_PATH")"
          prompt_dir="$(dirname -- "$PROMPT_PATH")"
          prompt_file="$(basename -- "$PROMPT_PATH")"
          disk_prompt_dir="$(dirname -- "$DISK_PROMPT_PATH")"
          disk_prompt_file="$(basename -- "$DISK_PROMPT_PATH")"
          mounts=(
            -v "$model_dir:/cert-model:ro"
            -v "$prompt_dir:/cert-prompt:ro"
            -v "$disk_prompt_dir:/cert-disk-prompt:ro"
          )
          draft_dir="$(dirname -- "$DRAFT_PATH")"
          draft_file="$(basename -- "$DRAFT_PATH")"
          mounts+=(-v "$draft_dir:/cert-draft:ro")
          env_args=(
            -e DFLASH_DS4_SPEC=1
            -e "DFLASH_DS4_DRAFT=/cert-draft/$draft_file"
          )
          # Quiescing happens once, at the top of the job, and nothing stops
          # production being started again while certification runs -- the other
          # agent on this box did exactly that through the same wrapper, and the
          # resulting two model loaders degraded the candidate to hybrid expert
          # placement: speculation off, generated tokens changed, throughput at a
          # sixth. That surfaced as an inscrutable spec_ran assertion failure.
          # Check immediately before loading, and name the cause.
          if sudo -n /usr/local/sbin/ember-cert-production is-active >/dev/null 2>&1; then
            echo 'production was restarted during certification; two model loaders'
            echo 'cannot share this GPU and the second falls back to hybrid expert'
            echo 'placement. See docs/ci.md and /root/GPU-LOCK.md.'
            exit 1
          fi
          # docker rm returning does not mean the previous container's 85 GiB
          # mlock'd buffer is back. Loading the next model into that pressure
          # produced a server that ran at 4.78 tok/s and never speculated, which
          # failed the smoke test's spec_ran assertion and looked like a
          # regression in the engine. Wait for the memory instead.
          for _ in $(seq 1 60); do
            available_kib="$(awk '/^MemAvailable:/ { print $2 }' /proc/meminfo)"
            (( available_kib >= 100 * 1024 * 1024 )) && break
            sleep 5
          done
          cache_volume="ember-cert-validator-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker volume create "$cache_volume" >/dev/null
          cleanup_validator() { docker volume rm -f "$cache_volume" >/dev/null 2>&1 || true; }
          trap cleanup_validator EXIT
          spec_report="$(docker run --rm "${gpu_args[@]}" "${mounts[@]}" "${env_args[@]}" \
            -v "$cache_volume:/cache" \
            --entrypoint /usr/local/bin/ember-dflash "$image" \
            -m "/cert-model/$model_file" \
            --kv-cache-dir /cache \
            --ds4-prefill exact \
            --batch-sessions 2 \
            --validate-prompt "/cert-prompt/$prompt_file" \
            --validate-tokens 32)"
          printf '%s\n' "$spec_report"
          python3 -c '
          import json, sys
          report = json.load(sys.stdin)
          assert report["ok"] and report["snapshot_ok"], report
          assert report["batch"]["checked"] and report["batch"]["exact"], report
          assert report["spec"]["checked"] and report["spec"]["exact"], report
          ' <<<"$spec_report"

          disk_report="$(docker run --rm "${gpu_args[@]}" "${mounts[@]}" \
            -v "$cache_volume:/cache" \
            --entrypoint /usr/local/bin/ember-dflash "$image" \
            -m "/cert-model/$model_file" \
            --kv-cache-dir /cache \
            --ds4-prefill exact \
            --validate-prompt "/cert-disk-prompt/$disk_prompt_file" \
            --validate-tokens 16)"
          printf '%s\n' "$disk_report"
          python3 -c '
          import json, sys
          report = json.load(sys.stdin)
          assert report["ok"] and report["snapshot_ok"], report
          assert report["disk"]["checked"] and report["disk"]["exact"], report
          ' <<<"$disk_report"

      - name: Run end-to-end generation smoke test
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${TARGET_SHA:0:12}"
          # Quiescing happens once, at the top of the job, and nothing stops
          # production being started again while certification runs -- the other
          # agent on this box did exactly that through the same wrapper, and the
          # resulting two model loaders degraded the candidate to hybrid expert
          # placement: speculation off, generated tokens changed, throughput at a
          # sixth. That surfaced as an inscrutable spec_ran assertion failure.
          # Check immediately before loading, and name the cause.
          if sudo -n /usr/local/sbin/ember-cert-production is-active >/dev/null 2>&1; then
            echo 'production was restarted during certification; two model loaders'
            echo 'cannot share this GPU and the second falls back to hybrid expert'
            echo 'placement. See docs/ci.md and /root/GPU-LOCK.md.'
            exit 1
          fi
          # docker rm returning does not mean the previous container's 85 GiB
          # mlock'd buffer is back. Loading the next model into that pressure
          # produced a server that ran at 4.78 tok/s and never speculated, which
          # failed the smoke test's spec_ran assertion and looked like a
          # regression in the engine. Wait for the memory instead.
          for _ in $(seq 1 60); do
            available_kib="$(awk '/^MemAvailable:/ { print $2 }' /proc/meminfo)"
            (( available_kib >= 100 * 1024 * 1024 )) && break
            sleep 5
          done
          name="ember-cert-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cache_volume="$name-cache"
          docker volume create "$cache_volume" >/dev/null
          cleanup_server() {
            docker rm -f "$name" >/dev/null 2>&1 || true
            docker volume rm -f "$cache_volume" >/dev/null 2>&1 || true
          }
          trap cleanup_server EXIT
          model_target=/models/DeepSeek-V4-Flash-0731-Abliterated-ROCMFPx-Strix-Lean-2.58bpw.gguf
          draft_target=/models/DeepSeek-V4-Flash-0731-Abliterated-DSpark-draft-4.25bpw.gguf
          mounts=(-v "$MODEL_PATH:$model_target:ro" -v "$cache_volume:/cache")
          env_args=(
            -e "EMBER_PORT=$PORT"
          )
          mounts+=(-v "$DRAFT_PATH:$draft_target:ro")
          docker run -d --name "$name" --network host \
            --device /dev/kfd --device /dev/dri \
            --group-add video --group-add render \
            --ipc host --security-opt seccomp=unconfined \
            --ulimit memlock=-1:-1 \
            "${mounts[@]}" "${env_args[@]}" "$image" \
            --ds4-prefill exact --batch-sessions 1 >/dev/null

          ready=0
          for _ in $(seq 1 240); do
            if curl --fail --silent --max-time 5 \
                "http://127.0.0.1:$PORT/health" >/dev/null; then
              ready=1
              break
            fi
            running="$(docker inspect --format '{{.State.Running}}' "$name")"
            if [[ "$running" != true ]]; then
              docker logs "$name"
              exit 1
            fi
            sleep 5
          done
          [[ "$ready" = 1 ]] || { docker logs "$name"; exit 1; }
          response="$(curl --fail --silent --show-error --max-time 300 \
            -H 'Content-Type: application/json' \
            -d '{"model":"deepseek-v4-flash","messages":[{"role":"user","content":"Reply briefly that Ember is ready."}],"max_tokens":128,"temperature":0,"top_p":1,"top_k":0,"stream":false}' \
            "http://127.0.0.1:$PORT/v1/chat/completions")"
          printf '%s\n' "$response"
          python3 -c '
          import json, sys
          response = json.load(sys.stdin)
          message = response["choices"][0]["message"]
          assert message.get("content") or message.get("reasoning_content"), response
          assert response["usage"]["backend"]["spec_ran"] is True, response
          ' <<<"$response"

      - name: Unblock production
        if: ${{ always() && steps.production.outputs.blocked == 'yes' }}
        run: sudo -n /usr/local/sbin/ember-cert-production unmask

      - name: Restore production
        if: ${{ always() && (steps.production.outputs.restore == 'service' || steps.production.outputs.restore == 'container') }}
        run: |
          case "${{ steps.production.outputs.restore }}" in
            service)
              sudo -n /usr/local/sbin/ember-cert-production start
              ;;
            container)
              docker start "$PRODUCTION_CONTAINER"
              ;;
            *)
              echo 'unknown production restore mode' >&2
              exit 1
              ;;
          esac

      - name: Release the GPU lock
        if: ${{ always() }}
        run: sudo -n /usr/local/sbin/ember-gpu-lock release

      - name: Remove generated validation prompts
        if: ${{ always() }}
        run: |
          for path in "${PROMPT_PATH:-}" "${DISK_PROMPT_PATH:-}"; do
            [[ -z "$path" ]] || rm -f -- "$path"
          done
          if [[ -n "${DOCKER_CONFIG:-}" ]]; then
            rm -f -- "$DOCKER_CONFIG/config.json"
            rmdir -- "$DOCKER_CONFIG" 2>/dev/null || true
          fi

      - name: Record certification result
        run: |
          {
            echo '## gfx1151 certification passed'
            echo
            echo "Certified source SHA: \`$TARGET_SHA\`"
            echo
            echo 'Release promotion will now generate the changelog and tag automatically.'
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Promote certified candidate
    needs: certify
    runs-on: [self-hosted, ember-builder]
    timeout-minutes: 15
    outputs:
      version: ${{ steps.promote.outputs.version }}
    steps:
      - name: Quiet expected exact-SHA checkout advice
        run: |
          if git -C "$GITHUB_WORKSPACE" rev-parse --git-dir >/dev/null 2>&1; then
            git -C "$GITHUB_WORKSPACE" config advice.detachedHead false
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Generate release metadata and publish the source-of-truth tag
        id: promote
        env:
          TARGET_SHA: ${{ inputs.commit_sha }}
          REQUESTED_VERSION: ${{ inputs.release_version }}
          RELEASE_AUTOMATION_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          FORGEJO_RELEASE_SSH_KEY: ${{ secrets.FORGEJO_RELEASE_SSH_KEY }}
          FORGEJO_SSH_HOST_KEYS: ${{ secrets.FORGEJO_SSH_HOST_KEYS }}
          FORGEJO_RELEASE_REMOTE: ${{ vars.FORGEJO_RELEASE_REMOTE }}
        run: |
          set -euo pipefail
          test "$(git rev-parse 'HEAD^{commit}')" = "$TARGET_SHA"
          test "$(git rev-parse 'origin/main^{commit}')" = "$TARGET_SHA" || {
            echo 'main advanced after certification began; certify the new tip instead'
            exit 1
          }
          test -n "$RELEASE_AUTOMATION_TOKEN"
          test -n "$FORGEJO_RELEASE_SSH_KEY"
          test -n "$FORGEJO_SSH_HOST_KEYS"
          test -n "$FORGEJO_RELEASE_REMOTE"

          version="${REQUESTED_VERSION:-$(date -u +%Y.%-m.%-d)}"
          python3 ci/release_changelog.py prepare --version "$version"

          mapfile -t changed < <(git diff --name-only | sort)
          expected=(CHANGELOG.md compose.yaml VERSION)
          test "${changed[*]}" = "${expected[*]}" || {
            printf 'release preparation changed unexpected files: %s\n' "${changed[*]}"
            exit 1
          }

          git config user.name ember-release
          git config user.email release@otheru.ai
          git add CHANGELOG.md VERSION compose.yaml
          git commit -m "chore(release): v$version"
          release_sha="$(git rev-parse HEAD)"
          tag="v$version"
          git tag -a "$tag" -m "Ember $version" \
            -m "Certified-Parent: $TARGET_SHA"

          # The tag publisher treats this repository variable as the
          # authoritative record of which executable tree passed on gfx1151.
          payload="$(CERTIFIED_SHA="$TARGET_SHA" python3 -c \
            'import json, os; print(json.dumps({"name":"EMBER_GFX1151_CERTIFIED_SHA","value":os.environ["CERTIFIED_SHA"]}))')"
          curl --fail --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer $RELEASE_AUTOMATION_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/variables/EMBER_GFX1151_CERTIFIED_SHA"

          ssh_dir="$RUNNER_TEMP/ember-release-ssh-$GITHUB_RUN_ID"
          cleanup() {
            rm -f -- "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
            rmdir -- "$ssh_dir" 2>/dev/null || true
          }
          trap cleanup EXIT
          umask 077
          mkdir "$ssh_dir"
          printf '%s\n' "$FORGEJO_RELEASE_SSH_KEY" >"$ssh_dir/id_ed25519"
          printf '%s\n' "$FORGEJO_SSH_HOST_KEYS" >"$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$ssh_dir/known_hosts"
          test "$(git ls-remote "$FORGEJO_RELEASE_REMOTE" refs/heads/main | cut -f1)" = "$TARGET_SHA"
          test -z "$(git ls-remote "$FORGEJO_RELEASE_REMOTE" "refs/tags/$tag")" || {
            echo "$tag already exists on Forgejo"
            exit 1
          }
          git push --atomic "$FORGEJO_RELEASE_REMOTE" \
            "HEAD:refs/heads/main" "refs/tags/$tag:refs/tags/$tag"

          {
            echo '## Release promoted'
            echo
            echo "Version: \`$version\`"
            echo "Certified source: \`$TARGET_SHA\`"
            echo "Release commit: \`$release_sha\`"
            echo "Tag: \`$tag\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  benchmark:
    name: Benchmark the released image
    # After promotion, deliberately. This measures a release rather than gating
    # one: the tag already exists by the time it starts, so a benchmark that
    # fails or times out cannot cost a release that certification passed.
    #
    # It also keeps the certify job hermetic. Certification runs nothing from
    # the repository -- it validates the published image and only the published
    # image -- and running the harness there would have meant checking out a
    # working tree onto the machine that holds production and the GPU.
    needs: [certify, promote]
    if: ${{ needs.promote.result == 'success' }}
    runs-on: [self-hosted, linux, x64, gfx1151]
    timeout-minutes: 180
    env:
      MODEL_PATH: ${{ vars.EMBER_CERT_MODEL_PATH }}
      DRAFT_PATH: ${{ vars.EMBER_CERT_DRAFT_PATH }}
      RELEASE_VERSION: ${{ needs.promote.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: Take the GPU lock and quiesce production
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/ember-gpu-lock acquire
          if sudo -n /usr/local/sbin/ember-cert-production is-active >/dev/null 2>&1; then
            sudo -n /usr/local/sbin/ember-cert-production stop
            echo 'restore=yes' >>"$GITHUB_OUTPUT"
          fi
          sudo -n /usr/local/sbin/ember-cert-production mask
        id: bench-exclusive

      - name: Run the performance bundle
        env:
          BENCH_TIMEOUT_MIN: '150'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/bench-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out"
          # The promoted tag, so the bundle describes what people can pull.
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_VERSION"
          # Unlike certification this job owns nothing yet, so the script takes
          # the GPU lock and manages production itself, restoring it on exit.
          # Digests are the constants certification already verified.
          export MODEL_DIR TARGET DRAFT PORT TARGET_SHA DRAFT_SHA
          MODEL_DIR="$(dirname "$MODEL_PATH")"
          TARGET="$MODEL_PATH"
          DRAFT="$DRAFT_PATH"
          PORT=18086
          TARGET_SHA=a936e0a514385c8ae964c0f42263a4314a34fbc6efea9d9aced5320f320a3d54
          DRAFT_SHA=1a01c80eceae302bcc1d70836759ee97974d7983c5084ef43f6ef772a8970ae6
          timeout "${BENCH_TIMEOUT_MIN}m" "$GITHUB_WORKSPACE/scripts/benchmark_bundle.sh" \
            --out "$out" --release "$RELEASE_VERSION" \
            --image "$image" --binary /usr/local/bin/ember-dflash \
            --no-repo-mount --no-exclusive
          bundle="$(find "$out" -maxdepth 1 -type d -name 'ember-*' | head -1)"
          test -n "$bundle"
          test -s "$bundle/summary.json"
          echo "BENCH_BUNDLE=$bundle" >>"$GITHUB_ENV"
          python3 "$GITHUB_WORKSPACE/scripts/bench/build_perf_site_data.py" \
            --bundle "$bundle" --certified \
            --out "$bundle/perf-site-data.json"
          python3 - "$bundle/summary.json" "$bundle/perf-site-data.json" \
            >>"$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          s = json.load(open(sys.argv[1]))
          r = json.load(open(sys.argv[2]))['releases'][0]
          print('## Performance bundle\n')
          d = s.get('decode') or {}
          if d:
              print(f"Decode, throughput group: **{d['median_tps']} tok/s** median "
                    f"of {d['samples']} ({d['min_tps']}-{d['max_tps']}).\n")
          w = s.get('by_workload') or {}
          if w:
              lo = min(w.values(), key=lambda v: v['tok_s'])['tok_s']
              hi = max(w.values(), key=lambda v: v['tok_s'])['tok_s']
              print(f"Across {len(w)} workloads decode spans **{lo}-{hi} tok/s**.\n")
              print('| Workload | tok/s | vs AR |')
              print('| --- | ---: | ---: |')
              for k, v in sorted(w.items(), key=lambda kv: -kv[1]['tok_s']):
                  sp = f"{v['speedup']}x" if v.get('speedup') else '-'
                  print(f"| {k} | {v['tok_s']} | {sp} |")
              print()
          n = len(r['depths'])
          print(f"Page data: {len(r['workloads'])} workloads, {n} context depths.\n")
          if not n:
              print('> No context sweep in this bundle, so the depth chart would be '
                    'empty. Check the sweep was not skipped before publishing.\n')
          PY

      - name: Restore production and release the GPU lock
        if: ${{ always() }}
        run: |
          sudo -n /usr/local/sbin/ember-cert-production unmask || true
          if [ "${{ steps.bench-exclusive.outputs.restore }}" = yes ]; then
            sudo -n /usr/local/sbin/ember-cert-production start || true
          fi
          sudo -n /usr/local/sbin/ember-gpu-lock release || true

      - name: Upload the performance bundle
        if: ${{ always() && env.BENCH_BUNDLE != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-bundle-${{ inputs.commit_sha }}
          path: ${{ env.BENCH_BUNDLE }}
          retention-days: 90

  qwen-download:
    # Resumable, content-addressed source acquisition for feature-branch model
    # research.  Downloading does not need exclusive GPU access and therefore
    # deliberately leaves production running.  Conversion and measurement use
    # separate modes that take the host lock and fixed-purpose wrapper.
    if: startsWith(inputs.release_version, 'qwen-download')
    runs-on: [self-hosted, linux, x64, gfx1151]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - name: Fetch and verify the pinned public snapshot
        run: |
          set -euo pipefail
          workspace=/var/tmp/ember-qwen3.8-flash-next
          snapshot="$workspace/snapshots/f5d08274bafd880402bd16f5e3e6c514136ec06c"
          mkdir -p "$workspace"
          available="$(df -B1 --output=avail "$workspace" | tail -1)"
          required=$((400 * 1024 * 1024 * 1024))
          (( available >= required )) || {
            echo "Qwen download requires 400 GiB free; found $available bytes"
            exit 1
          }
          python3 scripts/qwen_snapshot_fetch.py \
            --inventory share/release_profiles/qwen3.8-flash-next-snapshot.json \
            --output "$snapshot" --workers 4
          printf 'snapshot=%s\n' "$snapshot" >>"$GITHUB_STEP_SUMMARY"

  qwen-convert-control:
    # Build the exact, final-ineligible stock ROCMI4 control used for activation
    # capture and the measured format bakeoff.  Tool/image preparation leaves
    # production online.  Only the 125 GiB bounded conversion owns the GPU/UMA
    # host, through the same fixed-purpose lock and service wrapper as release
    # certification.
    if: startsWith(inputs.release_version, 'qwen-convert-control')
    runs-on: [self-hosted, linux, x64, gfx1151]
    timeout-minutes: 720
    env:
      TARGET_SHA: ${{ inputs.commit_sha }}
      QWEN_REVISION: f5d08274bafd880402bd16f5e3e6c514136ec06c
      LLAMA_REVISION: abdc7a0bf815d3b83e26dd523c6960e4dd597e82
      ROCMFPX_REVISION: c49ebdbd5c9f01ec242369f9e7f7967855f80cba
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Pull and bind the exact ROCm 10 development image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          docker_config="$RUNNER_TEMP/qwen-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$docker_config"
          export DOCKER_CONFIG="$docker_config"
          printf 'DOCKER_CONFIG=%s\n' "$docker_config" >>"$GITHUB_ENV"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}:dev-sha-${TARGET_SHA:0:12}"
          docker pull "$image"
          embedded="$(docker run --rm --entrypoint /bin/sh "$image" -c \
            'awk -F= '\''$1 == "EMBER_CONFIGURED_GIT_HEAD:STRING" { print $2 }'\'' /ember/build-rocm/CMakeCache.txt')"
          test "$embedded" = "$TARGET_SHA"
          docker run --rm --entrypoint /bin/sh "$image" -c \
            'test -x /ember/build-rocm/ember-gguf-quantize && /usr/bin/time --version >/dev/null'
          printf 'QWEN_DEV_IMAGE=%s\n' "$image" >>"$GITHUB_ENV"
          docker image inspect "$image" >"$RUNNER_TEMP/qwen-dev-image-$GITHUB_RUN_ID.json"

      - name: Prepare pinned conversion tools while production remains online
        run: |
          set -euo pipefail
          workspace=/var/tmp/ember-qwen3.8-flash-next
          snapshot="$workspace/snapshots/$QWEN_REVISION"
          test -f "$snapshot/model.safetensors.index.json"
          if [[ -e "$snapshot/.ember-fetch.lock" ]] && \
              ! docker run --rm --network none \
                -v "$snapshot:/qwen-snapshot:ro" "$QWEN_DEV_IMAGE" \
                python3 -c 'import fcntl, os; fd=os.open("/qwen-snapshot/.ember-fetch.lock", os.O_RDONLY); fcntl.flock(fd, fcntl.LOCK_EX | fcntl.LOCK_NB)' ; then
            echo 'the resumable source download still owns the snapshot'
            exit 1
          fi
          mkdir -p "$workspace/tooling" "$workspace/evidence"
          ple_patch="$GITHUB_WORKSPACE/patches/llama.cpp/qwen4exp-ple-cgroup-writeback.patch"
          echo "606880dd1e23b4af9f2a6782d26e4db673c9db61ee315fa4e5e4c5c96af758fc  $ple_patch" | sha256sum -c -
          ensure_checkout() {
            local url="$1" revision="$2" destination="$3"
            if [[ ! -d "$destination/.git" ]]; then
              git clone --filter=blob:none "$url" "$destination"
            fi
            git -C "$destination" fetch --filter=blob:none origin "$revision"
            # This is a disposable cached tool checkout. Restore every tracked
            # path from the exact requested revision so an interrupted run or
            # an older version of the audited patch cannot poison a retry.
            git -C "$destination" restore --source="$revision" --staged --worktree -- .
            git -C "$destination" checkout --detach "$revision"
            test "$(git -C "$destination" rev-parse HEAD)" = "$revision"
            test -z "$(git -C "$destination" status --porcelain --untracked-files=no)"
          }
          ensure_checkout https://github.com/ggml-org/llama.cpp.git \
            "$LLAMA_REVISION" "$workspace/tooling/llama.cpp"
          ensure_checkout https://github.com/charlie12345/ROCmFPX.git \
            "$ROCMFPX_REVISION" "$workspace/tooling/ROCmFPX"
          git -c safe.directory="$workspace/tooling/llama.cpp" \
            -C "$workspace/tooling/llama.cpp" apply --check "$ple_patch"
          git -c safe.directory="$workspace/tooling/llama.cpp" \
            -C "$workspace/tooling/llama.cpp" apply "$ple_patch"
          echo "3b226aaafa05cc7f56670e86f408e6708dc65eb95266eb23b71b294963f276ee  $workspace/tooling/llama.cpp/conversion/qwen4exp.py" | sha256sum -c -
          docker run --rm --network host \
            -e LLAMA_REVISION="$LLAMA_REVISION" \
            -v "$workspace:/qwen-work" "$QWEN_DEV_IMAGE" bash -lc '
              set -euo pipefail
              git config --global --add safe.directory /qwen-work/tooling/llama.cpp
              cmake -S /qwen-work/tooling/llama.cpp \
                -B /qwen-work/tooling/llama.cpp/build \
                -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF \
                -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
                -DBUILD_SHARED_LIBS=OFF
              cmake --build /qwen-work/tooling/llama.cpp/build \
                --target llama-gguf-split -j"$(nproc)"
              splitter=/qwen-work/tooling/llama.cpp/build/bin/llama-gguf-split
              version="$($splitter --version 2>&1)"
              commit="$(sed -n "s/.*commit \([0-9a-f]\{7,40\}\).*/\1/p" <<<"$version")"
              test -n "$commit" && [[ "$LLAMA_REVISION" == "$commit"* ]]
              test -d /qwen-work/tooling/converter-venv || \
                python3 -m venv /qwen-work/tooling/converter-venv
              /qwen-work/tooling/converter-venv/bin/pip install --no-cache-dir \
                -r /qwen-work/tooling/llama.cpp/requirements/requirements-convert_hf_to_gguf.txt
              /qwen-work/tooling/converter-venv/bin/python -m pip freeze \
                > /qwen-work/evidence/converter-requirements.freeze.txt
            '

      - name: Take exclusive UMA ownership and quiesce production
        id: qwen-control-exclusive
        run: |
          set -euo pipefail
          echo 'lock=no' >>"$GITHUB_OUTPUT"
          echo 'restore=no' >>"$GITHUB_OUTPUT"
          echo 'masked=no' >>"$GITHUB_OUTPUT"
          sudo -n /usr/local/sbin/ember-gpu-lock acquire
          echo 'lock=yes' >>"$GITHUB_OUTPUT"
          if sudo -n /usr/local/sbin/ember-cert-production is-active >/dev/null 2>&1; then
            echo 'restore=yes' >>"$GITHUB_OUTPUT"
            sudo -n /usr/local/sbin/ember-cert-production stop
          fi
          sudo -n /usr/local/sbin/ember-cert-production mask
          echo 'masked=yes' >>"$GITHUB_OUTPUT"

      - name: Convert, split, and quantize the stock control within 125 GiB
        id: qwen-control-build
        run: |
          set -euo pipefail
          workspace=/var/tmp/ember-qwen3.8-flash-next
          snapshot="$workspace/snapshots/$QWEN_REVISION"
          output="$workspace/artifacts/stock-rocmi4-${TARGET_SHA:0:12}"
          test ! -e "$output"
          python3 - "$workspace/artifacts" ".stock-rocmi4-${TARGET_SHA:0:12}.transaction-" \
            "$workspace/evidence/control-${TARGET_SHA:0:12}.stale-transactions.json" <<'PY'
          import json, os, pathlib, shutil, stat, sys
          root = pathlib.Path(sys.argv[1]).resolve(strict=True)
          prefix = sys.argv[2]
          evidence = pathlib.Path(sys.argv[3])
          removed = []
          for child in root.iterdir():
              if not child.name.startswith(prefix):
                  continue
              info = child.lstat()
              if stat.S_ISLNK(info.st_mode) or not stat.S_ISDIR(info.st_mode):
                  raise SystemExit(f"refusing unsafe stale transaction entry: {child}")
              if child.parent.resolve(strict=True) != root:
                  raise SystemExit(f"stale transaction escaped artifact root: {child}")
              removed.append(child.name)
              shutil.rmtree(child)
          payload = {"artifact_root": str(root), "prefix": prefix,
                     "removed": sorted(removed)}
          temp = evidence.with_suffix(evidence.suffix + ".tmp")
          temp.write_text(json.dumps(payload, sort_keys=True) + "\n", encoding="utf-8")
          os.replace(temp, evidence)
          PY
          name="qwen-control-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "name=$name" >>"$GITHUB_OUTPUT"
          docker run --name "$name" --network none --ipc host \
            --memory 125g --memory-swap 125g \
            --ulimit memlock=-1:-1 \
            -v "$workspace:/qwen-work" "$QWEN_DEV_IMAGE" bash -lc "
              set -euo pipefail
              # The bind-mounted checkouts are owned by the host runner uid,
              # while the ROCm development image runs this bounded conversion
              # as root. Pin only the three audited repositories as safe; a
              # broad '*' exception would disable Git's ownership boundary.
              git config --global --add safe.directory /ember
              git config --global --add safe.directory /qwen-work/tooling/llama.cpp
              git config --global --add safe.directory /qwen-work/tooling/ROCmFPX
              /usr/bin/time -v \
                -o /qwen-work/evidence/control-${TARGET_SHA:0:12}.time.txt \
                /qwen-work/tooling/converter-venv/bin/python \
                /ember/scripts/qwen_quantize.py \
                  --snapshot-dir /qwen-work/snapshots/$QWEN_REVISION \
                  --snapshot-revision $QWEN_REVISION \
                  --stock-control \
                  --llama-cpp-dir /qwen-work/tooling/llama.cpp \
                  --gguf-splitter /qwen-work/tooling/llama.cpp/build/bin/llama-gguf-split \
                  --bounded-memory-temp \
                  --conversion-memory-limit-bytes 134217728000 \
                  --rocmfpx-dir /qwen-work/tooling/ROCmFPX \
                  --ember-dir /ember --ember-revision $TARGET_SHA \
                  --quantizer /ember/build-rocm/ember-gguf-quantize \
                  --work-dir /qwen-work/artifacts/stock-rocmi4-${TARGET_SHA:0:12} \
                  --execute
              mkdir -p /qwen-work/artifacts/mtp-rocmi4-${TARGET_SHA:0:12}
              /qwen-work/tooling/converter-venv/bin/python \
                /ember/scripts/qwen_mtp_export.py \
                  --source-dir /qwen-work/snapshots/$QWEN_REVISION \
                  --format gguf --matrix-quant Q4_0_ROCMI4 \
                  --output /qwen-work/artifacts/mtp-rocmi4-${TARGET_SHA:0:12}/Qwen3.8-Flash-Next-MTP-BF16.gguf \
                  --quantizer /ember/build-rocm/ember-gguf-quantize \
                  --quantized-output /qwen-work/artifacts/mtp-rocmi4-${TARGET_SHA:0:12}/Qwen3.8-Flash-Next-MTP-ROCmI4-Strix-Halo.gguf \
                  --manifest-out /qwen-work/artifacts/mtp-rocmi4-${TARGET_SHA:0:12}/export.json
            " 2>&1 | tee "$workspace/evidence/control-${TARGET_SHA:0:12}.log"
          docker rm "$name" >/dev/null
          test -s "$output/qwen-quant-build-record.json"
          python3 - "$output/qwen-quant-build-record.json" <<'PY'
          import json, sys
          record = json.load(open(sys.argv[1], encoding="utf-8"))
          assert record["status"] == "complete", record
          assert record["experiment"]["kind"] == "stock_control", record
          assert record["experiment"]["final_release_eligible"] is False, record
          measurement = record["conversion_memory"]["measurement"]
          assert measurement["status"] == "measured_target_cgroup_v2", measurement
          assert measurement["memory_limit_bytes"] == 134217728000, measurement
          assert measurement["swap_limit_bytes"] == 0, measurement
          assert measurement["cgroup_peak_after_conversion_bytes"] <= 134217728000, measurement
          assert measurement["converter_child_maximum_resident_set_kib"] <= 131072000, measurement
          assert all("Stock-Control" in row["path"] and "Heretic" not in row["path"]
                     for row in record["output"]["shards"]), record
          print(json.dumps({"artifact_bytes": sum(row["size_bytes"] for row in record["output"]["shards"]),
                            "shards": len(record["output"]["shards"])}, sort_keys=True))
          PY
          python3 - "$output/qwen-quant-build-record.json" \
            "$workspace/evidence/control-${TARGET_SHA:0:12}.time.txt" \
            "$workspace/evidence/control-${TARGET_SHA:0:12}.measurement-attestation.json" <<'PY'
          import hashlib, json, pathlib, re, sys
          record_path, time_path, output_path = map(pathlib.Path, sys.argv[1:])
          time_text = time_path.read_text(encoding="utf-8")
          match = re.search(r"Maximum resident set size \(kbytes\): ([0-9]+)", time_text)
          if match is None:
              raise SystemExit("/usr/bin/time evidence lacks maximum RSS")
          outer_rss_kib = int(match.group(1))
          if outer_rss_kib > 131072000:
              raise SystemExit("successful conversion exceeded the 125 GiB RSS gate")
          digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          record = json.loads(record_path.read_text(encoding="utf-8"))
          payload = {
              "schema": "ember.qwen-conversion-memory-attestation.v1",
              "build_record_sha256": digest(record_path),
              "time_evidence_sha256": digest(time_path),
              "outer_maximum_resident_set_kib": outer_rss_kib,
              "recorded_cgroup_peak_bytes": record["conversion_memory"]["measurement"][
                  "cgroup_peak_after_conversion_bytes"],
              "memory_limit_bytes": 134217728000,
              "passed": True,
          }
          output_path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n",
                                 encoding="utf-8")
          PY
          mtp_dir="$workspace/artifacts/mtp-rocmi4-${TARGET_SHA:0:12}"
          mtp_artifact="$mtp_dir/Qwen3.8-Flash-Next-MTP-ROCmI4-Strix-Halo.gguf"
          python3 - "$mtp_dir/export.json" "$mtp_artifact" <<'PY'
          import json, os, sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          assert manifest["source_revision"] == "f5d08274bafd880402bd16f5e3e6c514136ec06c", manifest
          assert manifest["matrix_quant_contract"] == "Q4_0_ROCMI4", manifest
          assert manifest["runtime_status"] == "loadable quantized companion", manifest
          path = sys.argv[2]
          assert manifest["quantized_output"].endswith("/" + os.path.basename(path)), manifest
          assert os.path.isfile(path) and os.path.getsize(path) == manifest["quantized_bytes"], manifest
          print(json.dumps({"mtp_bytes": manifest["quantized_bytes"],
                            "mtp_sha256": manifest["quantized_sha256"]}, sort_keys=True))
          PY
          printf 'QWEN_CONTROL_OUTPUT=%s\n' "$output" >>"$GITHUB_ENV"
          printf 'QWEN_MTP_OUTPUT=%s\n' \
            "$mtp_artifact" >>"$GITHUB_ENV"

      - name: Remove a failed conversion container
        if: ${{ always() && steps.qwen-control-build.outputs.name != '' }}
        run: docker rm -f "${{ steps.qwen-control-build.outputs.name }}" >/dev/null 2>&1 || true

      - name: Unblock production
        if: ${{ always() && steps.qwen-control-exclusive.outputs.masked == 'yes' }}
        run: sudo -n /usr/local/sbin/ember-cert-production unmask

      - name: Restore production
        if: ${{ always() && steps.qwen-control-exclusive.outputs.restore == 'yes' }}
        run: sudo -n /usr/local/sbin/ember-cert-production start

      - name: Release the GPU lock
        if: ${{ always() && steps.qwen-control-exclusive.outputs.lock == 'yes' }}
        run: sudo -n /usr/local/sbin/ember-gpu-lock release

      - name: Remove temporary registry credentials
        if: ${{ always() && env.DOCKER_CONFIG != '' }}
        run: |
          rm -f -- "$DOCKER_CONFIG/config.json"
          rmdir -- "$DOCKER_CONFIG" 2>/dev/null || true

      - name: Record the bounded stock-control result
        if: ${{ success() }}
        run: |
          {
            echo '## Qwen stock-control conversion passed'
            echo
            echo "Ember SHA: \`$TARGET_SHA\`"
            echo "Output: \`$QWEN_CONTROL_OUTPUT\`"
            echo "Matching MTP: \`$QWEN_MTP_OUTPUT\`"
            echo
            echo 'This artifact is final-ineligible and exists only for activation capture and bakeoff.'
          } >>"$GITHUB_STEP_SUMMARY"

  qwen-capture-control:
    # Capture the 48x2560 stock-runtime activation directions from the pinned
    # OtherU 32+32 extraction corpus.  This consumes the persistent, exact-SHA
    # control pair built above and emits evidence plus the fixed 4x4 manifest
    # grid only: it does not quantize, select a winner, upload, or publish.
    if: startsWith(inputs.release_version, 'qwen-capture-control')
    runs-on: [self-hosted, linux, x64, gfx1151]
    timeout-minutes: 360
    env:
      TARGET_SHA: ${{ inputs.commit_sha }}
      QWEN_REVISION: f5d08274bafd880402bd16f5e3e6c514136ec06c
      OTHERU_REVISION: a3c6a728510f91394e991504951ac316cd3a89af
      CORPUS_CONTRACT_SHA256: 19c70ad1ce7664b58fbaa854f7a80bc50868873a89e44459002b634137d5cc1d
      GOOD_CORPUS_SHA256: a41997529ad28af7234e036f05bd9bca39c504f8ec118568b73699e9b314d140
      BAD_CORPUS_SHA256: a3bededd14b030fdf06562f6739f879838902f6f4691817573a98bbe9ac6cf7c
      CAPTURE_RECIPE_SHA256: d0c15c650e1e18ff06069a7db3db843fc7b91b9ea7c730e5794f45a3f529567e
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Pull and bind the exact ROCm 10 development image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          docker_config="$RUNNER_TEMP/qwen-capture-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$docker_config"
          export DOCKER_CONFIG="$docker_config"
          printf 'DOCKER_CONFIG=%s\n' "$docker_config" >>"$GITHUB_ENV"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}:dev-sha-${TARGET_SHA:0:12}"
          docker pull "$image"
          inspect="$RUNNER_TEMP/qwen-capture-image-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          docker image inspect "$image" >"$inspect"
          embedded="$(docker run --rm --entrypoint /bin/sh "$image" -c \
            'awk -F= '\''$1 == "EMBER_CONFIGURED_GIT_HEAD:STRING" { print $2 }'\'' /ember/build-rocm/CMakeCache.txt')"
          test "$embedded" = "$TARGET_SHA"
          docker run --rm --entrypoint /bin/sh "$image" -c \
            'test -x /usr/local/bin/ember-dflash && test -f /ember/scripts/qwen_capture_control.py'
          python3 - "$inspect" "$image" "$TARGET_SHA" "$GITHUB_ENV" <<'PY'
          import json, re, sys
          inspect_path, image, revision, env_path = sys.argv[1:]
          rows = json.load(open(inspect_path, encoding="utf-8"))
          assert isinstance(rows, list) and len(rows) == 1, rows
          repository = image.rsplit(":", 1)[0]
          digests = sorted({item.split("@", 1)[1]
                            for item in rows[0].get("RepoDigests") or []
                            if item.startswith(repository + "@")})
          assert len(digests) == 1 and re.fullmatch(r"sha256:[0-9a-f]{64}", digests[0]), digests
          label = ((rows[0].get("Config") or {}).get("Labels") or {}).get(
              "org.opencontainers.image.revision")
          assert label in (None, "", revision), label
          with open(env_path, "a", encoding="utf-8") as stream:
              stream.write(f"QWEN_DEV_IMAGE={image}\n")
              stream.write(f"QWEN_DEV_IMAGE_DIGEST={digests[0]}\n")
          PY

      - name: Bind the persistent stock control and pinned corpus
        run: |
          set -euo pipefail
          workspace=/var/tmp/ember-qwen3.8-flash-next
          control_dir="$workspace/artifacts/stock-rocmi4-${TARGET_SHA:0:12}"
          mtp_dir="$workspace/artifacts/mtp-rocmi4-${TARGET_SHA:0:12}"
          corpus_dir="/srv/ember/qwen3.8-otheru-corpus-${OTHERU_REVISION:0:8}"
          control_record="$control_dir/qwen-quant-build-record.json"
          mtp_manifest="$mtp_dir/export.json"
          contract="$GITHUB_WORKSPACE/share/quant_eval/qwen3.8-otheru-corpus-contract.json"
          recipe="$GITHUB_WORKSPACE/share/quant_eval/qwen3.8-flash-next-bakeoff.json"
          for directory in "$workspace" "$control_dir" "$mtp_dir" "$corpus_dir"; do
            test -d "$directory" && test ! -L "$directory"
          done
          for file in "$control_record" "$mtp_manifest" "$contract" "$recipe" \
              "$corpus_dir/extraction-good.jsonl" "$corpus_dir/extraction-bad.jsonl"; do
            test -f "$file" && test ! -L "$file"
          done
          test "$(sha256sum "$contract" | awk '{print $1}')" = "$CORPUS_CONTRACT_SHA256"
          test "$(sha256sum "$recipe" | awk '{print $1}')" = "$CAPTURE_RECIPE_SHA256"
          test "$(sha256sum "$corpus_dir/extraction-good.jsonl" | awk '{print $1}')" = "$GOOD_CORPUS_SHA256"
          test "$(sha256sum "$corpus_dir/extraction-bad.jsonl" | awk '{print $1}')" = "$BAD_CORPUS_SHA256"
          artifact_env="$RUNNER_TEMP/qwen-capture-artifacts-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.env"
          python3 - "$control_record" "$control_dir" "$mtp_manifest" "$mtp_dir" \
              "$TARGET_SHA" "$artifact_env" <<'PY'
          import hashlib, json, os, pathlib, re, sys
          record_path = pathlib.Path(sys.argv[1])
          control_dir = pathlib.Path(sys.argv[2])
          mtp_manifest_path = pathlib.Path(sys.argv[3])
          mtp_dir = pathlib.Path(sys.argv[4])
          revision, env_path = sys.argv[5:]
          record = json.loads(record_path.read_text(encoding="utf-8"))
          experiment = record.get("experiment") or {}
          build = ((record.get("tools") or {}).get("quantizer_build_info") or {})
          assert record.get("status") == "complete" and record.get("mode") == "execute", record
          assert experiment.get("kind") == "stock_control", experiment
          assert experiment.get("stock_weights_unchanged") is True, experiment
          assert experiment.get("final_release_eligible") is False, experiment
          assert build.get("format") == "Q4_0_ROCMI4" and build.get("ggml_tensor_type") == 108, build
          assert build.get("ember_revision") == revision, build
          rows = (record.get("output") or {}).get("shards")
          assert isinstance(rows, list) and rows, rows
          names = []
          recorded_parent = None
          for index, row in enumerate(rows):
              recorded = pathlib.PurePosixPath(row.get("path", ""))
              assert recorded.is_absolute() and recorded.name == os.path.basename(str(recorded)), row
              assert re.fullmatch(r"[A-Za-z0-9._-]+", recorded.name), row
              assert isinstance(row.get("size_bytes"), int) and row["size_bytes"] > 0, row
              assert re.fullmatch(r"[0-9a-f]{64}", row.get("sha256", "")), row
              assert recorded.parent == recorded_parent or recorded_parent is None, row
              recorded_parent = recorded.parent
              local = control_dir / recorded.name
              assert local.is_file() and not local.is_symlink(), local
              assert local.stat().st_size == row["size_bytes"], (local, row)
              assert recorded.name not in names, row
              names.append(recorded.name)
          first = control_dir / names[0]
          mtp = json.loads(mtp_manifest_path.read_text(encoding="utf-8"))
          assert mtp.get("source_revision") == "f5d08274bafd880402bd16f5e3e6c514136ec06c", mtp
          assert mtp.get("matrix_quant_contract") == "Q4_0_ROCMI4", mtp
          assert mtp.get("runtime_status") == "loadable quantized companion", mtp
          mtp_name = pathlib.PurePosixPath(mtp.get("quantized_output", "")).name
          assert mtp_name == "Qwen3.8-Flash-Next-MTP-ROCmI4-Strix-Halo.gguf", mtp
          mtp_path = mtp_dir / mtp_name
          assert mtp_path.is_file() and not mtp_path.is_symlink(), mtp_path
          assert mtp_path.stat().st_size == mtp.get("quantized_bytes"), mtp
          assert re.fullmatch(r"[0-9a-f]{64}", mtp.get("quantized_sha256", "")), mtp
          record_sha = hashlib.sha256(record_path.read_bytes()).hexdigest()
          with open(env_path, "a", encoding="utf-8") as stream:
              stream.write(f"QWEN_CONTROL_MODEL={first}\n")
              stream.write(f"QWEN_CONTROL_MODEL_EXPECTED_SHA256={rows[0]['sha256']}\n")
              stream.write(f"QWEN_CONTROL_RECORD={record_path}\n")
              stream.write(f"QWEN_CONTROL_RECORD_SHA256={record_sha}\n")
              stream.write(f"QWEN_MTP_MODEL={mtp_path}\n")
              stream.write(f"QWEN_MTP_EXPECTED_SHA256={mtp['quantized_sha256']}\n")
          PY
          source "$artifact_env"
          cat "$artifact_env" >>"$GITHUB_ENV"
          direct_sha256() {
            dd if="$1" iflag=direct bs=8M status=none | sha256sum | awk '{print $1}'
          }
          model_sha="$(direct_sha256 "$QWEN_CONTROL_MODEL")"
          mtp_sha="$(direct_sha256 "$QWEN_MTP_MODEL")"
          test "$model_sha" = "$QWEN_CONTROL_MODEL_EXPECTED_SHA256"
          test "$mtp_sha" = "$QWEN_MTP_EXPECTED_SHA256"
          output="$workspace/evidence/qwen-capture-control-${TARGET_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$output" && test ! -L "$output"
          printf 'QWEN_CONTROL_MODEL_SHA256=%s\n' "$model_sha" >>"$GITHUB_ENV"
          printf 'QWEN_MTP_SHA256=%s\n' "$mtp_sha" >>"$GITHUB_ENV"
          printf 'QWEN_CAPTURE_OUTPUT=%s\n' "$output" >>"$GITHUB_ENV"
          printf 'QWEN_CORPUS_DIR=%s\n' "$corpus_dir" >>"$GITHUB_ENV"

      - name: Record production recovery intent
        id: qwen-capture-safety
        run: |
          set -euo pipefail
          echo 'restore=no' >>"$GITHUB_OUTPUT"
          if sudo -n /usr/local/sbin/ember-cert-production is-active >/dev/null 2>&1; then
            echo 'restore=yes' >>"$GITHUB_OUTPUT"
          fi
          echo 'armed=yes' >>"$GITHUB_OUTPUT"

      - name: Capture stock activations and deterministic intervention manifests
        run: |
          set -euo pipefail
          python3 scripts/qwen_capture_control.py \
            --image "$QWEN_DEV_IMAGE" \
            --image-digest "$QWEN_DEV_IMAGE_DIGEST" \
            --binary /usr/local/bin/ember-dflash \
            --model "$QWEN_CONTROL_MODEL" \
            --model-sha256 "$QWEN_CONTROL_MODEL_SHA256" \
            --control-record "$QWEN_CONTROL_RECORD" \
            --control-record-sha256 "$QWEN_CONTROL_RECORD_SHA256" \
            --mtp "$QWEN_MTP_MODEL" \
            --mtp-sha256 "$QWEN_MTP_SHA256" \
            --corpus-dir "$QWEN_CORPUS_DIR" \
            --corpus-contract-sha256 "$CORPUS_CONTRACT_SHA256" \
            --good-corpus-sha256 "$GOOD_CORPUS_SHA256" \
            --bad-corpus-sha256 "$BAD_CORPUS_SHA256" \
            --recipe-sha256 "$CAPTURE_RECIPE_SHA256" \
            --output-dir "$QWEN_CAPTURE_OUTPUT"
          python3 - "$QWEN_CAPTURE_OUTPUT/capture-manifest.json" "$TARGET_SHA" \
              "$QWEN_DEV_IMAGE_DIGEST" <<'PY'
          import json, sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          assert manifest["status"] == "complete", manifest
          assert manifest["publishes"] is False and manifest["stock_rocmi4_only"] is True, manifest
          assert manifest["image"]["ember_revision"] == sys.argv[2], manifest
          assert manifest["image"]["digest"] == sys.argv[3], manifest
          assert manifest["mtp"]["verified"] is True, manifest
          assert manifest["mtp"]["loaded_during_capture"] is False, manifest
          assert manifest["corpus"]["rows"] == {"good": 32, "bad": 32}, manifest
          assert len(manifest["interventions"]) == 16, manifest
          PY

      - name: Recover production and release the GPU lock
        if: ${{ always() && steps.qwen-capture-safety.outputs.armed == 'yes' }}
        run: |
          state="$QWEN_CAPTURE_OUTPUT"
          if [[ -e "$state/.gpu-lock-held" || -e "$state/.production-masked" ]]; then
            while IFS= read -r container; do
              name="$(docker inspect --format '{{.Name}}' "$container" 2>/dev/null || true)"
              if [[ "$name" =~ ^/qwen-capture-control-[0-9]+$ ]]; then
                docker rm -f "$container" >/dev/null 2>&1 || true
              fi
            done < <(docker ps -aq --filter name=qwen-capture-control- 2>/dev/null || true)
          fi
          if [[ -e "$state/.production-masked" ]]; then
            sudo -n /usr/local/sbin/ember-cert-production unmask || true
          fi
          if [[ -e "$state/.production-was-active" ]]; then
            sudo -n /usr/local/sbin/ember-cert-production start || true
          fi
          if [[ -e "$state/.gpu-lock-held" ]]; then
            sudo -n /usr/local/sbin/ember-gpu-lock release || true
          fi

      - name: Remove temporary registry credentials
        if: ${{ always() && env.DOCKER_CONFIG != '' }}
        run: |
          rm -f -- "$DOCKER_CONFIG/config.json"
          rmdir -- "$DOCKER_CONFIG" 2>/dev/null || true

      - name: Record the stock activation-capture result
        if: ${{ success() }}
        run: |
          {
            echo '## Qwen stock activation capture passed'
            echo
            echo "Ember SHA: \`$TARGET_SHA\`"
            echo "Image digest: \`$QWEN_DEV_IMAGE_DIGEST\`"
            echo "Evidence: \`$QWEN_CAPTURE_OUTPUT\`"
            echo
            echo 'Generated 16 unselected intervention manifests. No artifact was quantized or published.'
          } >>"$GITHUB_STEP_SUMMARY"
