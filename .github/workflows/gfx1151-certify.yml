name: gfx1151 certification

on:
  workflow_call:
    inputs:
      commit_sha:
        description: Full 40-character candidate SHA to certify and promote
        required: true
        type: string
      release_version:
        description: Optional YEAR.M.D override; defaults to the current UTC date
        required: false
        type: string
      qwen_dispatch_envelope_base64:
        description: Strict base64 Qwen branch-workflow dispatch envelope
        required: false
        type: string
      qwen_dispatch_envelope_sha256:
        description: SHA-256 of the decoded Qwen dispatch envelope
        required: false
        type: string
    secrets:
      RELEASE_AUTOMATION_TOKEN:
        required: true
      FORGEJO_RELEASE_SSH_KEY:
        required: true
      FORGEJO_SSH_HOST_KEYS:
        required: true
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA whose sha-* image will be certified
        required: true
        type: string
      release_version:
        description: Optional YEAR.M.D override; defaults to the current UTC date
        required: false
        type: string
      qwen_dispatch_envelope_base64:
        description: Strict base64 Qwen branch-workflow dispatch envelope
        required: false
        type: string
      qwen_dispatch_envelope_sha256:
        description: SHA-256 of the decoded Qwen dispatch envelope
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: gfx1151-certification
  cancel-in-progress: false

jobs:
  qwen-dispatch-envelope:
    # This workflow exists on the default branch, so it is the stable manual
    # dispatch entrypoint. Local reusable-workflow references resolve from the
    # same commit as this caller, allowing exact feature-revision logic without
    # weakening commit or artifact identity checks. GitHub's normative rule:
    # https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows#calling-a-reusable-workflow
    if: inputs.release_version == 'qwen-dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      operation: ${{ steps.envelope.outputs.operation }}
      mode: ${{ steps.envelope.outputs.mode }}
      request_payload_base64: ${{ steps.envelope.outputs.request_payload_base64 }}
      request_payload_sha256: ${{ steps.envelope.outputs.request_payload_sha256 }}
      output: ${{ steps.envelope.outputs.output }}
      operation_request: ${{ steps.envelope.outputs.operation_request }}
      operation_request_sha256: ${{ steps.envelope.outputs.operation_request_sha256 }}
      builder_image: ${{ steps.envelope.outputs.builder_image }}
      builder_image_digest: ${{ steps.envelope.outputs.builder_image_digest }}
      workset_root: ${{ steps.envelope.outputs.workset_root }}
      stock_artifact_revision: ${{ steps.envelope.outputs.stock_artifact_revision }}
      stock_build_record_sha256: ${{ steps.envelope.outputs.stock_build_record_sha256 }}
      capture_manifest: ${{ steps.envelope.outputs.capture_manifest }}
      capture_manifest_sha256: ${{ steps.envelope.outputs.capture_manifest_sha256 }}
      authorization_output: ${{ steps.envelope.outputs.authorization_output }}
      authorize: ${{ steps.envelope.outputs.authorize }}
      runtime_image: ${{ steps.envelope.outputs.runtime_image }}
      runtime_dev_image: ${{ steps.envelope.outputs.runtime_dev_image }}
      model: ${{ steps.envelope.outputs.model }}
      model_sha256: ${{ steps.envelope.outputs.model_sha256 }}
      model_build_record: ${{ steps.envelope.outputs.model_build_record }}
      model_build_record_sha256: ${{ steps.envelope.outputs.model_build_record_sha256 }}
      mtp: ${{ steps.envelope.outputs.mtp }}
      mtp_sha256: ${{ steps.envelope.outputs.mtp_sha256 }}
      mtp_depth: ${{ steps.envelope.outputs.mtp_depth }}
      mmproj: ${{ steps.envelope.outputs.mmproj }}
      mmproj_sha256: ${{ steps.envelope.outputs.mmproj_sha256 }}
      vision_vocab: ${{ steps.envelope.outputs.vision_vocab }}
      vision_vocab_sha256: ${{ steps.envelope.outputs.vision_vocab_sha256 }}
      vision_output: ${{ steps.envelope.outputs.vision_output }}
      phase_descriptor: ${{ steps.envelope.outputs.phase_descriptor }}
      phase_descriptor_sha256: ${{ steps.envelope.outputs.phase_descriptor_sha256 }}
      candidate_manifest: ${{ steps.envelope.outputs.candidate_manifest }}
      candidate_manifest_sha256: ${{ steps.envelope.outputs.candidate_manifest_sha256 }}
      phase: ${{ steps.envelope.outputs.phase }}
      phase_request: ${{ steps.envelope.outputs.phase_request }}
      phase_request_sha256: ${{ steps.envelope.outputs.phase_request_sha256 }}
      quality_request_payload_base64: ${{ steps.envelope.outputs.quality_request_payload_base64 }}
      quality_request_payload_sha256: ${{ steps.envelope.outputs.quality_request_payload_sha256 }}
      quality_request_output: ${{ steps.envelope.outputs.quality_request_output }}
      candidate_intent_payload_base64: ${{ steps.envelope.outputs.candidate_intent_payload_base64 }}
      candidate_intent_payload_sha256: ${{ steps.envelope.outputs.candidate_intent_payload_sha256 }}
      candidate_intent_output: ${{ steps.envelope.outputs.candidate_intent_output }}
    steps:
      - name: Decode and validate exact branch-workflow dispatch envelope
        id: envelope
        env:
          TARGET_SHA: ${{ inputs.commit_sha }}
          CALLER_SHA: ${{ github.sha }}
          ENVELOPE_BASE64: ${{ inputs.qwen_dispatch_envelope_base64 }}
          ENVELOPE_SHA256: ${{ inputs.qwen_dispatch_envelope_sha256 }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$CALLER_SHA" = "$TARGET_SHA"
          [[ "$ENVELOPE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          python3 - "$TARGET_SHA" "$ENVELOPE_BASE64" "$ENVELOPE_SHA256" \
              "$GITHUB_OUTPUT" <<'PY'
          import base64, binascii, hashlib, json, os, re, sys

          revision, encoded, expected_sha, output_path = sys.argv[1:]

          def fail(message):
              raise SystemExit(message)

          try:
              payload = base64.b64decode(encoded, validate=True)
          except (binascii.Error, ValueError) as exc:
              fail(f"dispatch envelope is not strict base64: {exc}")
          # The manual-dispatch input payload is capped at 65,535 characters.
          # Keep ample room for base64 expansion plus the other three inputs.
          if not payload or len(payload) > 32768:
              fail("decoded dispatch envelope must contain 1..32768 bytes")
          if hashlib.sha256(payload).hexdigest() != expected_sha:
              fail("decoded dispatch envelope digest differs")
          try:
              value = json.loads(payload)
          except (UnicodeDecodeError, json.JSONDecodeError) as exc:
              fail(f"dispatch envelope is not UTF-8 JSON: {exc}")
          if (not isinstance(value, dict)
                  or set(value) != {"schema", "ember_revision", "operation", "inputs",
                                    "publishes", "deletes"}
                  or value.get("schema") != "ember.qwen3.8.branch-dispatch-envelope.v1"
                  or value.get("ember_revision") != revision
                  or value.get("publishes") is not False
                  or not isinstance(value.get("inputs"), dict)):
              fail("dispatch envelope schema/revision/lifecycle differs")
          operation = value.get("operation")
          inputs = value["inputs"]
          expected = {
              "request": {"mode", "request_payload_base64", "request_payload_sha256", "output"},
              "construct": {"mode", "operation_request", "operation_request_sha256"},
              "retire": {"builder_image", "builder_image_digest", "workset_root",
                         "stock_artifact_revision", "stock_build_record_sha256",
                         "capture_manifest", "capture_manifest_sha256",
                         "authorization_output", "authorize"},
              "vision": {"runtime_image", "runtime_dev_image", "model", "model_sha256",
                         "model_build_record", "model_build_record_sha256", "mtp",
                         "mtp_sha256", "mtp_depth", "mmproj", "mmproj_sha256",
                         "vision_vocab", "vision_vocab_sha256", "output"},
              "quality": {"phase_descriptor", "phase_descriptor_sha256"},
              "quality-plan": {"request_payload_base64", "request_payload_sha256",
                               "request_output"},
              "candidate-plan": {"intent_payload_base64", "intent_payload_sha256",
                                 "intent_output"},
              "bakeoff": {"candidate_manifest", "candidate_manifest_sha256", "phase",
                           "phase_request", "phase_request_sha256"},
          }
          if operation not in expected or set(inputs) != expected[operation]:
              fail("dispatch operation or input keys differ")
          destructive = operation in {"retire", "bakeoff"}
          if value.get("deletes") is not destructive:
              fail("dispatch deletion lifecycle differs")

          def scalar(name):
              item = inputs.get(name)
              if not isinstance(item, str) or not item or "\n" in item or "\0" in item:
                  fail(f"{name} is malformed")
              return item

          def digest(name, *, oci=False):
              item = scalar(name)
              pattern = r"sha256:[0-9a-f]{64}" if oci else r"[0-9a-f]{64}"
              if re.fullmatch(pattern, item) is None:
                  fail(f"{name} digest is malformed")
              return item

          def absolute(name):
              item = scalar(name)
              if not item.startswith("/") or os.path.normpath(item) != item:
                  fail(f"{name} is not one normalized absolute path")
              return item

          result = {name: "" for names in expected.values() for name in names}
          if operation == "request":
              mode = scalar("mode")
              if mode not in ("prepare-cache", "prepare-companions", "build-candidate",
                              "normalize-candidate"):
                  fail("request mode differs")
              nested = scalar("request_payload_base64")
              nested_sha = digest("request_payload_sha256")
              try:
                  nested_payload = base64.b64decode(nested, validate=True)
              except (binascii.Error, ValueError) as exc:
                  fail(f"construction request is not strict base64: {exc}")
              if (not nested_payload or len(nested_payload) > 16384
                      or hashlib.sha256(nested_payload).hexdigest() != nested_sha):
                  fail("construction request payload/digest differs")
              result.update({"mode": mode, "request_payload_base64": nested,
                             "request_payload_sha256": nested_sha,
                             "output": absolute("output")})
          elif operation == "construct":
              mode = scalar("mode")
              if mode not in ("prepare-cache", "prepare-companions", "build-candidate",
                              "normalize-candidate"):
                  fail("construction mode differs")
              result.update({"mode": mode, "operation_request": absolute("operation_request"),
                             "operation_request_sha256": digest("operation_request_sha256")})
          elif operation == "retire":
              image = scalar("builder_image")
              if re.fullmatch(r"ghcr\.io/[a-z0-9._/-]+:[A-Za-z0-9._-]+", image) is None:
                  fail("builder image reference is malformed")
              stock_revision = scalar("stock_artifact_revision")
              if re.fullmatch(r"[0-9a-f]{40}", stock_revision) is None:
                  fail("stock artifact revision is malformed")
              authorize = scalar("authorize")
              if authorize != "RETIRE_CAPTURED_STOCK_SHARDS":
                  fail("destructive acknowledgement differs")
              result.update({"builder_image": image,
                  "builder_image_digest": digest("builder_image_digest", oci=True),
                  "workset_root": absolute("workset_root"),
                  "stock_artifact_revision": stock_revision,
                  "stock_build_record_sha256": digest("stock_build_record_sha256"),
                  "capture_manifest": absolute("capture_manifest"),
                  "capture_manifest_sha256": digest("capture_manifest_sha256"),
                  "authorization_output": absolute("authorization_output"),
                  "authorize": authorize})
          elif operation == "vision":
              runtime_image = scalar("runtime_image")
              runtime_dev_image = scalar("runtime_dev_image")
              image_pattern = r"ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}"
              if (re.fullmatch(image_pattern, runtime_image) is None
                      or re.fullmatch(image_pattern, runtime_dev_image) is None):
                  fail("vision runtime image identity is malformed")
              depth = scalar("mtp_depth")
              if depth not in ("1", "2", "3", "4"):
                  fail("vision MTP depth differs")
              result.update({"runtime_image": runtime_image,
                  "runtime_dev_image": runtime_dev_image,
                  "model": absolute("model"), "model_sha256": digest("model_sha256"),
                  "model_build_record": absolute("model_build_record"),
                  "model_build_record_sha256": digest("model_build_record_sha256"),
                  "mtp": absolute("mtp"), "mtp_sha256": digest("mtp_sha256"),
                  "mtp_depth": depth, "mmproj": absolute("mmproj"),
                  "mmproj_sha256": digest("mmproj_sha256"),
                  "vision_vocab": absolute("vision_vocab"),
                  "vision_vocab_sha256": digest("vision_vocab_sha256"),
                  "vision_output": absolute("output")})
          elif operation == "quality":
              result.update({
                  "phase_descriptor": absolute("phase_descriptor"),
                  "phase_descriptor_sha256": digest("phase_descriptor_sha256"),
              })
          elif operation == "quality-plan":
              nested = scalar("request_payload_base64")
              nested_sha = digest("request_payload_sha256")
              try:
                  nested_payload = base64.b64decode(nested, validate=True)
              except (binascii.Error, ValueError) as exc:
                  fail(f"quality descriptor request is not strict base64: {exc}")
              if (not nested_payload or len(nested_payload) > 32768
                      or hashlib.sha256(nested_payload).hexdigest() != nested_sha):
                  fail("quality descriptor request payload/digest differs")
              result.update({
                  "quality_request_payload_base64": nested,
                  "quality_request_payload_sha256": nested_sha,
                  "quality_request_output": absolute("request_output"),
              })
          elif operation == "candidate-plan":
              nested = scalar("intent_payload_base64")
              nested_sha = digest("intent_payload_sha256")
              try:
                  nested_payload = base64.b64decode(nested, validate=True)
              except (binascii.Error, ValueError) as exc:
                  fail(f"candidate construction intent is not strict base64: {exc}")
              if (not nested_payload or len(nested_payload) > 32768
                      or hashlib.sha256(nested_payload).hexdigest() != nested_sha):
                  fail("candidate construction intent payload/digest differs")
              result.update({
                  "candidate_intent_payload_base64": nested,
                  "candidate_intent_payload_sha256": nested_sha,
                  "candidate_intent_output": absolute("intent_output"),
              })
          else:
              phase = scalar("phase")
              if phase not in ("sweep", "format", "mtp-depth", "final"):
                  fail("bakeoff phase differs")
              result.update({
                  "candidate_manifest": absolute("candidate_manifest"),
                  "candidate_manifest_sha256": digest("candidate_manifest_sha256"),
                  "phase": phase,
                  "phase_request": absolute("phase_request"),
                  "phase_request_sha256": digest("phase_request_sha256"),
              })
          result["operation"] = operation
          with open(output_path, "a", encoding="utf-8") as stream:
              for name, item in sorted(result.items()):
                  stream.write(f"{name}={item}\n")
          print(json.dumps({"status": "complete", "operation": operation,
                            "ember_revision": revision, "envelope_sha256": expected_sha,
                            "publishes": False, "deletes": destructive},
                           sort_keys=True))
          PY

  qwen-call-request-bridge:
    needs: qwen-dispatch-envelope
    if: needs.qwen-dispatch-envelope.outputs.operation == 'request'
    uses: ./.github/workflows/qwen-gfx1151-request-bridge.yml
    with:
      commit_sha: ${{ inputs.commit_sha }}
      mode: ${{ needs.qwen-dispatch-envelope.outputs.mode }}
      request_payload_base64: ${{ needs.qwen-dispatch-envelope.outputs.request_payload_base64 }}
      request_payload_sha256: ${{ needs.qwen-dispatch-envelope.outputs.request_payload_sha256 }}
      output: ${{ needs.qwen-dispatch-envelope.outputs.output }}
    secrets: inherit

  qwen-call-construct:
    needs: qwen-dispatch-envelope
    if: needs.qwen-dispatch-envelope.outputs.operation == 'construct'
    uses: ./.github/workflows/qwen-gfx1151-construct.yml
    with:
      commit_sha: ${{ inputs.commit_sha }}
      mode: ${{ needs.qwen-dispatch-envelope.outputs.mode }}
      operation_request: ${{ needs.qwen-dispatch-envelope.outputs.operation_request }}
      operation_request_sha256: ${{ needs.qwen-dispatch-envelope.outputs.operation_request_sha256 }}
    secrets: inherit

  qwen-call-retire-stock:
    needs: qwen-dispatch-envelope
    if: needs.qwen-dispatch-envelope.outputs.operation == 'retire'
    uses: ./.github/workflows/qwen-gfx1151-retire-stock.yml
    with:
      commit_sha: ${{ inputs.commit_sha }}
      builder_image: ${{ needs.qwen-dispatch-envelope.outputs.builder_image }}
      builder_image_digest: ${{ needs.qwen-dispatch-envelope.outputs.builder_image_digest }}
      workset_root: ${{ needs.qwen-dispatch-envelope.outputs.workset_root }}
      stock_artifact_revision: ${{ needs.qwen-dispatch-envelope.outputs.stock_artifact_revision }}
      stock_build_record_sha256: ${{ needs.qwen-dispatch-envelope.outputs.stock_build_record_sha256 }}
      capture_manifest: ${{ needs.qwen-dispatch-envelope.outputs.capture_manifest }}
      capture_manifest_sha256: ${{ needs.qwen-dispatch-envelope.outputs.capture_manifest_sha256 }}
      authorization_output: ${{ needs.qwen-dispatch-envelope.outputs.authorization_output }}
      authorize: ${{ needs.qwen-dispatch-envelope.outputs.authorize }}
    secrets: inherit

  qwen-call-vision:
    needs: qwen-dispatch-envelope
    if: needs.qwen-dispatch-envelope.outputs.operation == 'vision'
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/qwen-gfx1151-vision.yml
    with:
      ember_revision: ${{ inputs.commit_sha }}
      runtime_image: ${{ needs.qwen-dispatch-envelope.outputs.runtime_image }}
      runtime_dev_image: ${{ needs.qwen-dispatch-envelope.outputs.runtime_dev_image }}
      model: ${{ needs.qwen-dispatch-envelope.outputs.model }}
      model_sha256: ${{ needs.qwen-dispatch-envelope.outputs.model_sha256 }}
      model_build_record: ${{ needs.qwen-dispatch-envelope.outputs.model_build_record }}
      model_build_record_sha256: ${{ needs.qwen-dispatch-envelope.outputs.model_build_record_sha256 }}
      mtp: ${{ needs.qwen-dispatch-envelope.outputs.mtp }}
      mtp_sha256: ${{ needs.qwen-dispatch-envelope.outputs.mtp_sha256 }}
      mtp_depth: ${{ needs.qwen-dispatch-envelope.outputs.mtp_depth }}
      mmproj: ${{ needs.qwen-dispatch-envelope.outputs.mmproj }}
      mmproj_sha256: ${{ needs.qwen-dispatch-envelope.outputs.mmproj_sha256 }}
      vision_vocab: ${{ needs.qwen-dispatch-envelope.outputs.vision_vocab }}
      vision_vocab_sha256: ${{ needs.qwen-dispatch-envelope.outputs.vision_vocab_sha256 }}
      output: ${{ needs.qwen-dispatch-envelope.outputs.vision_output }}
    secrets: inherit

  qwen-call-quality:
    needs: qwen-dispatch-envelope
    if: needs.qwen-dispatch-envelope.outputs.operation == 'quality'
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/qwen-quality-capture.yml
    with:
      commit_sha: ${{ inputs.commit_sha }}
      phase_descriptor: ${{ needs.qwen-dispatch-envelope.outputs.phase_descriptor }}
      phase_descriptor_sha256: ${{ needs.qwen-dispatch-envelope.outputs.phase_descriptor_sha256 }}
    secrets: inherit

  qwen-call-quality-plan:
    needs: qwen-dispatch-envelope
    if: needs.qwen-dispatch-envelope.outputs.operation == 'quality-plan'
    uses: ./.github/workflows/qwen-quality-plan.yml
    with:
      commit_sha: ${{ inputs.commit_sha }}
      request_payload_base64: ${{ needs.qwen-dispatch-envelope.outputs.quality_request_payload_base64 }}
      request_payload_sha256: ${{ needs.qwen-dispatch-envelope.outputs.quality_request_payload_sha256 }}
      request_output: ${{ needs.qwen-dispatch-envelope.outputs.quality_request_output }}
    secrets: inherit

  qwen-call-planned-quality:
    needs: [qwen-dispatch-envelope, qwen-call-quality-plan]
    if: needs.qwen-dispatch-envelope.outputs.operation == 'quality-plan'
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/qwen-quality-capture.yml
    with:
      commit_sha: ${{ inputs.commit_sha }}
      phase_descriptor: ${{ needs.qwen-call-quality-plan.outputs.phase_descriptor }}
      phase_descriptor_sha256: ${{ needs.qwen-call-quality-plan.outputs.phase_descriptor_sha256 }}
    secrets: inherit

  qwen-call-bakeoff:
    needs: qwen-dispatch-envelope
    if: needs.qwen-dispatch-envelope.outputs.operation == 'bakeoff'
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/qwen-gfx1151-bakeoff.yml
    with:
      commit_sha: ${{ inputs.commit_sha }}
      candidate_manifest: ${{ needs.qwen-dispatch-envelope.outputs.candidate_manifest }}
      candidate_manifest_sha256: ${{ needs.qwen-dispatch-envelope.outputs.candidate_manifest_sha256 }}
      phase: ${{ needs.qwen-dispatch-envelope.outputs.phase }}
      phase_request: ${{ needs.qwen-dispatch-envelope.outputs.phase_request }}
      phase_request_sha256: ${{ needs.qwen-dispatch-envelope.outputs.phase_request_sha256 }}
    secrets: inherit

  qwen-call-candidate-plan:
    needs: qwen-dispatch-envelope
    if: needs.qwen-dispatch-envelope.outputs.operation == 'candidate-plan'
    uses: ./.github/workflows/qwen-candidate-plan.yml
    with:
      commit_sha: ${{ inputs.commit_sha }}
      intent_payload_base64: ${{ needs.qwen-dispatch-envelope.outputs.candidate_intent_payload_base64 }}
      intent_payload_sha256: ${{ needs.qwen-dispatch-envelope.outputs.candidate_intent_payload_sha256 }}
      intent_output: ${{ needs.qwen-dispatch-envelope.outputs.candidate_intent_output }}
    secrets: inherit

  qwen-call-planned-candidate:
    needs: [qwen-dispatch-envelope, qwen-call-candidate-plan]
    if: needs.qwen-dispatch-envelope.outputs.operation == 'candidate-plan'
    uses: ./.github/workflows/qwen-gfx1151-construct.yml
    with:
      commit_sha: ${{ inputs.commit_sha }}
      mode: build-candidate
      operation_request: ${{ needs.qwen-call-candidate-plan.outputs.operation_request }}
      operation_request_sha256: ${{ needs.qwen-call-candidate-plan.outputs.operation_request_sha256 }}
    secrets: inherit

  qwen-inspect-control-residue:
    # Read-only forensic mode for a failed bounded conversion.  It reports
    # inode metadata and relative names only; it never opens, removes, or
    # follows a transaction entry.  This lets cleanup policy be derived from
    # the actual pinned converter rather than widened speculatively.
    if: startsWith(inputs.release_version, 'qwen-inspect-control-residue')
    runs-on: [self-hosted, linux, x64, gfx1151]
    timeout-minutes: 10
    env:
      TARGET_SHA: ${{ inputs.commit_sha }}
    steps:
      - name: Inspect exact failed converter TMPDIR metadata without mutation
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          python3 - "$TARGET_SHA" <<'PY'
          import os, pathlib, stat, sys

          revision = sys.argv[1]
          root = pathlib.Path("/var/tmp/ember-qwen3.8-flash-next/artifacts")
          prefix = f".stock-rocmi4-{revision[:12]}.transaction-"
          if not root.is_dir() or root.is_symlink():
              raise SystemExit("Qwen artifact root is absent or unsafe")
          transactions = []
          for child in root.iterdir():
              if not child.name.startswith(prefix):
                  continue
              metadata = child.lstat()
              if not stat.S_ISDIR(metadata.st_mode) or stat.S_ISLNK(metadata.st_mode):
                  raise SystemExit(f"matching transaction is not a real directory: {child.name}")
              transactions.append(child)
          if len(transactions) != 1:
              raise SystemExit(f"expected one failed transaction, found {len(transactions)}")
          transaction = transactions[0]
          private_tmp = transaction / ".converter-tmp"
          if not private_tmp.is_dir() or private_tmp.is_symlink():
              raise SystemExit("failed transaction has no safe converter TMPDIR")
          rows = []
          for current, directories, files in os.walk(private_tmp, topdown=True, followlinks=False):
              base = pathlib.Path(current)
              for name in sorted([*directories, *files]):
                  path = base / name
                  metadata = path.lstat()
                  relative = path.relative_to(private_tmp)
                  kind = ("symlink" if stat.S_ISLNK(metadata.st_mode) else
                          "directory" if stat.S_ISDIR(metadata.st_mode) else
                          "regular" if stat.S_ISREG(metadata.st_mode) else "other")
                  rows.append((str(relative), kind, stat.S_IMODE(metadata.st_mode),
                               metadata.st_uid, metadata.st_gid, metadata.st_nlink,
                               metadata.st_size))
              if len(rows) > 4096:
                  raise SystemExit("converter TMPDIR exceeds the bounded diagnostic inventory")
          print(f"transaction={transaction.name} entries={len(rows)}")
          for relative, kind, mode, uid, gid, links, size in sorted(rows):
              print(f"{kind} mode={mode:04o} uid={uid} gid={gid} "
                    f"nlink={links} size={size} path={relative}")
          PY

  qwen-preflight:
    # Feature-branch research uses the existing release_version input so this
    # branch can be dispatched before a new workflow interface reaches main.
    # It is read-only: no GPU lock, production quiesce, model load, or artifact
    # download occurs in this mode.
    if: startsWith(inputs.release_version, 'qwen-preflight')
    runs-on: [self-hosted, linux, x64, gfx1151]
    timeout-minutes: 10
    steps:
      - name: Inspect Qwen conversion and benchmark capacity
        run: |
          set -euo pipefail
          echo 'host:' "$(hostname)"
          echo 'kernel:' "$(uname -srmo)"
          awk '/^(MemTotal|MemAvailable|SwapTotal):/ { print }' /proc/meminfo
          for path in / /scratch /models /srv/models; do
            [[ ! -e "$path" ]] || df -B1 --output=source,size,avail,target "$path"
          done
          workspace=/var/tmp/ember-qwen3.8-flash-next
          if [[ -d "$workspace" && ! -L "$workspace" ]]; then
            echo 'qwen workspace bytes (same-filesystem, bounded depth):'
            du -x -B1 --max-depth=1 "$workspace" | sort -n
            for path in "$workspace"/tooling-candidate-* \
                "$workspace"/artifacts/qwen-workset/bf16-cache \
                "$workspace"/artifacts/qwen-workset/candidates \
                "$workspace"/artifacts/qwen-workset/companions; do
              [[ ! -e "$path" && ! -L "$path" ]] || du -x -B1 -s "$path"
            done | sort -n
          fi
          echo 'docker storage accounting:'
          docker system df || true
          docker image ls --no-trunc --format \
            '{{.Repository}} {{.Tag}} {{.ID}} {{.Size}}' | sort || true
          printf 'kfd_readable=%s dri_present=%s\n' \
            "$([[ -r /dev/kfd ]] && echo true || echo false)" \
            "$([[ -d /dev/dri ]] && echo true || echo false)"
          revision=f5d08274bafd880402bd16f5e3e6c514136ec06c
          for path in \
            "/models/Qwen3.8-Flash-Next/snapshots/$revision" \
            "/srv/models/Qwen3.8-Flash-Next/snapshots/$revision" \
            "/scratch/Qwen3.8-Flash-Next/snapshots/$revision"; do
            [[ ! -e "$path" ]] || {
              printf 'snapshot_candidate=%s config=%s index=%s\n' "$path" \
                "$([[ -f "$path/config.json" ]] && echo true || echo false)" \
                "$([[ -f "$path/model.safetensors.index.json" ]] && echo true || echo false)"
            }
          done

  qwen-reclaim-stale-builds:
    # One-shot, evidence-bound recovery for the construction shortfall reported
    # by runs 33136740998 and 33137503792. These are exact stale Ember build
    # images, not model data, volumes, build cache, or a production image. Stop
    # at 1160 GiB so the audited 1152 GiB construction floor remains available
    # after the measured ~1.55 GiB revision-bound tooling tree is prepared.
    if: inputs.release_version == 'qwen-reclaim-stale-builds-v7-20260828'
    runs-on: [self-hosted, linux, x64, gfx1151]
    timeout-minutes: 10
    env:
      TARGET_SHA: ${{ inputs.commit_sha }}
      CALLER_SHA: ${{ github.sha }}
    steps:
      - name: Reclaim only exact obsolete Qwen tooling and images
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$CALLER_SHA" = "$TARGET_SHA"
          construction_floor=$((1152 * 1024 * 1024 * 1024))
          required=$((1160 * 1024 * 1024 * 1024))
          (( required > construction_floor ))
          before="$(df -B1 --output=avail /var/tmp/ember-qwen3.8-flash-next | tail -1)"
          [[ "$before" =~ ^[0-9]+$ ]]
          (( before < required )) || {
            echo "No reclaim needed: $before bytes are already free"
            exit 0
          }
          available="$before"
          workspace=/var/tmp/ember-qwen3.8-flash-next
          stale_tooling_revisions=(
            '126c4ff8284ef99e399d366aec6275a5df5b7c0f'
            'd3990664c3ba8ef2cb368cf4e7aff8baf1c06e20'
            '13e272f1bcab35b2e133cb2d0c040fdc7f7bc9b1'
            '4b038f692cd83e405da4b9834b88f4e113158e43'
          )
          for revision in "${stale_tooling_revisions[@]}"; do
            (( available < required )) || break
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
            test "$revision" != "$TARGET_SHA"
            tooling="$workspace/tooling-candidate-$revision"
            if [[ ! -e "$tooling" && ! -L "$tooling" ]]; then
              echo "Already absent stale tooling: $tooling"
              continue
            fi
            test -d "$tooling" && test ! -L "$tooling"
            for child in llama.cpp ROCmFPX converter-venv; do
              test -d "$tooling/$child" && test ! -L "$tooling/$child"
            done
            rm -rf -- "$tooling"
            test ! -e "$tooling" && test ! -L "$tooling"
            available="$(df -B1 --output=avail "$workspace" | tail -1)"
            [[ "$available" =~ ^[0-9]+$ ]]
          done
          stale_images=(
            'ghcr.io/otheru-ai/ember:dev-sha-126c4ff8284e sha256:d984841feb9eff702289f11bc205a4b8b19075020a2fd235cb143bb9f70efe91'
            'ghcr.io/otheru-ai/ember:dev-sha-d3990664c3ba sha256:6e4ef001fd48230a24a7d1d198776b372b92d1af05d5822f965fd62b232b8811'
            'ghcr.io/otheru-ai/ember:dev-sha-13e272f1bcab sha256:bd3114ba77156629e7d1698acde34b1d2d70f5c559151b7e4bcb690df4c2e7fd'
            'ghcr.io/otheru-ai/ember:dev-sha-4b038f692cd8 sha256:8ec766f37ebd68c6ce7a5eda4ed2a1d76c6f856e37b87d4a1ae0c37df648f995'
            'ghcr.io/otheru-ai/ember:dev-sha-10236b8489a3 sha256:7ab721ddf095ecf0526a5cc2059c308e992e26f748f33de4b1b883cc46226ab3'
            'ghcr.io/otheru-ai/ember:dev-sha-2f99a12f8afd sha256:1d6c71627ac657b5b36defddbde3b99d2099185ec4bbed9f69ee39e09b905cdb'
            'ghcr.io/otheru-ai/ember:dev-sha-34f832863317 sha256:f6661ec650a2957a1041b738b5326f296e610be6c802526b454c0fb6350ba19b'
            'ghcr.io/otheru-ai/ember:dev-sha-35eca745378a sha256:9251ec47dd52f54be017a4c551ccdf7300727bd3ef52b70cd5829b27f05f4bd8'
            'ghcr.io/otheru-ai/ember:dev-sha-3afa5b3d8a86 sha256:fec837c44a735faccec88ba773d14208a47c9440548dce931f9a02756c49a424'
            'ghcr.io/otheru-ai/ember:dev-sha-3f4d1ee72b71 sha256:500f0a6829d9848a0f81e4fa828c25dbd6853d9ed69ad0ebc010673269bc57e6'
            'ghcr.io/otheru-ai/ember:dev-sha-4af543cc1ad0 sha256:cdd549e22658b0a2bca0f125cf8c7a2a1cf9f85b3f867d11bd71fe5ce30cfae4'
            'ghcr.io/otheru-ai/ember:dev-sha-6bc799ba9f22 sha256:18e184ffa6075e6aecf701d683224508634e6d8049937f481bd5ed03bddb6ec6'
            'ghcr.io/otheru-ai/ember:dev-sha-78261de805a5 sha256:b9936deb22bb4d7dff6ef4e6c61064987e433755557a51e080847dfa1cb07a54'
            'ghcr.io/otheru-ai/ember:dev-sha-90bf8f9f9096 sha256:b752d459c07d24a1af925c1e95ab0ee323fe017ec7195fc7298ec47aa0c0bdeb'
            'ghcr.io/otheru-ai/ember:dev-sha-936ac6f1ec95 sha256:8088484329554efff07ca3f68624d9b23bd7e20e18717f56e0e0875c07b0bbaa'
            'ghcr.io/otheru-ai/ember:dev-sha-9e44f17e8189 sha256:f4e095c5d8de0aa0ad339ecb928bd1a6357714a354ae604bc0b1320a294f7fcb'
          )
          if (( available < required )); then
            for descriptor in "${stale_images[@]}"; do
              read -r image expected_id <<<"$descriptor"
              [[ "$image" =~ ^ghcr\.io/otheru-ai/ember:dev-sha-[0-9a-f]{12}$ ]]
              [[ "$expected_id" =~ ^sha256:[0-9a-f]{64}$ ]]
              if ! actual_id="$(docker image inspect --format '{{.Id}}' \
                  "$image" 2>/dev/null)"; then
                echo "Already absent stale image: $image ($expected_id)"
                continue
              fi
              test "$actual_id" = "$expected_id"
              test "$image" != "ghcr.io/otheru-ai/ember:dev-sha-${TARGET_SHA:0:12}"
              tag_consumers="$(docker ps -aq --filter ancestor="$image")"
              id_consumers="$(docker ps -aq --filter ancestor="$expected_id")"
              if [[ -n "$tag_consumers$id_consumers" ]]; then
                echo "Preserving in-use stale image: $image ($expected_id)"
                continue
              fi
              docker image rm "$image"
              available="$(df -B1 --output=avail \
                /var/tmp/ember-qwen3.8-flash-next | tail -1)"
              [[ "$available" =~ ^[0-9]+$ ]]
              (( available >= required )) && break
            done
          fi
          (( available >= required )) || {
            echo "Exact stale-build reclaim left only $available bytes free" >&2
            exit 1
          }
          echo "free_before_bytes=$before"
          echo "free_after_bytes=$available"
          echo "reclaimed_bytes=$((available - before))"

  certify:
    # This reusable workflow is called only after the exact main-branch
    # candidate image passes every hosted and container gate. It is never
    # referenced by pull_request jobs: the runner has direct GPU and production
    # Docker access.
    if: ${{ !startsWith(inputs.release_version, 'qwen-') }}
    runs-on: [self-hosted, linux, x64, gfx1151]
    timeout-minutes: 180
    env:
      TARGET_SHA: ${{ inputs.commit_sha }}
      MODEL_PATH: ${{ vars.EMBER_CERT_MODEL_PATH }}
      DRAFT_PATH: ${{ vars.EMBER_CERT_DRAFT_PATH }}
      PORT: ${{ vars.EMBER_CERT_PORT || '18080' }}
      PRODUCTION_CONTAINER: ${{ vars.EMBER_PRODUCTION_CONTAINER || 'ember-server' }}
    steps:
      - name: Validate configured artifacts and devices
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MODEL_PATH" = /* && -f "$MODEL_PATH" ]]
          [[ "$DRAFT_PATH" = /* && -f "$DRAFT_PATH" ]]
          [[ "$PORT" =~ ^[0-9]+$ ]] && (( PORT >= 1024 && PORT <= 65535 ))
          [[ -r /dev/kfd && -d /dev/dri ]]
          if grep -Eq '(^| )(iommu|amd_iommu)=off( |$)' /proc/cmdline; then
            echo 'IOMMU is disabled in the kernel command line'
            exit 1
          fi
          find /sys/kernel/iommu_groups -mindepth 1 -maxdepth 1 -type d \
            -print -quit | grep -q .
          command -v docker >/dev/null
          command -v curl >/dev/null
          command -v dd >/dev/null
          command -v python3 >/dev/null
          [[ -x /usr/local/sbin/ember-cert-production ]]
          docker_config="$RUNNER_TEMP/ember-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$docker_config"
          prompt_path="$RUNNER_TEMP/ember-cert-short-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt"
          disk_prompt_path="$RUNNER_TEMP/ember-cert-disk-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt"
          printf '%s\n' \
            'Explain why deterministic validation matters for an inference server. Use at least eight sentences.' \
            >"$prompt_path"
          awk 'BEGIN { for (i = 1; i <= 700; i++) printf "Validation sentence %d preserves a deterministic model context.\n", i }' \
            >"$disk_prompt_path"
          printf 'PROMPT_PATH=%s\nDISK_PROMPT_PATH=%s\n' \
            "$prompt_path" "$disk_prompt_path" >>"$GITHUB_ENV"
          printf 'DOCKER_CONFIG=%s\n' "$docker_config" >>"$GITHUB_ENV"
          if curl --fail --silent --max-time 2 \
              "http://127.0.0.1:$PORT/health" >/dev/null 2>&1; then
            echo "port $PORT already serves an HTTP health endpoint"
            exit 1
          fi

      - name: Take the GPU lock
        # /root/GPU-LOCK.md is the protocol both agents on this box follow, and
        # certification was not following it. Two model-loading processes do not
        # fail loudly: the second falls back to hybrid expert placement, which
        # disables DSpark and changes generated tokens.
        #
        # Through the wrapper, because /root is dr-xr-x--- and the runner cannot
        # open the lock file itself. Calling flock directly here looked like a
        # hang: it had already failed with EACCES and the wait had nothing to
        # wait for.
        run: sudo -n /usr/local/sbin/ember-gpu-lock acquire

      - name: Quiesce production for exclusive GPU validation
        id: production
        run: |
          set -euo pipefail
          echo 'restore=none' >>"$GITHUB_OUTPUT"
          if sudo -n /usr/local/sbin/ember-cert-production is-active >/dev/null 2>&1; then
            echo 'restore=service' >>"$GITHUB_OUTPUT"
            sudo -n /usr/local/sbin/ember-cert-production stop
          elif docker inspect "$PRODUCTION_CONTAINER" >/dev/null 2>&1 &&
              [[ "$(docker inspect --format '{{.State.Running}}' "$PRODUCTION_CONTAINER")" = true ]]; then
            echo 'restore=container' >>"$GITHUB_OUTPUT"
            docker stop --timeout 180 "$PRODUCTION_CONTAINER"
          fi
          if docker inspect "$PRODUCTION_CONTAINER" >/dev/null 2>&1 &&
              [[ "$(docker inspect --format '{{.State.Running}}' "$PRODUCTION_CONTAINER")" = true ]]; then
            echo 'production remained active after quiesce request'
            exit 1
          fi
          # Stopping is not enough. Quiescing happens once and the job then runs
          # for twenty minutes assuming production stays down; the other agent on
          # this box restarted it mid-run through this same wrapper, and two
          # loaders on one 125 GiB device degraded the candidate to hybrid expert
          # placement. Block starts for the duration, so an attempt fails with an
          # assertion error rather than quietly costing the run.
          sudo -n /usr/local/sbin/ember-cert-production mask
          echo 'blocked=yes' >>"$GITHUB_OUTPUT"

      - name: Log in to GHCR and pull the exact candidate
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! login_output="$(echo "$GHCR_TOKEN" | \
              docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin 2>&1)"; then
            printf '%s\n' "$login_output"
            exit 1
          fi
          echo 'GHCR login succeeded'
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${TARGET_SHA:0:12}"
          docker pull "$image"
          revision="$(docker image inspect --format \
            '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")"
          test "$revision" = "$TARGET_SHA" || {
            echo "candidate label identifies $revision, not $TARGET_SHA"
            exit 1
          }

      - name: Verify the model artifact
        env:
          MODEL_SHA256: a936e0a514385c8ae964c0f42263a4314a34fbc6efea9d9aced5320f320a3d54
          DRAFT_SHA256: 1a01c80eceae302bcc1d70836759ee97974d7983c5084ef43f6ef772a8970ae6
        run: |
          set -euo pipefail
          python3 -c '
          import hashlib, json, os, subprocess, sys, time

          ttl = 7 * 24 * 60 * 60
          cache_path = os.path.join(
              os.path.dirname(os.environ["RUNNER_WORKSPACE"]),
              ".ember-model-integrity-v1.json",
          )
          try:
              with open(cache_path, encoding="utf-8") as stream:
                  cache = json.load(stream)
          except (FileNotFoundError, json.JSONDecodeError, OSError):
              cache = {"version": 1, "records": {}}
          if cache.get("version") != 1 or not isinstance(cache.get("records"), dict):
              cache = {"version": 1, "records": {}}

          now = int(time.time())
          pairs = zip(sys.argv[1::2], sys.argv[2::2])
          for expected, path in pairs:
              stat = os.stat(path)
              identity = {
                  "device": stat.st_dev,
                  "inode": stat.st_ino,
                  "size": stat.st_size,
                  "mtime_ns": stat.st_mtime_ns,
                  "ctime_ns": stat.st_ctime_ns,
              }
              record = cache["records"].get(path, {})
              age = now - int(record.get("verified_at", 0))
              if (
                  record.get("digest") == expected
                  and record.get("identity") == identity
                  and 0 <= age < ttl
              ):
                  print(f"{path}: OK (integrity cache hit, age {age}s)")
                  continue

              # The 96 GiB model pair shares DRAM with gfx1151.  Buffered reads
              # consume the UMA budget even when POSIX_FADV_DONTNEED is issued
              # afterward on XFS.  O_DIRECT keeps a cold integrity check from
              # making the immediately following HIP allocation fail.
              digest = hashlib.sha256()
              process = subprocess.Popen(
                  ["dd", f"if={path}", "iflag=direct", "bs=8M", "status=none"],
                  stdout=subprocess.PIPE,
              )
              assert process.stdout is not None
              while chunk := process.stdout.read(8 * 1024 * 1024):
                  digest.update(chunk)
              if process.wait() != 0:
                  raise SystemExit(f"O_DIRECT read failed for {path}")
              actual = digest.hexdigest()
              if actual != expected:
                  raise SystemExit(f"{path}: expected {expected}, got {actual}")
              cache["records"][path] = {
                  "digest": actual,
                  "identity": identity,
                  "verified_at": now,
              }
              print(f"{path}: OK (O_DIRECT integrity check)")

          temporary = f"{cache_path}.{os.getpid()}.tmp"
          with open(temporary, "w", encoding="utf-8") as stream:
              json.dump(cache, stream, sort_keys=True)
              stream.write("\n")
              stream.flush()
              os.fsync(stream.fileno())
          os.chmod(temporary, 0o600)
          os.replace(temporary, cache_path)
          ' "$MODEL_SHA256" "$MODEL_PATH" "$DRAFT_SHA256" "$DRAFT_PATH"
          available_kib="$(awk '/^MemAvailable:/ { print $2 }' /proc/meminfo)"
          minimum_kib=$((100 * 1024 * 1024))
          printf 'UMA memory available after verification: %d GiB\n' \
            "$((available_kib / 1024 / 1024))"
          (( available_kib >= minimum_kib )) || {
            echo 'less than 100 GiB is available for monolithic model placement'
            exit 1
          }

      - name: Run HIP GEMM and generation differential validators
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${TARGET_SHA:0:12}"
          gpu_args=(
            --device /dev/kfd --device /dev/dri
            --group-add video --group-add render
            --ipc host --security-opt seccomp=unconfined
            --ulimit memlock=-1:-1
          )
          docker run --rm "${gpu_args[@]}" \
            --entrypoint /usr/local/bin/ember-dflash "$image" \
            --validate-gemm-batch 64

          model_dir="$(dirname -- "$MODEL_PATH")"
          model_file="$(basename -- "$MODEL_PATH")"
          prompt_dir="$(dirname -- "$PROMPT_PATH")"
          prompt_file="$(basename -- "$PROMPT_PATH")"
          disk_prompt_dir="$(dirname -- "$DISK_PROMPT_PATH")"
          disk_prompt_file="$(basename -- "$DISK_PROMPT_PATH")"
          mounts=(
            -v "$model_dir:/cert-model:ro"
            -v "$prompt_dir:/cert-prompt:ro"
            -v "$disk_prompt_dir:/cert-disk-prompt:ro"
          )
          draft_dir="$(dirname -- "$DRAFT_PATH")"
          draft_file="$(basename -- "$DRAFT_PATH")"
          mounts+=(-v "$draft_dir:/cert-draft:ro")
          env_args=(
            -e DFLASH_DS4_SPEC=1
            -e "DFLASH_DS4_DRAFT=/cert-draft/$draft_file"
          )
          # Quiescing happens once, at the top of the job, and nothing stops
          # production being started again while certification runs -- the other
          # agent on this box did exactly that through the same wrapper, and the
          # resulting two model loaders degraded the candidate to hybrid expert
          # placement: speculation off, generated tokens changed, throughput at a
          # sixth. That surfaced as an inscrutable spec_ran assertion failure.
          # Check immediately before loading, and name the cause.
          if sudo -n /usr/local/sbin/ember-cert-production is-active >/dev/null 2>&1; then
            echo 'production was restarted during certification; two model loaders'
            echo 'cannot share this GPU and the second falls back to hybrid expert'
            echo 'placement. See docs/ci.md and /root/GPU-LOCK.md.'
            exit 1
          fi
          # docker rm returning does not mean the previous container's 85 GiB
          # mlock'd buffer is back. Loading the next model into that pressure
          # produced a server that ran at 4.78 tok/s and never speculated, which
          # failed the smoke test's spec_ran assertion and looked like a
          # regression in the engine. Wait for the memory instead.
          for _ in $(seq 1 60); do
            available_kib="$(awk '/^MemAvailable:/ { print $2 }' /proc/meminfo)"
            (( available_kib >= 100 * 1024 * 1024 )) && break
            sleep 5
          done
          cache_volume="ember-cert-validator-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker volume create "$cache_volume" >/dev/null
          cleanup_validator() { docker volume rm -f "$cache_volume" >/dev/null 2>&1 || true; }
          trap cleanup_validator EXIT
          spec_report="$(docker run --rm "${gpu_args[@]}" "${mounts[@]}" "${env_args[@]}" \
            -v "$cache_volume:/cache" \
            --entrypoint /usr/local/bin/ember-dflash "$image" \
            -m "/cert-model/$model_file" \
            --kv-cache-dir /cache \
            --ds4-prefill exact \
            --batch-sessions 2 \
            --validate-prompt "/cert-prompt/$prompt_file" \
            --validate-tokens 32)"
          printf '%s\n' "$spec_report"
          python3 -c '
          import json, sys
          report = json.load(sys.stdin)
          assert report["ok"] and report["snapshot_ok"], report
          assert report["batch"]["checked"] and report["batch"]["exact"], report
          assert report["spec"]["checked"] and report["spec"]["exact"], report
          ' <<<"$spec_report"

          disk_report="$(docker run --rm "${gpu_args[@]}" "${mounts[@]}" \
            -v "$cache_volume:/cache" \
            --entrypoint /usr/local/bin/ember-dflash "$image" \
            -m "/cert-model/$model_file" \
            --kv-cache-dir /cache \
            --ds4-prefill exact \
            --validate-prompt "/cert-disk-prompt/$disk_prompt_file" \
            --validate-tokens 16)"
          printf '%s\n' "$disk_report"
          python3 -c '
          import json, sys
          report = json.load(sys.stdin)
          assert report["ok"] and report["snapshot_ok"], report
          assert report["disk"]["checked"] and report["disk"]["exact"], report
          ' <<<"$disk_report"

      - name: Run end-to-end generation smoke test
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${TARGET_SHA:0:12}"
          # Quiescing happens once, at the top of the job, and nothing stops
          # production being started again while certification runs -- the other
          # agent on this box did exactly that through the same wrapper, and the
          # resulting two model loaders degraded the candidate to hybrid expert
          # placement: speculation off, generated tokens changed, throughput at a
          # sixth. That surfaced as an inscrutable spec_ran assertion failure.
          # Check immediately before loading, and name the cause.
          if sudo -n /usr/local/sbin/ember-cert-production is-active >/dev/null 2>&1; then
            echo 'production was restarted during certification; two model loaders'
            echo 'cannot share this GPU and the second falls back to hybrid expert'
            echo 'placement. See docs/ci.md and /root/GPU-LOCK.md.'
            exit 1
          fi
          # docker rm returning does not mean the previous container's 85 GiB
          # mlock'd buffer is back. Loading the next model into that pressure
          # produced a server that ran at 4.78 tok/s and never speculated, which
          # failed the smoke test's spec_ran assertion and looked like a
          # regression in the engine. Wait for the memory instead.
          for _ in $(seq 1 60); do
            available_kib="$(awk '/^MemAvailable:/ { print $2 }' /proc/meminfo)"
            (( available_kib >= 100 * 1024 * 1024 )) && break
            sleep 5
          done
          name="ember-cert-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cache_volume="$name-cache"
          docker volume create "$cache_volume" >/dev/null
          cleanup_server() {
            docker rm -f "$name" >/dev/null 2>&1 || true
            docker volume rm -f "$cache_volume" >/dev/null 2>&1 || true
          }
          trap cleanup_server EXIT
          model_target=/models/DeepSeek-V4-Flash-0731-Abliterated-ROCMFPx-Strix-Lean-2.58bpw.gguf
          draft_target=/models/DeepSeek-V4-Flash-0731-Abliterated-DSpark-draft-4.25bpw.gguf
          mounts=(-v "$MODEL_PATH:$model_target:ro" -v "$cache_volume:/cache")
          env_args=(
            -e "EMBER_PORT=$PORT"
          )
          mounts+=(-v "$DRAFT_PATH:$draft_target:ro")
          docker run -d --name "$name" --network host \
            --device /dev/kfd --device /dev/dri \
            --group-add video --group-add render \
            --ipc host --security-opt seccomp=unconfined \
            --ulimit memlock=-1:-1 \
            "${mounts[@]}" "${env_args[@]}" "$image" \
            --ds4-prefill exact --batch-sessions 1 >/dev/null

          ready=0
          for _ in $(seq 1 240); do
            if curl --fail --silent --max-time 5 \
                "http://127.0.0.1:$PORT/health" >/dev/null; then
              ready=1
              break
            fi
            running="$(docker inspect --format '{{.State.Running}}' "$name")"
            if [[ "$running" != true ]]; then
              docker logs "$name"
              exit 1
            fi
            sleep 5
          done
          [[ "$ready" = 1 ]] || { docker logs "$name"; exit 1; }
          response="$(curl --fail --silent --show-error --max-time 300 \
            -H 'Content-Type: application/json' \
            -d '{"model":"deepseek-v4-flash","messages":[{"role":"user","content":"Reply briefly that Ember is ready."}],"max_tokens":128,"temperature":0,"top_p":1,"top_k":0,"stream":false}' \
            "http://127.0.0.1:$PORT/v1/chat/completions")"
          printf '%s\n' "$response"
          python3 -c '
          import json, sys
          response = json.load(sys.stdin)
          message = response["choices"][0]["message"]
          assert message.get("content") or message.get("reasoning_content"), response
          assert response["usage"]["backend"]["spec_ran"] is True, response
          ' <<<"$response"

      - name: Unblock production
        if: ${{ always() && steps.production.outputs.blocked == 'yes' }}
        run: sudo -n /usr/local/sbin/ember-cert-production unmask

      - name: Restore production
        if: ${{ always() && (steps.production.outputs.restore == 'service' || steps.production.outputs.restore == 'container') }}
        run: |
          case "${{ steps.production.outputs.restore }}" in
            service)
              sudo -n /usr/local/sbin/ember-cert-production start
              ;;
            container)
              docker start "$PRODUCTION_CONTAINER"
              ;;
            *)
              echo 'unknown production restore mode' >&2
              exit 1
              ;;
          esac

      - name: Release the GPU lock
        if: ${{ always() }}
        run: sudo -n /usr/local/sbin/ember-gpu-lock release

      - name: Remove generated validation prompts
        if: ${{ always() }}
        run: |
          for path in "${PROMPT_PATH:-}" "${DISK_PROMPT_PATH:-}"; do
            [[ -z "$path" ]] || rm -f -- "$path"
          done
          if [[ -n "${DOCKER_CONFIG:-}" ]]; then
            rm -f -- "$DOCKER_CONFIG/config.json"
            rmdir -- "$DOCKER_CONFIG" 2>/dev/null || true
          fi

      - name: Record certification result
        run: |
          {
            echo '## gfx1151 certification passed'
            echo
            echo "Certified source SHA: \`$TARGET_SHA\`"
            echo
            echo 'Release promotion will now generate the changelog and tag automatically.'
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Promote certified candidate
    needs: certify
    runs-on: [self-hosted, ember-builder]
    timeout-minutes: 15
    outputs:
      version: ${{ steps.promote.outputs.version }}
    steps:
      - name: Quiet expected exact-SHA checkout advice
        run: |
          if git -C "$GITHUB_WORKSPACE" rev-parse --git-dir >/dev/null 2>&1; then
            git -C "$GITHUB_WORKSPACE" config advice.detachedHead false
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Generate release metadata and publish the source-of-truth tag
        id: promote
        env:
          TARGET_SHA: ${{ inputs.commit_sha }}
          REQUESTED_VERSION: ${{ inputs.release_version }}
          RELEASE_AUTOMATION_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          FORGEJO_RELEASE_SSH_KEY: ${{ secrets.FORGEJO_RELEASE_SSH_KEY }}
          FORGEJO_SSH_HOST_KEYS: ${{ secrets.FORGEJO_SSH_HOST_KEYS }}
          FORGEJO_RELEASE_REMOTE: ${{ vars.FORGEJO_RELEASE_REMOTE }}
        run: |
          set -euo pipefail
          test "$(git rev-parse 'HEAD^{commit}')" = "$TARGET_SHA"
          test "$(git rev-parse 'origin/main^{commit}')" = "$TARGET_SHA" || {
            echo 'main advanced after certification began; certify the new tip instead'
            exit 1
          }
          test -n "$RELEASE_AUTOMATION_TOKEN"
          test -n "$FORGEJO_RELEASE_SSH_KEY"
          test -n "$FORGEJO_SSH_HOST_KEYS"
          test -n "$FORGEJO_RELEASE_REMOTE"

          version="${REQUESTED_VERSION:-$(date -u +%Y.%-m.%-d)}"
          python3 ci/release_changelog.py prepare --version "$version"

          mapfile -t changed < <(git diff --name-only | sort)
          expected=(CHANGELOG.md compose.yaml VERSION)
          test "${changed[*]}" = "${expected[*]}" || {
            printf 'release preparation changed unexpected files: %s\n' "${changed[*]}"
            exit 1
          }

          git config user.name ember-release
          git config user.email release@otheru.ai
          git add CHANGELOG.md VERSION compose.yaml
          git commit -m "chore(release): v$version"
          release_sha="$(git rev-parse HEAD)"
          tag="v$version"
          git tag -a "$tag" -m "Ember $version" \
            -m "Certified-Parent: $TARGET_SHA"

          # The tag publisher treats this repository variable as the
          # authoritative record of which executable tree passed on gfx1151.
          payload="$(CERTIFIED_SHA="$TARGET_SHA" python3 -c \
            'import json, os; print(json.dumps({"name":"EMBER_GFX1151_CERTIFIED_SHA","value":os.environ["CERTIFIED_SHA"]}))')"
          curl --fail --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer $RELEASE_AUTOMATION_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/variables/EMBER_GFX1151_CERTIFIED_SHA"

          ssh_dir="$RUNNER_TEMP/ember-release-ssh-$GITHUB_RUN_ID"
          cleanup() {
            rm -f -- "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
            rmdir -- "$ssh_dir" 2>/dev/null || true
          }
          trap cleanup EXIT
          umask 077
          mkdir "$ssh_dir"
          printf '%s\n' "$FORGEJO_RELEASE_SSH_KEY" >"$ssh_dir/id_ed25519"
          printf '%s\n' "$FORGEJO_SSH_HOST_KEYS" >"$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$ssh_dir/known_hosts"
          test "$(git ls-remote "$FORGEJO_RELEASE_REMOTE" refs/heads/main | cut -f1)" = "$TARGET_SHA"
          test -z "$(git ls-remote "$FORGEJO_RELEASE_REMOTE" "refs/tags/$tag")" || {
            echo "$tag already exists on Forgejo"
            exit 1
          }
          git push --atomic "$FORGEJO_RELEASE_REMOTE" \
            "HEAD:refs/heads/main" "refs/tags/$tag:refs/tags/$tag"

          {
            echo '## Release promoted'
            echo
            echo "Version: \`$version\`"
            echo "Certified source: \`$TARGET_SHA\`"
            echo "Release commit: \`$release_sha\`"
            echo "Tag: \`$tag\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  benchmark:
    name: Benchmark the released image
    # After promotion, deliberately. This measures a release rather than gating
    # one: the tag already exists by the time it starts, so a benchmark that
    # fails or times out cannot cost a release that certification passed.
    #
    # It also keeps the certify job hermetic. Certification runs nothing from
    # the repository -- it validates the published image and only the published
    # image -- and running the harness there would have meant checking out a
    # working tree onto the machine that holds production and the GPU.
    needs: [certify, promote]
    if: ${{ needs.promote.result == 'success' }}
    runs-on: [self-hosted, linux, x64, gfx1151]
    timeout-minutes: 180
    env:
      MODEL_PATH: ${{ vars.EMBER_CERT_MODEL_PATH }}
      DRAFT_PATH: ${{ vars.EMBER_CERT_DRAFT_PATH }}
      RELEASE_VERSION: ${{ needs.promote.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: Take the GPU lock and quiesce production
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/ember-gpu-lock acquire
          if sudo -n /usr/local/sbin/ember-cert-production is-active >/dev/null 2>&1; then
            sudo -n /usr/local/sbin/ember-cert-production stop
            echo 'restore=yes' >>"$GITHUB_OUTPUT"
          fi
          sudo -n /usr/local/sbin/ember-cert-production mask
        id: bench-exclusive

      - name: Run the performance bundle
        env:
          BENCH_TIMEOUT_MIN: '150'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/bench-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out"
          # The promoted tag, so the bundle describes what people can pull.
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_VERSION"
          # Unlike certification this job owns nothing yet, so the script takes
          # the GPU lock and manages production itself, restoring it on exit.
          # Digests are the constants certification already verified.
          export MODEL_DIR TARGET DRAFT PORT TARGET_SHA DRAFT_SHA
          MODEL_DIR="$(dirname "$MODEL_PATH")"
          TARGET="$MODEL_PATH"
          DRAFT="$DRAFT_PATH"
          PORT=18086
          TARGET_SHA=a936e0a514385c8ae964c0f42263a4314a34fbc6efea9d9aced5320f320a3d54
          DRAFT_SHA=1a01c80eceae302bcc1d70836759ee97974d7983c5084ef43f6ef772a8970ae6
          timeout "${BENCH_TIMEOUT_MIN}m" "$GITHUB_WORKSPACE/scripts/benchmark_bundle.sh" \
            --out "$out" --release "$RELEASE_VERSION" \
            --image "$image" --binary /usr/local/bin/ember-dflash \
            --no-repo-mount --no-exclusive
          bundle="$(find "$out" -maxdepth 1 -type d -name 'ember-*' | head -1)"
          test -n "$bundle"
          test -s "$bundle/summary.json"
          echo "BENCH_BUNDLE=$bundle" >>"$GITHUB_ENV"
          python3 "$GITHUB_WORKSPACE/scripts/bench/build_perf_site_data.py" \
            --bundle "$bundle" --certified \
            --out "$bundle/perf-site-data.json"
          python3 - "$bundle/summary.json" "$bundle/perf-site-data.json" \
            >>"$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          s = json.load(open(sys.argv[1]))
          r = json.load(open(sys.argv[2]))['releases'][0]
          print('## Performance bundle\n')
          d = s.get('decode') or {}
          if d:
              print(f"Decode, throughput group: **{d['median_tps']} tok/s** median "
                    f"of {d['samples']} ({d['min_tps']}-{d['max_tps']}).\n")
          w = s.get('by_workload') or {}
          if w:
              lo = min(w.values(), key=lambda v: v['tok_s'])['tok_s']
              hi = max(w.values(), key=lambda v: v['tok_s'])['tok_s']
              print(f"Across {len(w)} workloads decode spans **{lo}-{hi} tok/s**.\n")
              print('| Workload | tok/s | vs AR |')
              print('| --- | ---: | ---: |')
              for k, v in sorted(w.items(), key=lambda kv: -kv[1]['tok_s']):
                  sp = f"{v['speedup']}x" if v.get('speedup') else '-'
                  print(f"| {k} | {v['tok_s']} | {sp} |")
              print()
          n = len(r['depths'])
          print(f"Page data: {len(r['workloads'])} workloads, {n} context depths.\n")
          if not n:
              print('> No context sweep in this bundle, so the depth chart would be '
                    'empty. Check the sweep was not skipped before publishing.\n')
          PY

      - name: Restore production and release the GPU lock
        if: ${{ always() }}
        run: |
          sudo -n /usr/local/sbin/ember-cert-production unmask || true
          if [ "${{ steps.bench-exclusive.outputs.restore }}" = yes ]; then
            sudo -n /usr/local/sbin/ember-cert-production start || true
          fi
          sudo -n /usr/local/sbin/ember-gpu-lock release || true

      - name: Upload the performance bundle
        if: ${{ always() && env.BENCH_BUNDLE != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-bundle-${{ inputs.commit_sha }}
          path: ${{ env.BENCH_BUNDLE }}
          retention-days: 90

  qwen-download:
    # Resumable, content-addressed source acquisition for feature-branch model
    # research.  Downloading does not need exclusive GPU access and therefore
    # deliberately leaves production running.  Conversion and measurement use
    # separate modes that take the host lock and fixed-purpose wrapper.
    if: startsWith(inputs.release_version, 'qwen-download')
    runs-on: [self-hosted, linux, x64, gfx1151]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - name: Fetch and verify the pinned public snapshot
        run: |
          set -euo pipefail
          workspace=/var/tmp/ember-qwen3.8-flash-next
          snapshot="$workspace/snapshots/f5d08274bafd880402bd16f5e3e6c514136ec06c"
          mkdir -p "$workspace"
          available="$(df -B1 --output=avail "$workspace" | tail -1)"
          required=$((400 * 1024 * 1024 * 1024))
          (( available >= required )) || {
            echo "Qwen download requires 400 GiB free; found $available bytes"
            exit 1
          }
          python3 scripts/qwen_snapshot_fetch.py \
            --inventory share/release_profiles/qwen3.8-flash-next-snapshot.json \
            --output "$snapshot" --workers 4
          printf 'snapshot=%s\n' "$snapshot" >>"$GITHUB_STEP_SUMMARY"

  qwen-stage-quality-judge:
    # Fetch one revision- and digest-pinned, different-family judge into the
    # Qwen workset without opening /models, taking the GPU lock, stopping
    # production, publishing, or deleting anything. This mode is deliberately
    # an exact release-version capability rather than a prefix match: staging a
    # 85.26 GiB artifact must be an explicit operator action.
    if: inputs.release_version == 'qwen-stage-quality-judge-v1-20260828'
    runs-on: [self-hosted, linux, x64, gfx1151]
    timeout-minutes: 720
    env:
      TARGET_SHA: ${{ inputs.commit_sha }}
      JUDGE_REVISION: 75a4bed8e6762986d7b4169e1e1afbb57c482704
      JUDGE_FILENAME: DeepSeek-V4-Flash-0731-Abliterated-ROCMFPx-Strix-Lean-2.58bpw.gguf
      JUDGE_SHA256: a936e0a514385c8ae964c0f42263a4314a34fbc6efea9d9aced5320f320a3d54
      JUDGE_BYTES: '91547243200'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Bind the exact judge source and require healthy production
        run: |
          set -euo pipefail
          [[ "${GITHUB_REPOSITORY,,}" = otheru-ai/ember ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --quiet --exit-code
          test -x /usr/local/sbin/ember-cert-production
          sudo -n /usr/local/sbin/ember-cert-production is-active >/dev/null
          curl --fail --silent --max-time 2 http://127.0.0.1:8000/health >/dev/null
          inventory="$GITHUB_WORKSPACE/share/release_profiles/deepseek-v4-flash-strix-halo-quality-judge.json"
          test -f "$inventory" && test ! -L "$inventory"
          python3 - "$inventory" "$JUDGE_REVISION" "$JUDGE_FILENAME" \
              "$JUDGE_SHA256" "$JUDGE_BYTES" <<'PY'
          import json, pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          revision, filename, digest, size_raw = sys.argv[2:]
          value = json.loads(path.read_text(encoding="utf-8"))
          expected_keys = {"schema", "artifact_role", "repo_id", "revision",
                           "file_count", "total_bytes", "files"}
          if (set(value) != expected_keys
                  or value.get("schema") != "ember.qwen3.8.quality-judge-source.v1"
                  or value.get("artifact_role") != "independent_quality_judge"
                  or value.get("repo_id") != "otheru/DeepSeek-V4-Flash-Strix-Halo-GGUF"
                  or value.get("revision") != revision
                  or re.fullmatch(r"[0-9a-f]{40}", revision) is None
                  or value.get("file_count") != 1
                  or value.get("total_bytes") != int(size_raw)):
              raise SystemExit("quality judge source inventory identity differs")
          rows = value.get("files")
          if not isinstance(rows, list) or len(rows) != 1:
              raise SystemExit("quality judge source must contain exactly one artifact")
          row = rows[0]
          if (not isinstance(row, dict)
                  or set(row) != {"path", "size", "sha256", "git_blob"}
                  or row.get("path") != filename or "/" in filename
                  or row.get("size") != int(size_raw)
                  or row.get("sha256") != digest
                  or re.fullmatch(r"[0-9a-f]{64}", digest) is None
                  or re.fullmatch(r"[0-9a-f]{40}", str(row.get("git_blob"))) is None):
              raise SystemExit("quality judge artifact identity differs")
          PY
          printf 'JUDGE_SOURCE_INVENTORY=%s\n' "$inventory" >>"$GITHUB_ENV"

      - name: Resumably stage and directly verify the pinned judge
        run: |
          set -euo pipefail
          workspace=/var/tmp/ember-qwen3.8-flash-next
          workset="$workspace/artifacts/qwen-workset"
          judges="$workset/judges"
          destination="$judges/deepseek-v4-flash-strix-halo-$JUDGE_REVISION"
          test -d "$workspace" && test ! -L "$workspace"
          test -d "$workspace/artifacts" && test ! -L "$workspace/artifacts"
          test -d "$workset" && test ! -L "$workset"
          if [[ ! -e "$judges" && ! -L "$judges" ]]; then
            mkdir "$judges"
          fi
          test -d "$judges" && test ! -L "$judges"
          if [[ ! -e "$destination" && ! -L "$destination" ]]; then
            mkdir "$destination"
          fi
          test -d "$destination" && test ! -L "$destination"
          artifact="$destination/$JUDGE_FILENAME"
          partial="$destination/.$JUDGE_FILENAME.partial"
          for path in "$artifact" "$partial"; do
            if [[ -e "$path" || -L "$path" ]]; then
              test -f "$path" && test ! -L "$path"
            fi
          done
          if [[ ! -e "$artifact" ]]; then
            partial_bytes=0
            [[ ! -e "$partial" ]] || partial_bytes="$(stat -c %s "$partial")"
            (( partial_bytes <= JUDGE_BYTES )) || {
              echo 'partial judge artifact exceeds the pinned byte count' >&2
              exit 1
            }
            available="$(df -B1 --output=avail "$judges" | tail -1)"
            # Preserve 16 GiB of headroom beyond the unfinished payload. The
            # transfer uses idle I/O and CPU priority while production remains
            # resident and is health-checked again before the handoff exists.
            required=$(( JUDGE_BYTES - partial_bytes + 16 * 1024 * 1024 * 1024 ))
            (( available >= required )) || {
              echo "judge staging requires $required free bytes; found $available" >&2
              exit 1
            }
            ionice -c 3 nice -n 19 python3 scripts/qwen_snapshot_fetch.py \
              --inventory "$JUDGE_SOURCE_INVENTORY" --output "$destination" --workers 1
          fi
          test -f "$artifact" && test ! -L "$artifact"
          test "$(stat -c %s "$artifact")" = "$JUDGE_BYTES"
          # Direct I/O is load-bearing here: buffered hashing of a 85.26 GiB
          # file was measured to starve the following unified-memory residency
          # even after POSIX_FADV_DONTNEED on the runner's model XFS volume.
          actual="$(dd if="$artifact" iflag=direct bs=8M status=none | sha256sum | awk '{print $1}')"
          test "$actual" = "$JUDGE_SHA256"
          printf 'JUDGE_ARTIFACT=%s\n' "$artifact" >>"$GITHUB_ENV"

      - name: Emit one create-only quality judge inventory after health proof
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/ember-cert-production is-active >/dev/null
          curl --fail --silent --max-time 2 http://127.0.0.1:8000/health >/dev/null
          output="$(dirname "$JUDGE_ARTIFACT")/quality-judge-inventory.json"
          inventory_sha="$(python3 - "$output" "$JUDGE_ARTIFACT" \
              "$JUDGE_SHA256" "$JUDGE_BYTES" <<'PY'
          import hashlib, json, os, pathlib, stat, sys
          output, artifact = map(pathlib.Path, sys.argv[1:3])
          digest, size_raw = sys.argv[3:]
          value = {
              "schema": "ember.qwen3.8.quality-judge-inventory.v1",
              "artifact": {"path": str(artifact), "sha256": digest,
                           "bytes": int(size_raw)},
          }
          raw = (json.dumps(value, indent=2, sort_keys=True) + "\n").encode()
          flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, "O_NOFOLLOW", 0)
          try:
              descriptor = os.open(output, flags, 0o644)
          except FileExistsError:
              info = output.lstat()
              if (not stat.S_ISREG(info.st_mode) or output.is_symlink()
                      or output.read_bytes() != raw):
                  raise SystemExit("existing quality judge inventory differs")
          else:
              with os.fdopen(descriptor, "wb", closefd=True) as stream:
                  stream.write(raw); stream.flush(); os.fsync(stream.fileno())
              parent = os.open(output.parent, os.O_RDONLY | getattr(os, "O_DIRECTORY", 0))
              try: os.fsync(parent)
              finally: os.close(parent)
          print(hashlib.sha256(raw).hexdigest())
          PY
          )"
          printf 'JUDGE_INVENTORY=%s\nJUDGE_INVENTORY_SHA256=%s\n' \
            "$output" "$inventory_sha" >>"$GITHUB_ENV"

      - name: Record the nonpublishing judge handoff
        run: |
          {
            echo '## Qwen independent quality judge staged'
            echo
            echo "Source revision: \`$JUDGE_REVISION\`"
            echo "Artifact: \`$JUDGE_ARTIFACT\`"
            echo "Artifact SHA-256: \`$JUDGE_SHA256\`"
            echo "Artifact bytes: \`$JUDGE_BYTES\`"
            echo "Judge inventory: \`$JUDGE_INVENTORY\`"
            echo "Judge inventory SHA-256: \`$JUDGE_INVENTORY_SHA256\`"
            echo
            echo 'Production remained online and healthy. No model or evidence was published or deleted.'
          } >>"$GITHUB_STEP_SUMMARY"

  qwen-convert-control:
    # Build the exact, final-ineligible stock ROCMI4 control used for activation
    # capture and the measured format bakeoff.  Tool/image preparation leaves
    # production online.  Only the 125 GiB bounded conversion owns the GPU/UMA
    # host, through the same fixed-purpose lock and service wrapper as release
    # certification.
    if: startsWith(inputs.release_version, 'qwen-convert-control')
    runs-on: [self-hosted, linux, x64, gfx1151]
    timeout-minutes: 720
    env:
      TARGET_SHA: ${{ inputs.commit_sha }}
      QWEN_REVISION: f5d08274bafd880402bd16f5e3e6c514136ec06c
      LLAMA_REVISION: abdc7a0bf815d3b83e26dd523c6960e4dd597e82
      ROCMFPX_REVISION: c49ebdbd5c9f01ec242369f9e7f7967855f80cba
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Pull and bind the exact ROCm 10 development image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          docker_config="$RUNNER_TEMP/qwen-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$docker_config"
          export DOCKER_CONFIG="$docker_config"
          printf 'DOCKER_CONFIG=%s\n' "$docker_config" >>"$GITHUB_ENV"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}:dev-sha-${TARGET_SHA:0:12}"
          docker pull "$image"
          embedded="$(docker run --rm --entrypoint /bin/sh "$image" -c \
            'awk -F= '\''$1 == "EMBER_CONFIGURED_GIT_HEAD:STRING" { print $2 }'\'' /ember/build-rocm/CMakeCache.txt')"
          test "$embedded" = "$TARGET_SHA"
          docker run --rm --entrypoint /bin/sh "$image" -c \
            'test -x /ember/build-rocm/ember-gguf-quantize && /usr/bin/time --version >/dev/null'
          printf 'QWEN_DEV_IMAGE=%s\n' "$image" >>"$GITHUB_ENV"
          docker image inspect "$image" >"$RUNNER_TEMP/qwen-dev-image-$GITHUB_RUN_ID.json"

      - name: Prepare pinned conversion tools while production remains online
        run: |
          set -euo pipefail
          workspace=/var/tmp/ember-qwen3.8-flash-next
          snapshot="$workspace/snapshots/$QWEN_REVISION"
          test -f "$snapshot/model.safetensors.index.json"
          if [[ -e "$snapshot/.ember-fetch.lock" ]] && \
              ! docker run --rm --network none \
                -v "$snapshot:/qwen-snapshot:ro" "$QWEN_DEV_IMAGE" \
                python3 -c 'import fcntl, os; fd=os.open("/qwen-snapshot/.ember-fetch.lock", os.O_RDONLY); fcntl.flock(fd, fcntl.LOCK_EX | fcntl.LOCK_NB)' ; then
            echo 'the resumable source download still owns the snapshot'
            exit 1
          fi
          mkdir -p "$workspace/tooling" "$workspace/evidence"
          ple_patch="$GITHUB_WORKSPACE/patches/llama.cpp/qwen4exp-ple-cgroup-writeback.patch"
          split_patch="$GITHUB_WORKSPACE/patches/llama.cpp/gguf-split-bounded-copy.patch"
          echo "606880dd1e23b4af9f2a6782d26e4db673c9db61ee315fa4e5e4c5c96af758fc  $ple_patch" | sha256sum -c -
          echo "b174f2b2a0b11e78e812e5f31d9ac84deaa8f94f9650abdab3760655c3aebe38  $split_patch" | sha256sum -c -
          ensure_checkout() {
            local url="$1" revision="$2" destination="$3"
            if [[ ! -d "$destination/.git" ]]; then
              git clone --filter=blob:none "$url" "$destination"
            fi
            git -C "$destination" fetch --filter=blob:none origin "$revision"
            # This is a disposable cached tool checkout. Restore every tracked
            # path from the exact requested revision so an interrupted run or
            # an older version of the audited patch cannot poison a retry.
            git -C "$destination" restore --source="$revision" --staged --worktree -- .
            git -C "$destination" checkout --detach "$revision"
            test "$(git -C "$destination" rev-parse HEAD)" = "$revision"
            test -z "$(git -C "$destination" status --porcelain --untracked-files=no)"
          }
          ensure_checkout https://github.com/ggml-org/llama.cpp.git \
            "$LLAMA_REVISION" "$workspace/tooling/llama.cpp"
          ensure_checkout https://github.com/charlie12345/ROCmFPX.git \
            "$ROCMFPX_REVISION" "$workspace/tooling/ROCmFPX"
          git -c safe.directory="$workspace/tooling/llama.cpp" \
            -C "$workspace/tooling/llama.cpp" apply --check "$ple_patch"
          git -c safe.directory="$workspace/tooling/llama.cpp" \
            -C "$workspace/tooling/llama.cpp" apply "$ple_patch"
          git -c safe.directory="$workspace/tooling/llama.cpp" \
            -C "$workspace/tooling/llama.cpp" apply --check "$split_patch"
          git -c safe.directory="$workspace/tooling/llama.cpp" \
            -C "$workspace/tooling/llama.cpp" apply "$split_patch"
          echo "3b226aaafa05cc7f56670e86f408e6708dc65eb95266eb23b71b294963f276ee  $workspace/tooling/llama.cpp/conversion/qwen4exp.py" | sha256sum -c -
          echo "fc6fc7103959763791d49e338916dd020429b1948ad357a5e5e54d54137be321  $workspace/tooling/llama.cpp/tools/gguf-split/gguf-split.cpp" | sha256sum -c -
          docker run --rm --network host \
            -e LLAMA_REVISION="$LLAMA_REVISION" \
            -v "$workspace:/qwen-work" "$QWEN_DEV_IMAGE" bash -lc '
              set -euo pipefail
              git config --global --add safe.directory /qwen-work/tooling/llama.cpp
              cmake -S /qwen-work/tooling/llama.cpp \
                -B /qwen-work/tooling/llama.cpp/build \
                -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF \
                -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
                -DBUILD_SHARED_LIBS=OFF
              cmake --build /qwen-work/tooling/llama.cpp/build \
                --target llama-gguf-split -j"$(nproc)"
              splitter=/qwen-work/tooling/llama.cpp/build/bin/llama-gguf-split
              version="$($splitter --version 2>&1)"
              commit="$(sed -n "s/.*commit \([0-9a-f]\{7,40\}\).*/\1/p" <<<"$version")"
              test -n "$commit" && [[ "$LLAMA_REVISION" == "$commit"* ]]
              test -d /qwen-work/tooling/converter-venv || \
                python3 -m venv /qwen-work/tooling/converter-venv
              /qwen-work/tooling/converter-venv/bin/pip install --no-cache-dir \
                -r /qwen-work/tooling/llama.cpp/requirements/requirements-convert_hf_to_gguf.txt
              /qwen-work/tooling/converter-venv/bin/python -m pip freeze \
                > /qwen-work/evidence/converter-requirements.freeze.txt
            '

      - name: Take exclusive UMA ownership and quiesce production
        id: qwen-control-exclusive
        run: |
          set -euo pipefail
          echo 'lock=no' >>"$GITHUB_OUTPUT"
          echo 'restore=no' >>"$GITHUB_OUTPUT"
          echo 'masked=no' >>"$GITHUB_OUTPUT"
          sudo -n /usr/local/sbin/ember-gpu-lock acquire
          echo 'lock=yes' >>"$GITHUB_OUTPUT"
          if sudo -n /usr/local/sbin/ember-cert-production is-active >/dev/null 2>&1; then
            echo 'restore=yes' >>"$GITHUB_OUTPUT"
            sudo -n /usr/local/sbin/ember-cert-production stop
          fi
          sudo -n /usr/local/sbin/ember-cert-production mask
          echo 'masked=yes' >>"$GITHUB_OUTPUT"

      - name: Convert, split, and quantize the stock control within 125 GiB
        id: qwen-control-build
        run: |
          set -euo pipefail
          workspace=/var/tmp/ember-qwen3.8-flash-next
          snapshot="$workspace/snapshots/$QWEN_REVISION"
          output="$workspace/artifacts/stock-rocmi4-${TARGET_SHA:0:12}"
          test ! -e "$output"
          python3 - "$workspace/artifacts" ".stock-rocmi4-${TARGET_SHA:0:12}.transaction-" \
            "$workspace/evidence/control-${TARGET_SHA:0:12}.stale-transactions.json" <<'PY'
          import json, os, pathlib, shutil, stat, sys
          root = pathlib.Path(sys.argv[1]).resolve(strict=True)
          prefix = sys.argv[2]
          evidence = pathlib.Path(sys.argv[3])
          removed = []
          for child in root.iterdir():
              if not child.name.startswith(prefix):
                  continue
              info = child.lstat()
              if stat.S_ISLNK(info.st_mode) or not stat.S_ISDIR(info.st_mode):
                  raise SystemExit(f"refusing unsafe stale transaction entry: {child}")
              if child.parent.resolve(strict=True) != root:
                  raise SystemExit(f"stale transaction escaped artifact root: {child}")
              removed.append(child.name)
              shutil.rmtree(child)
          payload = {"artifact_root": str(root), "prefix": prefix,
                     "removed": sorted(removed)}
          temp = evidence.with_suffix(evidence.suffix + ".tmp")
          temp.write_text(json.dumps(payload, sort_keys=True) + "\n", encoding="utf-8")
          os.replace(temp, evidence)
          PY
          name="qwen-control-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "name=$name" >>"$GITHUB_OUTPUT"
          docker run --name "$name" --network none --ipc host \
            --memory 125g --memory-swap 125g \
            --ulimit memlock=-1:-1 \
            -v "$workspace:/qwen-work" "$QWEN_DEV_IMAGE" bash -lc "
              set -euo pipefail
              # The bind-mounted checkouts are owned by the host runner uid,
              # while the ROCm development image runs this bounded conversion
              # as root. Pin only the three audited repositories as safe; a
              # broad '*' exception would disable Git's ownership boundary.
              git config --global --add safe.directory /ember
              git config --global --add safe.directory /qwen-work/tooling/llama.cpp
              git config --global --add safe.directory /qwen-work/tooling/ROCmFPX
              /usr/bin/time -v \
                -o /qwen-work/evidence/control-${TARGET_SHA:0:12}.time.txt \
                /qwen-work/tooling/converter-venv/bin/python \
                /ember/scripts/qwen_quantize.py \
                  --snapshot-dir /qwen-work/snapshots/$QWEN_REVISION \
                  --snapshot-revision $QWEN_REVISION \
                  --stock-control \
                  --llama-cpp-dir /qwen-work/tooling/llama.cpp \
                  --gguf-splitter /qwen-work/tooling/llama.cpp/build/bin/llama-gguf-split \
                  --bounded-memory-temp \
                  --conversion-memory-limit-bytes 134217728000 \
                  --rocmfpx-dir /qwen-work/tooling/ROCmFPX \
                  --ember-dir /ember --ember-revision $TARGET_SHA \
                  --quantizer /ember/build-rocm/ember-gguf-quantize \
                  --work-dir /qwen-work/artifacts/stock-rocmi4-${TARGET_SHA:0:12} \
                  --execute
              mkdir -p /qwen-work/artifacts/mtp-rocmi4-${TARGET_SHA:0:12}
              /qwen-work/tooling/converter-venv/bin/python \
                /ember/scripts/qwen_mtp_export.py \
                  --source-dir /qwen-work/snapshots/$QWEN_REVISION \
                  --format gguf --matrix-quant Q4_0_ROCMI4 \
                  --output /qwen-work/artifacts/mtp-rocmi4-${TARGET_SHA:0:12}/Qwen3.8-Flash-Next-MTP-BF16.gguf \
                  --quantizer /ember/build-rocm/ember-gguf-quantize \
                  --quantized-output /qwen-work/artifacts/mtp-rocmi4-${TARGET_SHA:0:12}/Qwen3.8-Flash-Next-MTP-ROCmI4-Strix-Halo.gguf \
                  --manifest-out /qwen-work/artifacts/mtp-rocmi4-${TARGET_SHA:0:12}/export.json
            " 2>&1 | tee "$workspace/evidence/control-${TARGET_SHA:0:12}.log"
          docker rm "$name" >/dev/null
          test -s "$output/qwen-quant-build-record.json"
          python3 - "$output/qwen-quant-build-record.json" <<'PY'
          import json, sys
          record = json.load(open(sys.argv[1], encoding="utf-8"))
          assert record["status"] == "complete", record
          assert record["experiment"]["kind"] == "stock_control", record
          assert record["experiment"]["final_release_eligible"] is False, record
          measurement = record["conversion_memory"]["measurement"]
          assert measurement["status"] == "measured_target_cgroup_v2", measurement
          assert measurement["memory_limit_bytes"] == 134217728000, measurement
          assert measurement["swap_limit_bytes"] == 0, measurement
          assert measurement["cgroup_peak_after_conversion_bytes"] <= 134217728000, measurement
          assert measurement["converter_child_maximum_resident_set_kib"] <= 131072000, measurement
          assert all("Stock-Control" in row["path"] and "Heretic" not in row["path"]
                     for row in record["output"]["shards"]), record
          print(json.dumps({"artifact_bytes": sum(row["size_bytes"] for row in record["output"]["shards"]),
                            "shards": len(record["output"]["shards"])}, sort_keys=True))
          PY
          python3 - "$output/qwen-quant-build-record.json" \
            "$workspace/evidence/control-${TARGET_SHA:0:12}.time.txt" \
            "$workspace/evidence/control-${TARGET_SHA:0:12}.measurement-attestation.json" <<'PY'
          import hashlib, json, pathlib, re, sys
          record_path, time_path, output_path = map(pathlib.Path, sys.argv[1:])
          time_text = time_path.read_text(encoding="utf-8")
          match = re.search(r"Maximum resident set size \(kbytes\): ([0-9]+)", time_text)
          if match is None:
              raise SystemExit("/usr/bin/time evidence lacks maximum RSS")
          outer_rss_kib = int(match.group(1))
          if outer_rss_kib > 131072000:
              raise SystemExit("successful conversion exceeded the 125 GiB RSS gate")
          digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          record = json.loads(record_path.read_text(encoding="utf-8"))
          payload = {
              "schema": "ember.qwen-conversion-memory-attestation.v1",
              "build_record_sha256": digest(record_path),
              "time_evidence_sha256": digest(time_path),
              "outer_maximum_resident_set_kib": outer_rss_kib,
              "recorded_cgroup_peak_bytes": record["conversion_memory"]["measurement"][
                  "cgroup_peak_after_conversion_bytes"],
              "memory_limit_bytes": 134217728000,
              "passed": True,
          }
          output_path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n",
                                 encoding="utf-8")
          PY
          mtp_dir="$workspace/artifacts/mtp-rocmi4-${TARGET_SHA:0:12}"
          mtp_artifact="$mtp_dir/Qwen3.8-Flash-Next-MTP-ROCmI4-Strix-Halo.gguf"
          python3 - "$mtp_dir/export.json" "$mtp_artifact" <<'PY'
          import json, os, sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          assert manifest["source_revision"] == "f5d08274bafd880402bd16f5e3e6c514136ec06c", manifest
          assert manifest["matrix_quant_contract"] == "Q4_0_ROCMI4", manifest
          assert manifest["runtime_status"] == "loadable quantized companion", manifest
          path = sys.argv[2]
          assert manifest["quantized_output"].endswith("/" + os.path.basename(path)), manifest
          assert os.path.isfile(path) and os.path.getsize(path) == manifest["quantized_bytes"], manifest
          print(json.dumps({"mtp_bytes": manifest["quantized_bytes"],
                            "mtp_sha256": manifest["quantized_sha256"]}, sort_keys=True))
          PY
          printf 'QWEN_CONTROL_OUTPUT=%s\n' "$output" >>"$GITHUB_ENV"
          printf 'QWEN_MTP_OUTPUT=%s\n' \
            "$mtp_artifact" >>"$GITHUB_ENV"

      - name: Remove a failed conversion container
        if: ${{ always() && steps.qwen-control-build.outputs.name != '' }}
        run: docker rm -f "${{ steps.qwen-control-build.outputs.name }}" >/dev/null 2>&1 || true

      - name: Unblock production
        if: ${{ always() && steps.qwen-control-exclusive.outputs.masked == 'yes' }}
        run: sudo -n /usr/local/sbin/ember-cert-production unmask

      - name: Restore production
        if: ${{ always() && steps.qwen-control-exclusive.outputs.restore == 'yes' }}
        run: sudo -n /usr/local/sbin/ember-cert-production start

      - name: Release the GPU lock
        if: ${{ always() && steps.qwen-control-exclusive.outputs.lock == 'yes' }}
        run: sudo -n /usr/local/sbin/ember-gpu-lock release

      - name: Remove temporary registry credentials
        if: ${{ always() && env.DOCKER_CONFIG != '' }}
        run: |
          rm -f -- "$DOCKER_CONFIG/config.json"
          rmdir -- "$DOCKER_CONFIG" 2>/dev/null || true

      - name: Record the bounded stock-control result
        if: ${{ success() }}
        run: |
          {
            echo '## Qwen stock-control conversion passed'
            echo
            echo "Ember SHA: \`$TARGET_SHA\`"
            echo "Output: \`$QWEN_CONTROL_OUTPUT\`"
            echo "Matching MTP: \`$QWEN_MTP_OUTPUT\`"
            echo
            echo 'This artifact is final-ineligible and exists only for activation capture and bakeoff.'
          } >>"$GITHUB_STEP_SUMMARY"

  qwen-capture-control:
    # Capture the 48x2560 stock-runtime activation directions from the pinned
    # OtherU 32+32 extraction corpus.  This consumes the persistent, exact-SHA
    # control pair built above and emits evidence plus the fixed 4x4 manifest
    # grid only: it does not quantize, select a winner, upload, or publish.
    if: startsWith(inputs.release_version, 'qwen-capture-control')
    runs-on: [self-hosted, linux, x64, gfx1151]
    timeout-minutes: 360
    env:
      TARGET_SHA: ${{ inputs.commit_sha }}
      CAPTURE_TOOL_SHA: ${{ github.sha }}
      QWEN_REVISION: f5d08274bafd880402bd16f5e3e6c514136ec06c
      OTHERU_REVISION: a3c6a728510f91394e991504951ac316cd3a89af
      CORPUS_CONTRACT_SHA256: 19c70ad1ce7664b58fbaa854f7a80bc50868873a89e44459002b634137d5cc1d
      GOOD_CORPUS_SHA256: a41997529ad28af7234e036f05bd9bca39c504f8ec118568b73699e9b314d140
      BAD_CORPUS_SHA256: a3bededd14b030fdf06562f6739f879838902f6f4691817573a98bbe9ac6cf7c
      CAPTURE_RECIPE_SHA256: f4d86525caa91067d427afc01c61cc0b097147cacea50232017be50e86179653
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Pull and bind the capture-runtime ROCm 10 development image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CAPTURE_TOOL_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CAPTURE_TOOL_SHA"
          git merge-base --is-ancestor "$TARGET_SHA" "$CAPTURE_TOOL_SHA"
          docker_config="$RUNNER_TEMP/qwen-capture-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$docker_config"
          export DOCKER_CONFIG="$docker_config"
          printf 'DOCKER_CONFIG=%s\n' "$docker_config" >>"$GITHUB_ENV"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}:dev-sha-${CAPTURE_TOOL_SHA:0:12}"
          docker pull "$image"
          inspect="$RUNNER_TEMP/qwen-capture-image-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          docker image inspect "$image" >"$inspect"
          embedded="$(docker run --rm --entrypoint /bin/sh "$image" -c \
            'awk -F= '\''$1 == "EMBER_CONFIGURED_GIT_HEAD:STRING" { print $2 }'\'' /ember/build-rocm/CMakeCache.txt')"
          test "$embedded" = "$CAPTURE_TOOL_SHA"
          docker run --rm --entrypoint /bin/sh "$image" -c \
            'test -x /usr/local/bin/ember-dflash && test -f /ember/scripts/qwen_capture_control.py'
          python3 - "$inspect" "$image" "$CAPTURE_TOOL_SHA" "$GITHUB_ENV" <<'PY'
          import json, re, sys
          inspect_path, image, revision, env_path = sys.argv[1:]
          rows = json.load(open(inspect_path, encoding="utf-8"))
          assert isinstance(rows, list) and len(rows) == 1, rows
          repository = image.rsplit(":", 1)[0]
          digests = sorted({item.split("@", 1)[1]
                            for item in rows[0].get("RepoDigests") or []
                            if item.startswith(repository + "@")})
          assert len(digests) == 1 and re.fullmatch(r"sha256:[0-9a-f]{64}", digests[0]), digests
          label = ((rows[0].get("Config") or {}).get("Labels") or {}).get(
              "org.opencontainers.image.revision")
          assert label in (None, "", revision), label
          with open(env_path, "a", encoding="utf-8") as stream:
              stream.write(f"QWEN_DEV_IMAGE={image}\n")
              stream.write(f"QWEN_DEV_IMAGE_DIGEST={digests[0]}\n")
          PY

      - name: Bind the persistent stock control and pinned corpus
        run: |
          set -euo pipefail
          workspace=/var/tmp/ember-qwen3.8-flash-next
          control_dir="$workspace/artifacts/stock-rocmi4-${TARGET_SHA:0:12}"
          mtp_dir="$workspace/artifacts/mtp-rocmi4-${TARGET_SHA:0:12}"
          corpus_dir="/srv/ember/qwen3.8-otheru-corpus-${OTHERU_REVISION:0:8}"
          control_record="$control_dir/qwen-quant-build-record.json"
          mtp_manifest="$mtp_dir/export.json"
          contract="$GITHUB_WORKSPACE/share/quant_eval/qwen3.8-otheru-corpus-contract.json"
          recipe="$GITHUB_WORKSPACE/share/quant_eval/qwen3.8-flash-next-bakeoff.json"
          for directory in "$workspace" "$control_dir" "$mtp_dir" "$corpus_dir"; do
            test -d "$directory" && test ! -L "$directory"
          done
          for file in "$control_record" "$mtp_manifest" "$contract" "$recipe" \
              "$corpus_dir/extraction-good.jsonl" "$corpus_dir/extraction-bad.jsonl"; do
            test -f "$file" && test ! -L "$file"
          done
          # A converter container owns these persistent outputs. If its outer
          # Docker invocation fails after the tools have atomically completed,
          # the ordinary host ownership handoff is skipped. Normalize only the
          # two exact artifact directories, rejecting links, nested directories,
          # and special files before changing any mode or owner.
          docker run --rm --network none \
            -e RUNNER_UID="$(id -u)" -e RUNNER_GID="$(id -g)" \
            -v "$control_dir:/control" -v "$mtp_dir:/mtp" \
            --entrypoint /usr/bin/python3 "$QWEN_DEV_IMAGE" -c '
          import os, pathlib, stat
          uid = int(os.environ["RUNNER_UID"]); gid = int(os.environ["RUNNER_GID"])
          for root in (pathlib.Path("/control"), pathlib.Path("/mtp")):
              root_stat = root.lstat()
              if not stat.S_ISDIR(root_stat.st_mode) or stat.S_ISLNK(root_stat.st_mode):
                  raise SystemExit(f"unsafe artifact directory: {root}")
              entries = list(root.iterdir())
              if not entries or len(entries) > 64:
                  raise SystemExit(f"unexpected artifact inventory size: {root}")
              for path in entries:
                  info = path.lstat()
                  if not stat.S_ISREG(info.st_mode) or stat.S_ISLNK(info.st_mode):
                      raise SystemExit(f"artifact entry is not a regular file: {path.name}")
              for path in entries:
                  os.chown(path, uid, gid, follow_symlinks=False)
                  os.chmod(path, 0o400, follow_symlinks=False)
              os.chown(root, uid, gid, follow_symlinks=False)
              os.chmod(root, 0o500, follow_symlinks=False)
          '
          # The protected source checkout is root-readable only. Stage exactly
          # the two digest-pinned extraction files for the unprivileged runner;
          # do not relax permissions on the authoritative corpus.
          source_corpus_dir="$corpus_dir"
          corpus_dir="$RUNNER_TEMP/qwen-capture-corpus-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$corpus_dir" && install -d -m 700 "$corpus_dir"
          printf 'QWEN_STAGED_CORPUS=%s\n' "$corpus_dir" >>"$GITHUB_ENV"
          docker run --rm --network none \
            -e RUNNER_UID="$(id -u)" -e RUNNER_GID="$(id -g)" \
            -v "$source_corpus_dir:/source:ro" -v "$corpus_dir:/staged" \
            --entrypoint /bin/sh "$QWEN_DEV_IMAGE" -c '
              set -eu
              for name in extraction-good.jsonl extraction-bad.jsonl; do
                test -f "/source/$name" && test ! -L "/source/$name"
                install -m 0400 -o "$RUNNER_UID" -g "$RUNNER_GID" \
                  "/source/$name" "/staged/$name"
              done
            '
          test "$(sha256sum "$contract" | awk '{print $1}')" = "$CORPUS_CONTRACT_SHA256"
          test "$(sha256sum "$recipe" | awk '{print $1}')" = "$CAPTURE_RECIPE_SHA256"
          test "$(sha256sum "$corpus_dir/extraction-good.jsonl" | awk '{print $1}')" = "$GOOD_CORPUS_SHA256"
          test "$(sha256sum "$corpus_dir/extraction-bad.jsonl" | awk '{print $1}')" = "$BAD_CORPUS_SHA256"
          artifact_env="$RUNNER_TEMP/qwen-capture-artifacts-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.env"
          python3 - "$control_record" "$control_dir" "$mtp_manifest" "$mtp_dir" \
              "$TARGET_SHA" "$artifact_env" <<'PY'
          import hashlib, json, os, pathlib, re, sys
          record_path = pathlib.Path(sys.argv[1])
          control_dir = pathlib.Path(sys.argv[2])
          mtp_manifest_path = pathlib.Path(sys.argv[3])
          mtp_dir = pathlib.Path(sys.argv[4])
          revision, env_path = sys.argv[5:]
          record = json.loads(record_path.read_text(encoding="utf-8"))
          experiment = record.get("experiment") or {}
          build = ((record.get("tools") or {}).get("quantizer_build_info") or {})
          assert record.get("status") == "complete" and record.get("mode") == "execute", record
          assert experiment.get("kind") == "stock_control", experiment
          assert experiment.get("stock_weights_unchanged") is True, experiment
          assert experiment.get("final_release_eligible") is False, experiment
          assert build.get("format") == "Q4_0_ROCMI4" and build.get("ggml_tensor_type") == 108, build
          assert build.get("ember_revision") == revision, build
          rows = (record.get("output") or {}).get("shards")
          assert isinstance(rows, list) and rows, rows
          names = []
          recorded_parent = None
          for index, row in enumerate(rows):
              recorded = pathlib.PurePosixPath(row.get("path", ""))
              assert recorded.is_absolute() and recorded.name == os.path.basename(str(recorded)), row
              assert re.fullmatch(r"[A-Za-z0-9._-]+", recorded.name), row
              assert isinstance(row.get("size_bytes"), int) and row["size_bytes"] > 0, row
              assert re.fullmatch(r"[0-9a-f]{64}", row.get("sha256", "")), row
              assert recorded.parent == recorded_parent or recorded_parent is None, row
              recorded_parent = recorded.parent
              local = control_dir / recorded.name
              assert local.is_file() and not local.is_symlink(), local
              assert local.stat().st_size == row["size_bytes"], (local, row)
              assert recorded.name not in names, row
              names.append(recorded.name)
          first = control_dir / names[0]
          mtp = json.loads(mtp_manifest_path.read_text(encoding="utf-8"))
          assert mtp.get("source_revision") == "f5d08274bafd880402bd16f5e3e6c514136ec06c", mtp
          assert mtp.get("matrix_quant_contract") == "Q4_0_ROCMI4", mtp
          assert mtp.get("runtime_status") == "loadable quantized companion", mtp
          mtp_name = pathlib.PurePosixPath(mtp.get("quantized_output", "")).name
          assert mtp_name == "Qwen3.8-Flash-Next-MTP-ROCmI4-Strix-Halo.gguf", mtp
          mtp_path = mtp_dir / mtp_name
          assert mtp_path.is_file() and not mtp_path.is_symlink(), mtp_path
          assert mtp_path.stat().st_size == mtp.get("quantized_bytes"), mtp
          assert re.fullmatch(r"[0-9a-f]{64}", mtp.get("quantized_sha256", "")), mtp
          record_sha = hashlib.sha256(record_path.read_bytes()).hexdigest()
          with open(env_path, "a", encoding="utf-8") as stream:
              stream.write(f"QWEN_CONTROL_MODEL={first}\n")
              stream.write(f"QWEN_CONTROL_MODEL_EXPECTED_SHA256={rows[0]['sha256']}\n")
              stream.write(f"QWEN_CONTROL_RECORD={record_path}\n")
              stream.write(f"QWEN_CONTROL_RECORD_SHA256={record_sha}\n")
              stream.write(f"QWEN_MTP_MODEL={mtp_path}\n")
              stream.write(f"QWEN_MTP_EXPECTED_SHA256={mtp['quantized_sha256']}\n")
          PY
          source "$artifact_env"
          cat "$artifact_env" >>"$GITHUB_ENV"
          direct_sha256() {
            dd if="$1" iflag=direct bs=8M status=none | sha256sum | awk '{print $1}'
          }
          model_sha="$(direct_sha256 "$QWEN_CONTROL_MODEL")"
          mtp_sha="$(direct_sha256 "$QWEN_MTP_MODEL")"
          test "$model_sha" = "$QWEN_CONTROL_MODEL_EXPECTED_SHA256"
          test "$mtp_sha" = "$QWEN_MTP_EXPECTED_SHA256"
          output="$workspace/evidence/qwen-capture-control-${TARGET_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$output" && test ! -L "$output"
          printf 'QWEN_CONTROL_MODEL_SHA256=%s\n' "$model_sha" >>"$GITHUB_ENV"
          printf 'QWEN_MTP_SHA256=%s\n' "$mtp_sha" >>"$GITHUB_ENV"
          printf 'QWEN_CAPTURE_OUTPUT=%s\n' "$output" >>"$GITHUB_ENV"
          printf 'QWEN_CORPUS_DIR=%s\n' "$corpus_dir" >>"$GITHUB_ENV"

      - name: Record production recovery intent
        id: qwen-capture-safety
        run: |
          set -euo pipefail
          echo 'restore=no' >>"$GITHUB_OUTPUT"
          if sudo -n /usr/local/sbin/ember-cert-production is-active >/dev/null 2>&1; then
            echo 'restore=yes' >>"$GITHUB_OUTPUT"
          fi
          echo 'armed=yes' >>"$GITHUB_OUTPUT"

      - name: Capture stock activations and deterministic intervention manifests
        run: |
          set -euo pipefail
          python3 scripts/qwen_capture_control.py \
            --tool-revision "$CAPTURE_TOOL_SHA" \
            --artifact-revision "$TARGET_SHA" \
            --image "$QWEN_DEV_IMAGE" \
            --image-digest "$QWEN_DEV_IMAGE_DIGEST" \
            --binary /usr/local/bin/ember-dflash \
            --model "$QWEN_CONTROL_MODEL" \
            --model-sha256 "$QWEN_CONTROL_MODEL_SHA256" \
            --control-record "$QWEN_CONTROL_RECORD" \
            --control-record-sha256 "$QWEN_CONTROL_RECORD_SHA256" \
            --mtp "$QWEN_MTP_MODEL" \
            --mtp-sha256 "$QWEN_MTP_SHA256" \
            --corpus-dir "$QWEN_CORPUS_DIR" \
            --corpus-contract-sha256 "$CORPUS_CONTRACT_SHA256" \
            --good-corpus-sha256 "$GOOD_CORPUS_SHA256" \
            --bad-corpus-sha256 "$BAD_CORPUS_SHA256" \
            --recipe-sha256 "$CAPTURE_RECIPE_SHA256" \
            --output-dir "$QWEN_CAPTURE_OUTPUT"
          python3 - "$QWEN_CAPTURE_OUTPUT/capture-manifest.json" "$TARGET_SHA" \
              "$CAPTURE_TOOL_SHA" "$QWEN_DEV_IMAGE_DIGEST" <<'PY'
          import json, os, sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          assert manifest["status"] == "complete", manifest
          assert manifest["publishes"] is False and manifest["stock_rocmi4_only"] is True, manifest
          assert manifest["capture_tool"]["ember_revision"] == os.environ["CAPTURE_TOOL_SHA"], manifest
          assert manifest["model"]["quantizer_ember_revision"] == sys.argv[2], manifest
          assert manifest["image"]["ember_revision"] == sys.argv[3], manifest
          assert manifest["image"]["digest"] == sys.argv[4], manifest
          assert manifest["mtp"]["verified"] is True, manifest
          assert manifest["mtp"]["loaded_during_capture"] is False, manifest
          assert manifest["corpus"]["rows"] == {"good": 32, "bad": 32}, manifest
          assert len(manifest["interventions"]) == 16, manifest
          PY
          capture_manifest="$QWEN_CAPTURE_OUTPUT/capture-manifest.json"
          printf 'QWEN_CAPTURE_MANIFEST=%s\nQWEN_CAPTURE_MANIFEST_SHA256=%s\n' \
            "$capture_manifest" "$(sha256sum "$capture_manifest" | awk '{print $1}')" \
            >>"$GITHUB_ENV"

      - name: Report retained activation-container failure log
        if: ${{ failure() && env.QWEN_CAPTURE_OUTPUT != '' }}
        run: |
          set -euo pipefail
          log="$QWEN_CAPTURE_OUTPUT/activation-container.log"
          if [[ ! -e "$log" ]]; then
            echo 'No retained activation-container log was produced.'
            exit 0
          fi
          [[ -f "$log" && ! -L "$log" ]] || {
            echo 'Refusing a non-regular or symlinked activation-container log.' >&2
            exit 1
          }
          bytes="$(stat -c %s -- "$log")"
          [[ "$bytes" =~ ^[0-9]+$ ]] || exit 1
          echo "::group::Last activation-container log bytes ($bytes total)"
          tail -c 1048576 -- "$log"
          echo
          echo '::endgroup::'

      - name: Recover production and release the GPU lock
        if: ${{ always() && steps.qwen-capture-safety.outputs.armed == 'yes' }}
        run: |
          state="$QWEN_CAPTURE_OUTPUT"
          if [[ -e "$state/.gpu-lock-held" || -e "$state/.production-masked" ]]; then
            while IFS= read -r container; do
              name="$(docker inspect --format '{{.Name}}' "$container" 2>/dev/null || true)"
              if [[ "$name" =~ ^/qwen-capture-control-[0-9]+$ ]]; then
                docker rm -f "$container" >/dev/null 2>&1 || true
              fi
            done < <(docker ps -aq --filter name=qwen-capture-control- 2>/dev/null || true)
          fi
          if [[ -e "$state/.production-masked" ]]; then
            sudo -n /usr/local/sbin/ember-cert-production unmask || true
          fi
          if [[ -e "$state/.production-was-active" ]]; then
            sudo -n /usr/local/sbin/ember-cert-production start || true
          fi
          if [[ -e "$state/.gpu-lock-held" ]]; then
            sudo -n /usr/local/sbin/ember-gpu-lock release || true
          fi

      - name: Remove temporary registry credentials
        if: ${{ always() && env.DOCKER_CONFIG != '' }}
        run: |
          rm -f -- "$DOCKER_CONFIG/config.json"
          rmdir -- "$DOCKER_CONFIG" 2>/dev/null || true

      - name: Remove the run-scoped corpus copy
        if: ${{ always() && env.QWEN_STAGED_CORPUS != '' }}
        run: |
          set -euo pipefail
          expected="$RUNNER_TEMP/qwen-capture-corpus-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test "$QWEN_STAGED_CORPUS" = "$expected"
          test -d "$expected" && test ! -L "$expected"
          rm -f -- "$expected/extraction-good.jsonl" "$expected/extraction-bad.jsonl"
          rmdir -- "$expected"

      - name: Record the stock activation-capture result
        if: ${{ success() }}
        run: |
          {
            echo '## Qwen stock activation capture passed'
            echo
            echo "Ember SHA: \`$TARGET_SHA\`"
            echo "Image digest: \`$QWEN_DEV_IMAGE_DIGEST\`"
            echo "Evidence: \`$QWEN_CAPTURE_OUTPUT\`"
            echo "Capture manifest: \`$QWEN_CAPTURE_MANIFEST\`"
            echo "Capture manifest SHA-256: \`$QWEN_CAPTURE_MANIFEST_SHA256\`"
            echo "Stock build record: \`$QWEN_CONTROL_RECORD\`"
            echo "Stock build record SHA-256: \`$QWEN_CONTROL_RECORD_SHA256\`"
            echo
            echo 'Generated 16 unselected intervention manifests. No artifact was quantized or published.'
          } >>"$GITHUB_STEP_SUMMARY"
