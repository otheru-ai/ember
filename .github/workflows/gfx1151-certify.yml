name: gfx1151 certification

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA whose sha-* image will be certified
        required: true
        type: string
      model_path:
        description: Absolute path to the pinned GGUF on the runner host
        required: true
        type: string
      prompt_path:
        description: Absolute path to a non-sensitive prompt that generates at least one DSpark block
        required: true
        type: string
      disk_prompt_path:
        description: Absolute path to a non-sensitive prompt containing at least 512 model tokens
        required: true
        type: string
      draft_model_path:
        description: Absolute path to the pinned DSpark draft GGUF
        required: true
        type: string
      port:
        description: Unused loopback port for the generation smoke test
        required: true
        default: '18080'
        type: string
      release_version:
        description: Optional YEAR.M.D override; defaults to the current UTC date
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: gfx1151-certification
  cancel-in-progress: false

jobs:
  certify:
    # Configure this environment with required reviewers. Never expose this
    # runner to pull_request jobs: the container receives direct GPU access.
    environment: gfx1151-certification
    runs-on: [self-hosted, linux, x64, gfx1151]
    timeout-minutes: 180
    steps:
      - name: Validate operator inputs and devices
        env:
          TARGET_SHA: ${{ inputs.commit_sha }}
          MODEL_PATH: ${{ inputs.model_path }}
          PROMPT_PATH: ${{ inputs.prompt_path }}
          DISK_PROMPT_PATH: ${{ inputs.disk_prompt_path }}
          DRAFT_PATH: ${{ inputs.draft_model_path }}
          PORT: ${{ inputs.port }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MODEL_PATH" = /* && -f "$MODEL_PATH" ]]
          [[ "$PROMPT_PATH" = /* && -f "$PROMPT_PATH" ]]
          [[ "$DISK_PROMPT_PATH" = /* && -f "$DISK_PROMPT_PATH" ]]
          [[ "$DRAFT_PATH" = /* && -f "$DRAFT_PATH" ]]
          [[ "$PORT" =~ ^[0-9]+$ ]] && (( PORT >= 1024 && PORT <= 65535 ))
          [[ -r /dev/kfd && -d /dev/dri ]]
          command -v docker >/dev/null
          command -v curl >/dev/null
          command -v python3 >/dev/null
          if curl --fail --silent --max-time 2 \
              "http://127.0.0.1:$PORT/health" >/dev/null 2>&1; then
            echo "port $PORT already serves an HTTP health endpoint"
            exit 1
          fi

      - name: Log in to GHCR and pull the exact candidate
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${TARGET_SHA:0:12}"
          docker pull "$image"
          revision="$(docker image inspect --format \
            '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")"
          test "$revision" = "$TARGET_SHA" || {
            echo "candidate label identifies $revision, not $TARGET_SHA"
            exit 1
          }

      - name: Verify the model artifact
        env:
          MODEL_PATH: ${{ inputs.model_path }}
          MODEL_SHA256: a936e0a514385c8ae964c0f42263a4314a34fbc6efea9d9aced5320f320a3d54
          DRAFT_PATH: ${{ inputs.draft_model_path }}
          DRAFT_SHA256: 1a01c80eceae302bcc1d70836759ee97974d7983c5084ef43f6ef772a8970ae6
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$MODEL_SHA256" "$MODEL_PATH" |
            sha256sum --check --strict
          printf '%s  %s\n' "$DRAFT_SHA256" "$DRAFT_PATH" |
            sha256sum --check --strict

      - name: Run HIP GEMM and generation differential validators
        env:
          TARGET_SHA: ${{ inputs.commit_sha }}
          MODEL_PATH: ${{ inputs.model_path }}
          PROMPT_PATH: ${{ inputs.prompt_path }}
          DISK_PROMPT_PATH: ${{ inputs.disk_prompt_path }}
          DRAFT_PATH: ${{ inputs.draft_model_path }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${TARGET_SHA:0:12}"
          gpu_args=(
            --device /dev/kfd --device /dev/dri
            --group-add video --group-add render
            --ipc host --security-opt seccomp=unconfined
            --ulimit memlock=-1:-1
          )
          docker run --rm "${gpu_args[@]}" \
            --entrypoint /usr/local/bin/ember-dflash "$image" \
            --validate-gemm-batch 64

          model_dir="$(dirname -- "$MODEL_PATH")"
          model_file="$(basename -- "$MODEL_PATH")"
          prompt_dir="$(dirname -- "$PROMPT_PATH")"
          prompt_file="$(basename -- "$PROMPT_PATH")"
          disk_prompt_dir="$(dirname -- "$DISK_PROMPT_PATH")"
          disk_prompt_file="$(basename -- "$DISK_PROMPT_PATH")"
          mounts=(
            -v "$model_dir:/cert-model:ro"
            -v "$prompt_dir:/cert-prompt:ro"
            -v "$disk_prompt_dir:/cert-disk-prompt:ro"
          )
          draft_dir="$(dirname -- "$DRAFT_PATH")"
          draft_file="$(basename -- "$DRAFT_PATH")"
          mounts+=(-v "$draft_dir:/cert-draft:ro")
          env_args=(
            -e DFLASH_DS4_SPEC=1
            -e "DFLASH_DS4_DRAFT=/cert-draft/$draft_file"
          )
          cache_volume="ember-cert-validator-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker volume create "$cache_volume" >/dev/null
          cleanup_validator() { docker volume rm -f "$cache_volume" >/dev/null 2>&1 || true; }
          trap cleanup_validator EXIT
          spec_report="$(docker run --rm "${gpu_args[@]}" "${mounts[@]}" "${env_args[@]}" \
            -v "$cache_volume:/cache" \
            --entrypoint /usr/local/bin/ember-dflash "$image" \
            -m "/cert-model/$model_file" \
            --kv-cache-dir /cache \
            --ds4-prefill exact \
            --batch-sessions 2 \
            --validate-prompt "/cert-prompt/$prompt_file" \
            --validate-tokens 32)"
          printf '%s\n' "$spec_report"
          python3 -c '
          import json, sys
          report = json.load(sys.stdin)
          assert report["ok"] and report["snapshot_ok"], report
          assert report["batch"]["checked"] and report["batch"]["exact"], report
          assert report["spec"]["checked"] and report["spec"]["exact"], report
          ' <<<"$spec_report"

          disk_report="$(docker run --rm "${gpu_args[@]}" "${mounts[@]}" \
            -v "$cache_volume:/cache" \
            --entrypoint /usr/local/bin/ember-dflash "$image" \
            -m "/cert-model/$model_file" \
            --kv-cache-dir /cache \
            --ds4-prefill exact \
            --validate-prompt "/cert-disk-prompt/$disk_prompt_file" \
            --validate-tokens 16)"
          printf '%s\n' "$disk_report"
          python3 -c '
          import json, sys
          report = json.load(sys.stdin)
          assert report["ok"] and report["snapshot_ok"], report
          assert report["disk"]["checked"] and report["disk"]["exact"], report
          ' <<<"$disk_report"

      - name: Run end-to-end generation smoke test
        env:
          TARGET_SHA: ${{ inputs.commit_sha }}
          MODEL_PATH: ${{ inputs.model_path }}
          DRAFT_PATH: ${{ inputs.draft_model_path }}
          PORT: ${{ inputs.port }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${TARGET_SHA:0:12}"
          name="ember-cert-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cache_volume="$name-cache"
          docker volume create "$cache_volume" >/dev/null
          cleanup_server() {
            docker rm -f "$name" >/dev/null 2>&1 || true
            docker volume rm -f "$cache_volume" >/dev/null 2>&1 || true
          }
          trap cleanup_server EXIT
          model_target=/models/DeepSeek-V4-Flash-0731-Abliterated-ROCMFPx-Strix-Lean-2.58bpw.gguf
          draft_target=/models/DeepSeek-V4-Flash-0731-Abliterated-DSpark-draft-4.25bpw.gguf
          mounts=(-v "$MODEL_PATH:$model_target:ro" -v "$cache_volume:/cache")
          env_args=(
            -e "EMBER_PORT=$PORT"
          )
          mounts+=(-v "$DRAFT_PATH:$draft_target:ro")
          docker run -d --name "$name" --network host \
            --device /dev/kfd --device /dev/dri \
            --group-add video --group-add render \
            --ipc host --security-opt seccomp=unconfined \
            --ulimit memlock=-1:-1 \
            "${mounts[@]}" "${env_args[@]}" "$image" \
            --ds4-prefill exact --batch-sessions 1 >/dev/null

          ready=0
          for _ in $(seq 1 240); do
            if curl --fail --silent --max-time 5 \
                "http://127.0.0.1:$PORT/health" >/dev/null; then
              ready=1
              break
            fi
            running="$(docker inspect --format '{{.State.Running}}' "$name")"
            if [[ "$running" != true ]]; then
              docker logs "$name"
              exit 1
            fi
            sleep 5
          done
          [[ "$ready" = 1 ]] || { docker logs "$name"; exit 1; }
          response="$(curl --fail --silent --show-error --max-time 300 \
            -H 'Content-Type: application/json' \
            -d '{"model":"deepseek-v4-flash","messages":[{"role":"user","content":"Reply briefly that Ember is ready."}],"max_tokens":128,"temperature":0,"top_p":1,"top_k":0,"stream":false}' \
            "http://127.0.0.1:$PORT/v1/chat/completions")"
          printf '%s\n' "$response"
          python3 -c '
          import json, sys
          response = json.load(sys.stdin)
          message = response["choices"][0]["message"]
          assert message.get("content") or message.get("reasoning_content"), response
          assert response["usage"]["backend"]["spec_ran"] is True, response
          ' <<<"$response"

      - name: Record certification result
        env:
          TARGET_SHA: ${{ inputs.commit_sha }}
        run: |
          {
            echo '## gfx1151 certification passed'
            echo
            echo "Certified source SHA: \`$TARGET_SHA\`"
            echo
            echo 'Release promotion will now generate the changelog and tag automatically.'
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Promote certified candidate
    needs: certify
    runs-on: [self-hosted, ember-builder]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Generate release metadata and publish the source-of-truth tag
        env:
          TARGET_SHA: ${{ inputs.commit_sha }}
          REQUESTED_VERSION: ${{ inputs.release_version }}
          RELEASE_AUTOMATION_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          FORGEJO_RELEASE_SSH_KEY: ${{ secrets.FORGEJO_RELEASE_SSH_KEY }}
          FORGEJO_SSH_HOST_KEYS: ${{ secrets.FORGEJO_SSH_HOST_KEYS }}
          FORGEJO_RELEASE_REMOTE: ${{ vars.FORGEJO_RELEASE_REMOTE }}
        run: |
          set -euo pipefail
          test "$(git rev-parse 'HEAD^{commit}')" = "$TARGET_SHA"
          test "$(git rev-parse 'origin/main^{commit}')" = "$TARGET_SHA" || {
            echo 'main advanced after certification began; certify the new tip instead'
            exit 1
          }
          test -n "$RELEASE_AUTOMATION_TOKEN"
          test -n "$FORGEJO_RELEASE_SSH_KEY"
          test -n "$FORGEJO_SSH_HOST_KEYS"
          test -n "$FORGEJO_RELEASE_REMOTE"

          version="${REQUESTED_VERSION:-$(date -u +%Y.%-m.%-d)}"
          python3 ci/release_changelog.py prepare --version "$version"

          mapfile -t changed < <(git diff --name-only | sort)
          expected=(CHANGELOG.md VERSION compose.yaml)
          test "${changed[*]}" = "${expected[*]}" || {
            printf 'release preparation changed unexpected files: %s\n' "${changed[*]}"
            exit 1
          }

          git config user.name ember-release
          git config user.email release@otheru.ai
          git add CHANGELOG.md VERSION compose.yaml
          git commit -m "chore(release): v$version"
          release_sha="$(git rev-parse HEAD)"
          tag="v$version"
          git tag -a "$tag" -m "Ember $version" \
            -m "Certified-Parent: $TARGET_SHA"

          # The tag publisher treats this repository variable as the
          # authoritative record of which executable tree passed on gfx1151.
          payload="$(CERTIFIED_SHA="$TARGET_SHA" python3 -c \
            'import json, os; print(json.dumps({"name":"EMBER_GFX1151_CERTIFIED_SHA","value":os.environ["CERTIFIED_SHA"]}))')"
          curl --fail --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer $RELEASE_AUTOMATION_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/variables/EMBER_GFX1151_CERTIFIED_SHA"

          ssh_dir="$RUNNER_TEMP/ember-release-ssh-$GITHUB_RUN_ID"
          cleanup() {
            rm -f -- "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
            rmdir -- "$ssh_dir" 2>/dev/null || true
          }
          trap cleanup EXIT
          umask 077
          mkdir "$ssh_dir"
          printf '%s\n' "$FORGEJO_RELEASE_SSH_KEY" >"$ssh_dir/id_ed25519"
          printf '%s\n' "$FORGEJO_SSH_HOST_KEYS" >"$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$ssh_dir/known_hosts"
          test "$(git ls-remote "$FORGEJO_RELEASE_REMOTE" refs/heads/main | cut -f1)" = "$TARGET_SHA"
          test -z "$(git ls-remote "$FORGEJO_RELEASE_REMOTE" "refs/tags/$tag")" || {
            echo "$tag already exists on Forgejo"
            exit 1
          }
          git push --atomic "$FORGEJO_RELEASE_REMOTE" \
            "HEAD:refs/heads/main" "refs/tags/$tag:refs/tags/$tag"

          {
            echo '## Release promoted'
            echo
            echo "Version: \`$version\`"
            echo "Certified source: \`$TARGET_SHA\`"
            echo "Release commit: \`$release_sha\`"
            echo "Tag: \`$tag\`"
          } >> "$GITHUB_STEP_SUMMARY"
