name: Release notes

on:
  workflow_run:
    workflows: [Container]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag whose successful recovered image publish needs release notes
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-notes-${{ inputs.release_tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       startsWith(inputs.release_tag, 'v')) ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.release_tag || github.event.workflow_run.head_sha }}
          fetch-depth: 1
      - name: Create the GitHub release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          version="$(tr -d '\n' < VERSION)"
          test "$RELEASE_TAG" = "v$version"
          notes="$RUNNER_TEMP/ember-release-notes.md"
          python3 ci/release_changelog.py notes --version "$version" >"$notes"
          gh release create "$RELEASE_TAG" \
            --verify-tag --title "Ember $version" --notes-file "$notes"
