name: Release notes

on:
  workflow_run:
    workflows: [Container]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: release-notes-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
      - name: Create the GitHub release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          version="$(tr -d '\n' < VERSION)"
          test "$RELEASE_TAG" = "v$version"
          notes="$RUNNER_TEMP/ember-release-notes.md"
          python3 ci/release_changelog.py notes --version "$version" >"$notes"
          gh release create "$RELEASE_TAG" \
            --verify-tag --title "Ember $version" --notes-file "$notes"
