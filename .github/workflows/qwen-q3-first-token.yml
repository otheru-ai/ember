name: Qwen Q3 PLE first-token proof

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
      candidate_id:
        required: true
        type: string
      construction_descriptor:
        required: true
        type: string
      construction_descriptor_sha256:
        required: true
        type: string
    outputs:
      q3_hardware:
        value: ${{ jobs.first-token.outputs.q3_hardware }}
      q3_hardware_sha256:
        value: ${{ jobs.first-token.outputs.q3_hardware_sha256 }}

permissions:
  contents: read
  packages: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: qwen-q3-first-token-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  first-token:
    runs-on: [self-hosted, linux, x64, gfx1151]
    timeout-minutes: 1440
    outputs:
      q3_hardware: ${{ steps.handoff.outputs.q3_hardware }}
      q3_hardware_sha256: ${{ steps.handoff.outputs.q3_hardware_sha256 }}
    env:
      TARGET_SHA: ${{ inputs.commit_sha }}
      CANDIDATE_ID: ${{ inputs.candidate_id }}
      CONSTRUCTION_DESCRIPTOR: ${{ inputs.construction_descriptor }}
      CONSTRUCTION_DESCRIPTOR_SHA256: ${{ inputs.construction_descriptor_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Bind the exact Q3 candidate, FAST MTP, runtime image, and output
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_ID" =~ ^q3-ple-first-token-[0-9a-f]{12}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --quiet --exit-code
          [[ "$CONSTRUCTION_DESCRIPTOR" = /* && -f "$CONSTRUCTION_DESCRIPTOR" && ! -L "$CONSTRUCTION_DESCRIPTOR" ]]
          [[ "$CONSTRUCTION_DESCRIPTOR_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum "$CONSTRUCTION_DESCRIPTOR" | awk '{print $1}')" = "$CONSTRUCTION_DESCRIPTOR_SHA256"
          mapfile -t bound < <(python3 - "$CONSTRUCTION_DESCRIPTOR" "$CANDIDATE_ID" \
              "$TARGET_SHA" <<'PY'
          import hashlib, json, pathlib, re, sys
          descriptor_path, candidate_id, revision = sys.argv[1:]
          descriptor = json.loads(pathlib.Path(descriptor_path).read_text())
          if (descriptor.get("schema") != "ember.qwen3.8.candidate-construction.v1"
                  or descriptor.get("status") != "complete"
                  or descriptor.get("publishes") is not False
                  or descriptor.get("deletes") is not False
                  or descriptor.get("candidate_id") != candidate_id
                  or descriptor.get("kind") != "intervention"
                  or descriptor.get("intended_stage") != "format"
                  or descriptor.get("intervention_configuration_id") != "lambda-0.25-band-10-42"
                  or descriptor.get("quantization_arm") != "rocmfp4-fast-matrix-q3-ple-q6k-embedding-head"
                  or descriptor.get("mtp_matrix_quant_contract") != "Q4_0_ROCMFP4_FAST"
                  or descriptor.get("runtime_mode") != "exact_dequant"
                  or re.fullmatch(r"[0-9a-f]{40}",
                                  str(descriptor.get("builder_revision", ""))) is None
                  or descriptor.get("runtime_revision") != revision):
              raise SystemExit("construction descriptor is not the exact nonpublishing Q3 smoke candidate")
          def exact(item, label):
              if (not isinstance(item, dict) or set(item) != {"path", "sha256"}
                      or re.fullmatch(r"[0-9a-f]{64}", str(item.get("sha256", ""))) is None):
                  raise SystemExit(f"{label} descriptor is malformed")
              path = pathlib.Path(item["path"])
              if not path.is_absolute() or not path.is_file() or path.is_symlink():
                  raise SystemExit(f"{label} is not one absolute regular file")
              if hashlib.sha256(path.read_bytes()).hexdigest() != item["sha256"]:
                  raise SystemExit(f"{label} digest differs")
              return path
          record_path = exact(descriptor.get("build_record"), "build record")
          attestation_path = exact(descriptor.get("builder_attestation"), "builder attestation")
          record = json.loads(record_path.read_text())
          recipe = record.get("quantization_recipe") or {}
          if (record.get("status") != "complete" or record.get("mode") != "execute"
                  or recipe.get("id") != descriptor["quantization_arm"]
                  or set(recipe.get("formats") or []) != {
                      "Q3_0_ROCMFPX", "Q4_0_ROCMFP4_FAST", "Q6_K"}):
              raise SystemExit("build record does not prove the exact three-format Q3 recipe")
          rows = (record.get("output") or {}).get("shards")
          if not isinstance(rows, list) or not rows:
              raise SystemExit("build record has no ordered target shards")
          recorded = descriptor.get("artifacts") or {}
          if rows != recorded.get("shards"):
              raise SystemExit("construction and build-record shard inventories differ")
          total = 0
          for index, row in enumerate(rows):
              path = pathlib.Path(row.get("path", ""))
              if (not path.is_absolute() or not path.is_file() or path.is_symlink()
                      or path.stat().st_size != row.get("size_bytes")
                      or re.fullmatch(r"[0-9a-f]{64}", str(row.get("sha256", ""))) is None):
                  raise SystemExit(f"target shard {index} metadata differs")
              total += row["size_bytes"]
          if total != recorded.get("total_bytes"):
              raise SystemExit("target shard byte total differs")
          companion_desc = (descriptor.get("shared_companions") or {}).get("Q4_0_ROCMFP4_FAST")
          companion_path = exact(companion_desc, "FAST companion inventory")
          companion = json.loads(companion_path.read_text())
          mtp_rows = [row for row in companion.get("companions", [])
                      if row.get("role") == "mtp" and row.get("enabled") is True]
          if (len(mtp_rows) != 1
                  or mtp_rows[0].get("matrix_quant_contract") != "Q4_0_ROCMFP4_FAST"):
              raise SystemExit("FAST companion inventory lacks one matching MTP")
          mtp = pathlib.Path(mtp_rows[0].get("path", ""))
          if (not mtp.is_absolute() or not mtp.is_file() or mtp.is_symlink()
                  or mtp.stat().st_size != mtp_rows[0].get("size_bytes")
                  or re.fullmatch(r"[0-9a-f]{64}", str(mtp_rows[0].get("sha256", ""))) is None):
              raise SystemExit("matching MTP artifact metadata differs")
          runtime = ((descriptor.get("images") or {}).get("runtime") or {})
          if set(runtime) != {"release_ref", "release_digest", "dev_ref", "dev_digest",
                              "tensor_format_contract_sha256"}:
              raise SystemExit("runtime image descriptor differs")
          image = runtime["release_ref"]; digest = runtime["release_digest"]
          if (re.fullmatch(r"ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}", image) is None
                  or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None
                  or not image.endswith("@" + digest)):
              raise SystemExit("runtime image is not one exact digest reference")
          print(rows[0]["path"]); print(rows[0]["sha256"])
          print(record_path); print(hashlib.sha256(record_path.read_bytes()).hexdigest())
          print(attestation_path); print(hashlib.sha256(attestation_path.read_bytes()).hexdigest())
          print(mtp); print(mtp_rows[0]["sha256"])
          print(image); print(digest)
          print(runtime["dev_ref"]); print(runtime["dev_digest"])
          print(total)
          PY
          )
          (( ${#bound[@]} == 13 ))
          names=(MODEL MODEL_SHA256 BUILD_RECORD BUILD_RECORD_SHA256 BUILDER_ATTESTATION \
                 BUILDER_ATTESTATION_SHA256 MTP MTP_SHA256 RUNTIME_IMAGE RUNTIME_IMAGE_DIGEST \
                 RUNTIME_DEV_IMAGE RUNTIME_DEV_IMAGE_DIGEST MODEL_TOTAL_BYTES)
          for index in "${!names[@]}"; do
            printf -v "${names[$index]}" '%s' "${bound[$index]}"
            export "${names[$index]}"
            printf '%s=%s\n' "${names[$index]}" "${bound[$index]}" >>"$GITHUB_ENV"
          done
          docker_config="$RUNNER_TEMP/qwen-q3-first-token-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          install -d -m 700 "$docker_config"
          export DOCKER_CONFIG="$docker_config"
          printf 'DOCKER_CONFIG=%s\n' "$docker_config" >>"$GITHUB_ENV"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          docker pull "$RUNTIME_IMAGE"
          docker image inspect "$RUNTIME_IMAGE" | python3 -c \
            'import json,sys; e=sys.argv[1]; d=json.load(sys.stdin)[0].get("RepoDigests",[]); raise SystemExit(0 if any(x.endswith("@"+e) for x in d) else 1)' \
            "$RUNTIME_IMAGE_DIGEST"
          docker pull "$RUNTIME_DEV_IMAGE"
          docker image inspect "$RUNTIME_DEV_IMAGE" | python3 -c \
            'import json,sys; e=sys.argv[1]; d=json.load(sys.stdin)[0].get("RepoDigests",[]); raise SystemExit(0 if any(x.endswith("@"+e) for x in d) else 1)' \
            "$RUNTIME_DEV_IMAGE_DIGEST"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$RUNTIME_IMAGE")" = "$TARGET_SHA"
          engine_sha="$(docker run --rm --entrypoint sha256sum "$RUNTIME_IMAGE" \
            /usr/local/bin/ember-dflash | awk '{print $1}')"
          [[ "$engine_sha" =~ ^[0-9a-f]{64}$ ]]
          output=/var/tmp/ember-qwen3.8-flash-next/artifacts/qwen-workset/evidence/first-token
          if [[ ! -e "$output" && ! -L "$output" ]]; then
            mkdir -m 700 "$output"
          fi
          test -d "$output" && test ! -L "$output"
          run_output="$output/q3-ple-${TARGET_SHA:0:12}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$run_output" && test ! -L "$run_output"
          mkdir -m 700 "$run_output"
          printf 'RUNTIME_ENGINE_SHA256=%s\nQWEN_FIRST_TOKEN_OUTPUT=%s\n' \
            "$engine_sha" "$run_output" >>"$GITHUB_ENV"

      - name: Run the complete Q3 real-weight benchmark
        run: |
          set -euo pipefail
          benchmark_output="$QWEN_FIRST_TOKEN_OUTPUT/full-benchmark"
          timeout --signal=TERM --kill-after=15m 120m \
            scripts/qwen_real_weight_gate.sh \
            --image "$RUNTIME_IMAGE" --image-digest "$RUNTIME_IMAGE_DIGEST" \
            --profile-image "$RUNTIME_DEV_IMAGE" \
            --profile-image-digest "$RUNTIME_DEV_IMAGE_DIGEST" \
            --model "$MODEL" --model-sha256 "$MODEL_SHA256" \
            --model-build-record "$BUILD_RECORD" \
            --model-build-record-sha256 "$BUILD_RECORD_SHA256" \
            --mtp "$MTP" --mtp-sha256 "$MTP_SHA256" --mtp-depth 3 \
            --integrity-cache "/var/tmp/ember-qwen3.8-flash-next/artifacts/qwen-workset/evidence/.artifact-integrity-v1.json" \
            --measurement-only --out-dir "$benchmark_output"
          evidence="$benchmark_output/hardware-measured.json"
          test -f "$evidence" && test ! -L "$evidence"
          printf 'QWEN_Q3_BENCHMARK_EVIDENCE=%s\nQWEN_Q3_BENCHMARK_EVIDENCE_SHA256=%s\n' \
            "$evidence" "$(sha256sum "$evidence" | awk '{print $1}')" >>"$GITHUB_ENV"

      - name: Derive first-token evidence from the full differential
        run: |
          set -euo pipefail
          python3 scripts/qwen_first_token_evidence.py \
            --root "$QWEN_FIRST_TOKEN_OUTPUT" \
            --ember-revision "$TARGET_SHA" --candidate-id "$CANDIDATE_ID" \
            --construction-descriptor "$CONSTRUCTION_DESCRIPTOR" \
            --construction-descriptor-sha256 "$CONSTRUCTION_DESCRIPTOR_SHA256" \
            --model "$MODEL" --model-sha256 "$MODEL_SHA256" \
            --model-total-bytes "$MODEL_TOTAL_BYTES" \
            --mtp "$MTP" --mtp-sha256 "$MTP_SHA256" --mtp-depth 3 \
            --runtime-image "$RUNTIME_IMAGE" \
            --runtime-image-digest "$RUNTIME_IMAGE_DIGEST" \
            --runtime-engine-sha256 "$RUNTIME_ENGINE_SHA256"
          evidence="$QWEN_FIRST_TOKEN_OUTPUT/first-token-evidence.json"
          printf 'QWEN_FIRST_TOKEN_EVIDENCE=%s\nQWEN_FIRST_TOKEN_EVIDENCE_SHA256=%s\n' \
            "$evidence" "$(sha256sum "$evidence" | awk '{print $1}')" >>"$GITHUB_ENV"

      - name: Surface retained first-token diagnostics
        if: ${{ failure() && env.QWEN_FIRST_TOKEN_OUTPUT != '' }}
        run: |
          set -euo pipefail
          for name in full-benchmark/differential.json \
                      full-benchmark/differential-decode-comparison.json \
                      full-benchmark/differential-dispatch-server.log \
                      full-benchmark/timing.jsonl \
                      full-benchmark/timing-server.log \
                      full-benchmark/timing-server-failure.log; do
            path="$QWEN_FIRST_TOKEN_OUTPUT/$name"
            if [[ -f "$path" && ! -L "$path" ]]; then
              printf '===== %s (%s bytes) =====\n' "$name" "$(stat -c %s -- "$path")"
              tail -n 1024 -- "$path"
            else
              printf '===== %s was not created =====\n' "$name"
            fi
          done

      - name: Attest the first-token evidence
        if: success()
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-path: ${{ env.QWEN_FIRST_TOKEN_EVIDENCE }}

      - name: Retain and verify the first-token attestation
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          bundle="$QWEN_FIRST_TOKEN_OUTPUT/first-token-evidence.sigstore.json"
          install -m 0600 -- "$ACTION_BUNDLE" "$bundle"
          gh attestation verify "$QWEN_FIRST_TOKEN_EVIDENCE" --bundle "$bundle" \
            --repo OtherU-AI/ember \
            --signer-workflow OtherU-AI/ember/.github/workflows/qwen-q3-first-token.yml \
            --source-digest "$TARGET_SHA" --signer-digest "$TARGET_SHA" >/dev/null
          printf 'QWEN_FIRST_TOKEN_BUNDLE=%s\nQWEN_FIRST_TOKEN_BUNDLE_SHA256=%s\n' \
            "$bundle" "$(sha256sum "$bundle" | awk '{print $1}')" >>"$GITHUB_ENV"

      - name: Attest the complete Q3 benchmark evidence
        if: success()
        id: attest_benchmark
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-path: ${{ env.QWEN_Q3_BENCHMARK_EVIDENCE }}

      - name: Retain and verify the Q3 benchmark attestation
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION_BUNDLE: ${{ steps.attest_benchmark.outputs.bundle-path }}
        run: |
          set -euo pipefail
          bundle="$QWEN_FIRST_TOKEN_OUTPUT/full-benchmark/hardware-measured.sigstore.json"
          install -m 0600 -- "$ACTION_BUNDLE" "$bundle"
          gh attestation verify "$QWEN_Q3_BENCHMARK_EVIDENCE" --bundle "$bundle" \
            --repo OtherU-AI/ember \
            --signer-workflow OtherU-AI/ember/.github/workflows/qwen-q3-first-token.yml \
            --source-digest "$TARGET_SHA" --signer-digest "$TARGET_SHA" >/dev/null
          printf 'QWEN_Q3_BENCHMARK_BUNDLE=%s\nQWEN_Q3_BENCHMARK_BUNDLE_SHA256=%s\n' \
            "$bundle" "$(sha256sum "$bundle" | awk '{print $1}')" >>"$GITHUB_ENV"

      - name: Remove temporary registry credentials
        if: always() && env.DOCKER_CONFIG != ''
        run: |
          rm -f -- "$DOCKER_CONFIG/config.json"
          rmdir -- "$DOCKER_CONFIG" 2>/dev/null || true

      - name: Record the measured first-token handoff
        id: handoff
        if: success()
        run: |
          first="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["generation"]["first_token_id"])' \
            "$QWEN_FIRST_TOKEN_EVIDENCE")"
          mapfile -t metrics < <(python3 - "$QWEN_Q3_BENCHMARK_EVIDENCE" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          performance = value["hard_gates"]["performance"]
          resources = value["resources"]
          diagnostic = value["differential_decode"]
          diagnostic_mtp = diagnostic["mtp"]
          print(performance["prefill_2048"]["peak_tps"])
          print(performance["prefill_2048"]["median_tps"])
          print(performance["decode_256_counting"]["median_tps"])
          print(resources["measured_peak_uma_bytes"])
          print(str(value["passed"]).lower())
          print(value["speculation"]["accept_rate_mean"])
          print(diagnostic["ar"]["tokens_per_second"])
          print(diagnostic_mtp["warm_fresh_tokens_per_second"])
          print(diagnostic_mtp["accept_rate"])
          print(diagnostic_mtp["warm_speedup_vs_ar"])
          PY
          )
          (( ${#metrics[@]} == 10 ))
          printf 'q3_hardware=%s\nq3_hardware_sha256=%s\n' \
            "$QWEN_Q3_BENCHMARK_EVIDENCE" \
            "$QWEN_Q3_BENCHMARK_EVIDENCE_SHA256" >>"$GITHUB_OUTPUT"
          {
            echo '## Qwen Q3 PLE differential and full benchmark completed'
            echo
            echo "First sampled token ID: \`$first\`"
            echo "Prefill peak/median: \`${metrics[0]} / ${metrics[1]} tok/s\`"
            echo "Decode median: \`${metrics[2]} tok/s\`"
            echo "Measured peak UMA: \`${metrics[3]} bytes\`"
            echo "Existing release thresholds passed: \`${metrics[4]}\`"
            echo "Clean benchmark MTP acceptance: \`${metrics[5]}\`"
            echo "Same-process AR decode: \`${metrics[6]} tok/s\`"
            echo "Same-process warm MTP decode: \`${metrics[7]} tok/s\`"
            echo "Same-process MTP acceptance: \`${metrics[8]}\`"
            echo "Same-process warm MTP speedup over AR: \`${metrics[9]}x\`"
            echo "Evidence: \`$QWEN_FIRST_TOKEN_EVIDENCE\`"
            echo "Evidence SHA-256: \`$QWEN_FIRST_TOKEN_EVIDENCE_SHA256\`"
            echo "Attestation: \`$QWEN_FIRST_TOKEN_BUNDLE\`"
            echo "Attestation SHA-256: \`$QWEN_FIRST_TOKEN_BUNDLE_SHA256\`"
            echo "Benchmark evidence: \`$QWEN_Q3_BENCHMARK_EVIDENCE\`"
            echo "Benchmark evidence SHA-256: \`$QWEN_Q3_BENCHMARK_EVIDENCE_SHA256\`"
            echo "Benchmark attestation: \`$QWEN_Q3_BENCHMARK_BUNDLE\`"
            echo "Benchmark attestation SHA-256: \`$QWEN_Q3_BENCHMARK_BUNDLE_SHA256\`"
            echo 'Scope: exact differential, unprofiled timing, peak runner memory, and separate trace/PMC passes; no publication.'
          } >>"$GITHUB_STEP_SUMMARY"

      # Preserve completed measurement work even if a later Sigstore handoff
      # fails.  The disk snapshot is intentionally excluded: it is large,
      # reconstructable, and not part of the evidence contract.
      - name: Upload bounded Q3 hardware evidence
        if: ${{ always() && env.QWEN_FIRST_TOKEN_OUTPUT != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qwen-q3-hardware-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.QWEN_FIRST_TOKEN_OUTPUT }}/first-token-evidence.json
            ${{ env.QWEN_FIRST_TOKEN_OUTPUT }}/first-token-evidence.sigstore.json
            ${{ env.QWEN_FIRST_TOKEN_OUTPUT }}/full-benchmark/*.json
            ${{ env.QWEN_FIRST_TOKEN_OUTPUT }}/full-benchmark/*.jsonl
            ${{ env.QWEN_FIRST_TOKEN_OUTPUT }}/full-benchmark/*.log
            ${{ env.QWEN_FIRST_TOKEN_OUTPUT }}/full-benchmark/*.txt
            ${{ env.QWEN_FIRST_TOKEN_OUTPUT }}/full-benchmark/profile/**
          if-no-files-found: warn
          retention-days: 30
