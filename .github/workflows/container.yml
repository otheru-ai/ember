name: Container

on:
  push:
    tags: ['v*']
  workflow_call:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing certified tag to republish after infrastructure failure
        required: false
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  # Reading this workflow run history is how a tag proves it was certified on
  # gfx1151. See "Verify checkout, version, and hardware certification".
  actions: read

concurrency:
  # One persistent BuildKit instance owns the large ROCm and compiler caches.
  # Serialize all refs so a tag cannot race its candidate on that builder.
  group: ember-container-builder
  cancel-in-progress: false

jobs:
  source-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          fetch-depth: 2
      - name: Restore compiler cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ccache
          key: ember-ccache-linux-x64-Release-${{ github.sha }}
          restore-keys: ember-ccache-linux-x64-Release-
      - name: Verify and test the publish commit
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          else
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache libturbojpeg0-dev python3-yaml
          python3 ci/check_invariants.py
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DEMBER_STRICT=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j"$(nproc)"
          ccache --show-stats
          ctest --test-dir build --output-on-failure --timeout 120

  release-image:
    needs: source-gate
    # GitHub's paid 8-core Ubuntu larger runner provides 32 GB RAM and 300 GB
    # disk, enough for the pinned ROCm toolchain and release image closure.
    # Larger runners need a Team or Enterprise Cloud plan. On any other plan the
    # label is unsatisfiable and the job queues silently until GitHub cancels it
    # at 24h -- this is exactly how the v2026.8.10 publish was lost. Set the
    # repository variable EMBER_BUILD_RUNNER to a self-hosted builder label
    # (>=200 GiB free, Docker + Buildx) when larger runners are unavailable.
    runs-on: ${{ vars.EMBER_BUILD_RUNNER || 'ubuntu-latest-8-cores' }}
    # Fail in hours rather than burning a day against a missing runner.
    timeout-minutes: 180
    steps:
      - name: Quiet expected exact-SHA checkout advice
        run: |
          if git -C "$GITHUB_WORKSPACE" rev-parse --git-dir >/dev/null 2>&1; then
            git -C "$GITHUB_WORKSPACE" config advice.detachedHead false
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          # Tag releases verify the metadata-only commit and its certified
          # parent, so both commits must be present locally.
          fetch-depth: 2

      - name: Verify checkout, version, and hardware certification
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          publish_sha="$(git rev-parse HEAD)"
          if [[ -n "$RELEASE_TAG" ]]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$publish_sha" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          else
            test "$publish_sha" = "$GITHUB_SHA"
          fi
          project_version="$(tr -d '\n' < VERSION)"
          printf '%s\n' "$project_version" | grep -Eq \
            '^[0-9]{4}\.([1-9]|1[0-2])\.([1-9]|[12][0-9]|3[01])$'
          publish_tag="$RELEASE_TAG"
          case "$GITHUB_REF" in
            refs/tags/*) publish_tag="$GITHUB_REF_NAME" ;;
          esac
          if [[ -n "$publish_tag" ]]; then
              test "$publish_tag" = "v$project_version" || {
                echo "tag $publish_tag does not match VERSION v$project_version"
                exit 1
              }
              parent_line="$(git rev-list --parents -n 1 "$publish_sha")"
              test "$(wc -w <<<"$parent_line")" -eq 2 || {
                echo 'release commit must have exactly one parent'
                exit 1
              }
              release_parent="$(git rev-parse "$publish_sha^")"
              # Certification is proven from this repository's own run
              # history, not from a value someone wrote into a repository
              # variable. A variable says only that a credential with
              # actions:write set a string; run history records that the
              # certify job itself reached a successful conclusion for this
              # exact commit, which whoever pushes a tag cannot fabricate. It
              # also removes the long-lived release PAT, because GITHUB_TOKEN
              # already carries actions:read.
              #
              # Match the JOB, not the run: promotion runs after certification
              # and can fail on its own, leaving a red run over a green gate.
              certified=""
              runs_api="repos/$GITHUB_REPOSITORY/actions/runs"
              for run_id in $(gh api \
                  "$runs_api?head_sha=$release_parent&per_page=50" \
                  --jq '.workflow_runs[].id'); do
                if gh api "$runs_api/$run_id/jobs?per_page=100" \
                    --jq '.jobs[] | select(.name | endswith("certify")) | .conclusion' \
                    | grep -qx success; then
                  certified="$run_id"
                  break
                fi
              done
              test -n "$certified" || {
                echo "no successful gfx1151 certification job for $release_parent"
                exit 1
              }
              mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$publish_sha" | sort)
              expected=(CHANGELOG.md compose.yaml VERSION)
              test "${changed[*]}" = "${expected[*]}" || {
                printf 'release commit changed executable inputs: %s\n' "${changed[*]}"
                exit 1
              }
          fi

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Reuse persistent Buildx builder
        # The docker-container driver is required for --provenance/--sbom, but it
        # puts BuildKit on the default bridge. Give it the host network namespace
        # so the build still reaches the package mirrors on runners where bridge
        # networking is unavailable; this does not affect build output.
        env:
          BUILDER_NAME: ${{ vars.EMBER_BUILDX_BUILDER || 'ember-release' }}
        run: |
          if ! docker buildx inspect "$BUILDER_NAME" >/dev/null 2>&1; then
            docker buildx create \
              --name "$BUILDER_NAME" \
              --driver docker-container \
              --driver-opt network=host
          fi
          docker buildx use "$BUILDER_NAME"
          docker buildx inspect --bootstrap

      - name: Build and publish minimal release image
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          publish_sha="$(git rev-parse HEAD)"
          short_sha="${publish_sha:0:12}"
          project_version="$(tr -d '\n' < VERSION)"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag_args=(
            --tag "$image:sha-$short_sha"
          )
          publish_tag="$RELEASE_TAG"
          case "$GITHUB_REF" in
            refs/tags/*) publish_tag="$GITHUB_REF_NAME" ;;
          esac
          if [[ -n "$publish_tag" ]]; then
            version="$project_version"
            tag_args+=(--tag "$image:$version" --tag "$image:latest")
          else
            version="dev-$short_sha"
            tag_args+=(--tag "$image:$version")
          fi
          docker buildx build \
            --platform linux/amd64 \
            --target release \
            --build-arg EMBER_VERSION="$version" \
            --build-arg EMBER_VCS_REF="$publish_sha" \
            "${tag_args[@]}" \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file image-metadata.json \
            --output type=registry,compression=gzip,compression-level=9,force-compression=true \
            -f docker/Dockerfile .

      - name: Publish the matching ROCm development and profiler image
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          publish_sha="$(git rev-parse HEAD)"
          short_sha="${publish_sha:0:12}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          # This is the exact dev stage cached by the release build above.  The
          # A real-weight gate additionally compares its embedded CMake SHA
          # and ember-dflash bytes against the release image before taking the
          # GPU lock, so a merely similarly tagged profiler cannot qualify.
          docker buildx build \
            --platform linux/amd64 \
            --target dev \
            --build-arg EMBER_VERSION="dev-$short_sha" \
            --build-arg EMBER_VCS_REF="$publish_sha" \
            --tag "$image:dev-sha-$short_sha" \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file dev-image-metadata.json \
            --output type=registry,compression=gzip,compression-level=9,force-compression=true \
            -f docker/Dockerfile .

      - name: Verify the image can run its own vision gate
        run: |
          set -euo pipefail
          # The behavioural gate ships inside the image and only ever runs on
          # the GPU box, after production has been quiesced. That makes a
          # missing interpreter or import a fifteen-minute outage to discover,
          # which is what python3-minimal cost on 2026-09-03: it ships the
          # interpreter without the standard library, so the gate died on
          # "No module named 'json'". Import it here, on a hosted runner,
          # before the box is ever involved.
          publish_sha="$(git rev-parse HEAD)"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${publish_sha:0:12}"
          docker pull "$image"
          docker run --rm --entrypoint python3 "$image" \
            /opt/ember/vision-gate/gate.py --help >/dev/null
          # --help exits before any policy is read, so also prove the pinned
          # policy is present and is the file the runner expects.
          docker run --rm --entrypoint python3 "$image" -c '
          import hashlib, sys
          raw = open("/opt/ember/vision-gate/policy-v4.json", "rb").read()
          sys.path.insert(0, "/opt/ember/vision-gate")
          import importlib.util
          spec = importlib.util.spec_from_file_location(
              "gate", "/opt/ember/vision-gate/gate.py")
          gate = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(gate)
          digest = hashlib.sha256(raw).hexdigest()
          assert digest == gate.POLICY_SHA256, (digest, gate.POLICY_SHA256)
          print("vision gate policy in image:", digest)
          '

      - name: Report digest, size, and vulnerability scan
        run: |
          set -euo pipefail
          python3 -c 'import json; d=json.load(open("image-metadata.json")); print(d.get("containerimage.digest", d))'
          python3 -c 'import json; d=json.load(open("dev-image-metadata.json")); print(d.get("containerimage.digest", d))'
          publish_sha="$(git rev-parse HEAD)"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${publish_sha:0:12}"
          docker pull "$image"
          docker image inspect --format \
            'release image: {{.Size}} bytes (uncompressed)' "$image"
          docker run --rm \
            --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ember-trivy-cache:/root/.cache/trivy \
            aquasec/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            image --image-src docker --exit-code 1 \
            --severity CRITICAL --ignore-unfixed "$image"
