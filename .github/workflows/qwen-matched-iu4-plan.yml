name: Qwen matched IU4 construction plan

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
      q3_construction:
        required: true
        type: string
      q3_construction_sha256:
        required: true
        type: string
      q3_hardware:
        required: true
        type: string
      q3_hardware_sha256:
        required: true
        type: string
      candidate_id:
        required: true
        type: string
      construction_request_output:
        required: true
        type: string
    outputs:
      operation_request:
        value: ${{ jobs.plan.outputs.operation_request }}
      operation_request_sha256:
        value: ${{ jobs.plan.outputs.operation_request_sha256 }}

permissions:
  contents: read

concurrency:
  group: qwen-matched-iu4-plan-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: [self-hosted, linux, x64, gfx1151]
    timeout-minutes: 15
    outputs:
      operation_request: ${{ steps.plan.outputs.operation_request }}
      operation_request_sha256: ${{ steps.plan.outputs.operation_request_sha256 }}
    env:
      TARGET_SHA: ${{ inputs.commit_sha }}
      Q3_CONSTRUCTION: ${{ inputs.q3_construction }}
      Q3_CONSTRUCTION_SHA256: ${{ inputs.q3_construction_sha256 }}
      Q3_HARDWARE: ${{ inputs.q3_hardware }}
      Q3_HARDWARE_SHA256: ${{ inputs.q3_hardware_sha256 }}
      IU4_CANDIDATE_ID: ${{ inputs.candidate_id }}
      CONSTRUCTION_REQUEST_OUTPUT: ${{ inputs.construction_request_output }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Derive one IU4 request from complete Q3 hardware evidence
        id: plan
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$Q3_CONSTRUCTION_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$Q3_HARDWARE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$IU4_CANDIDATE_ID" =~ ^[a-z0-9][a-z0-9._-]{0,63}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --quiet --exit-code
          python3 scripts/qwen_quant_comparison.py plan-matched-iu4 \
            --q3-construction "$Q3_CONSTRUCTION" \
            --q3-construction-sha256 "$Q3_CONSTRUCTION_SHA256" \
            --q3-hardware "$Q3_HARDWARE" --q3-hardware-sha256 "$Q3_HARDWARE_SHA256" \
            --candidate-id "$IU4_CANDIDATE_ID" --runtime-revision "$TARGET_SHA" \
            --output "$CONSTRUCTION_REQUEST_OUTPUT"
          request_sha="$(sha256sum "$CONSTRUCTION_REQUEST_OUTPUT" | awk '{print $1}')"
          [[ "$request_sha" =~ ^[0-9a-f]{64}$ ]]
          printf 'operation_request=%s\noperation_request_sha256=%s\n' \
            "$CONSTRUCTION_REQUEST_OUTPUT" "$request_sha" >>"$GITHUB_OUTPUT"

      - name: Summarize the gated matched-IU4 handoff
        run: |
          {
            echo '## Matched IU4 construction authorized by complete Q3 evidence'
            echo
            echo "Candidate: \`$IU4_CANDIDATE_ID\`"
            echo "Q3 hardware evidence: \`$Q3_HARDWARE\`"
            echo "Construction request: \`${{ steps.plan.outputs.operation_request }}\`"
            echo "Construction request SHA-256: \`${{ steps.plan.outputs.operation_request_sha256 }}\`"
            echo 'The planning job acquired no GPU and made no publication or deletion claim.'
          } >>"$GITHUB_STEP_SUMMARY"
