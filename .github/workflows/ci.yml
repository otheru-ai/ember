name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEBIAN_FRONTEND: noninteractive
  CCACHE_COMPRESS: 'true'
  CCACHE_MAXSIZE: 1G

jobs:
  invariants:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Check repository invariants
        run: python3 ci/check_invariants.py
      - name: Lint GitHub Actions workflows
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml

  build-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Restore compiler cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ccache
          key: ember-ccache-linux-x64-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: ember-ccache-linux-x64-${{ matrix.build_type }}-
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ccache cmake python3
      - name: Configure strict ${{ matrix.build_type }} build
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DEMBER_STRICT=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          cmake --build build -j"$(nproc)"
          ccache --show-stats
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Restore compiler cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ccache
          key: ember-ccache-linux-x64-asan-${{ github.sha }}
          restore-keys: ember-ccache-linux-x64-asan-
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ccache cmake python3
      - name: Configure ASan, UBSan, and LSan
        run: |
          cmake -S . -B build-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: |
          cmake --build build-asan -j"$(nproc)"
          ccache --show-stats
      - name: Test under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure --timeout 300

  analyzer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install analyzers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cppcheck
      - name: GCC analyzer
        run: |
          for f in src/common/*.c src/model/*.c src/server/*.c src/backend/backend_stub.c; do
            gcc -fanalyzer -c -o /dev/null -std=c11 -Wall -Wextra -Werror \
              -Isrc -D_GNU_SOURCE "$f"
          done
      - name: cppcheck
        run: |
          cppcheck --enable=warning,portability --inline-suppr --std=c11 \
            --error-exitcode=1 --suppress=missingIncludeSystem \
            -I src src/common src/model src/server src/backend/backend_stub.c

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Restore compiler cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ccache
          key: ember-ccache-linux-x64-coverage-${{ github.sha }}
          restore-keys: ember-ccache-linux-x64-coverage-
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache cmake gcc-13 g++-13 python3
      - name: Configure coverage build
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          cmake -S . -B build-cov \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_FLAGS="--coverage -O0 -g" \
            -DCMAKE_CXX_FLAGS="--coverage -O0 -g" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"
      - name: Build
        run: |
          cmake --build build-cov -j"$(nproc)"
          ccache --show-stats
      - name: Test
        run: ctest --test-dir build-cov --output-on-failure --timeout 300
      - name: Enforce per-file coverage floors
        run: python3 ci/coverage.py --build build-cov --gcov gcov-13

  scope:
    # Publishing a candidate and certifying it takes the gfx1151 box for about
    # two hours and quiesces production for the duration. That is the right
    # price for a change to the engine and the wrong one for a change to a
    # documentation page, which cannot alter the image being certified.
    #
    # Anything not explicitly recognised as documentation counts as code, so a
    # new top-level path errs towards certifying rather than silently skipping.
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - id: classify
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != push ] || [ -z "${BEFORE:-}" ] \
             || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo 'no usable base commit; treating as code'
            echo 'code=true' >>"$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
          printf 'changed files:\n%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -qvE '^(docs/|README\.md$|AGENTS\.md$|ARCHITECTURE\.md$|CLAUDE\.md$|CHANGELOG\.md$|LICENSE$)'; then
            echo 'code=true' >>"$GITHUB_OUTPUT"
          else
            echo 'documentation only; skipping candidate publication and certification'
            echo 'code=false' >>"$GITHUB_OUTPUT"
          fi

  publish-candidate:
    # A mirrored main commit reaches GHCR only after every public CI gate has
    # passed. The called workflow repeats the compact source gate against the
    # exact publish SHA before building the expensive ROCm image.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release):') && needs.scope.outputs.code == 'true' }}
    needs: [invariants, build-test, sanitizers, analyzer, coverage, scope]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/container.yml

  certify-and-release:
    # Only a trusted main push can reach this point. The reusable container
    # workflow has already published and scanned the immutable sha-* candidate.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release):') && needs.scope.outputs.code == 'true' }}
    needs: [publish-candidate, scope]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/gfx1151-certify.yml
    with:
      commit_sha: ${{ github.sha }}
    secrets: inherit
