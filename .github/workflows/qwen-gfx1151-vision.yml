name: Qwen gfx1151 real-weight vision certification

on:
  workflow_call:
    inputs:
      ember_revision:
        required: true
        type: string
      runtime_image:
        required: true
        type: string
      runtime_dev_image:
        required: true
        type: string
      model:
        required: true
        type: string
      model_sha256:
        required: true
        type: string
      model_build_record:
        required: true
        type: string
      model_build_record_sha256:
        required: true
        type: string
      mtp:
        required: true
        type: string
      mtp_sha256:
        required: true
        type: string
      mtp_depth:
        required: true
        type: string
      mmproj:
        required: true
        type: string
      mmproj_sha256:
        required: true
        type: string
      vision_vocab:
        required: true
        type: string
      vision_vocab_sha256:
        required: true
        type: string
      output:
        required: true
        type: string
    outputs:
      evidence_path:
        value: ${{ jobs.certify-vision.outputs.evidence_path }}
      evidence_sha256:
        value: ${{ jobs.certify-vision.outputs.evidence_sha256 }}
      attestation_path:
        value: ${{ jobs.certify-vision.outputs.attestation_path }}
      attestation_sha256:
        value: ${{ jobs.certify-vision.outputs.attestation_sha256 }}
  workflow_dispatch:
    inputs:
      ember_revision:
        description: Exact 40-character Ember runtime revision
        required: true
        type: string
      runtime_image:
        description: Immutable release image (repository@sha256)
        required: true
        type: string
      runtime_dev_image:
        description: Immutable matching dev image (repository@sha256)
        required: true
        type: string
      model:
        description: Absolute first-shard path in the protected Qwen workset
        required: true
        type: string
      model_sha256:
        description: First-shard SHA-256
        required: true
        type: string
      model_build_record:
        description: Absolute completed quant build record
        required: true
        type: string
      model_build_record_sha256:
        description: Quant build-record SHA-256
        required: true
        type: string
      mtp:
        description: Absolute matching MTP path
        required: true
        type: string
      mtp_sha256:
        description: Matching MTP SHA-256
        required: true
        type: string
      mtp_depth:
        description: Certified MTP proposal depth
        required: true
        type: number
      mmproj:
        description: Absolute BF16 mmproj path
        required: true
        type: string
      mmproj_sha256:
        description: BF16 mmproj SHA-256
        required: true
        type: string
      vision_vocab:
        description: Absolute matching vocab-only GGUF path
        required: true
        type: string
      vision_vocab_sha256:
        description: Vocab-only GGUF SHA-256
        required: true
        type: string
      output:
        description: New evidence directory under the fixed Qwen workset evidence root
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  # Avoid queuing a reusable call behind the dispatcher that already owns the
  # global gfx1151 group; direct dispatches still serialize globally.
  group: ${{ contains(github.workflow_ref, '/.github/workflows/gfx1151-certify.yml@') && format('qwen-vision-called-{0}', github.run_id) || 'gfx1151-certification' }}
  cancel-in-progress: false

jobs:
  certify-vision:
    if: github.repository == 'OtherU-AI/ember'
    runs-on: [self-hosted, linux, x64, gfx1151]
    timeout-minutes: 240
    outputs:
      evidence_path: ${{ steps.attestation.outputs.evidence_path }}
      evidence_sha256: ${{ steps.attestation.outputs.evidence_sha256 }}
      attestation_path: ${{ steps.attestation.outputs.attestation_path }}
      attestation_sha256: ${{ steps.attestation.outputs.attestation_sha256 }}
    env:
      TARGET_SHA: ${{ inputs.ember_revision }}
      RUNTIME_IMAGE: ${{ inputs.runtime_image }}
      RUNTIME_DEV_IMAGE: ${{ inputs.runtime_dev_image }}
      MODEL: ${{ inputs.model }}
      MODEL_SHA256: ${{ inputs.model_sha256 }}
      BUILD_RECORD: ${{ inputs.model_build_record }}
      BUILD_RECORD_SHA256: ${{ inputs.model_build_record_sha256 }}
      MTP: ${{ inputs.mtp }}
      MTP_SHA256: ${{ inputs.mtp_sha256 }}
      MTP_DEPTH: ${{ inputs.mtp_depth }}
      MMPROJ: ${{ inputs.mmproj }}
      MMPROJ_SHA256: ${{ inputs.mmproj_sha256 }}
      VISION_VOCAB: ${{ inputs.vision_vocab }}
      VISION_VOCAB_SHA256: ${{ inputs.vision_vocab_sha256 }}
      WORKSET_ROOT: /var/tmp/ember-qwen3.8-flash-next/artifacts/qwen-workset
      OUTPUT: ${{ inputs.output }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ember_revision }}
          persist-credentials: false

      - name: Validate the immutable workset request
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --quiet --exit-code
          [[ "$RUNTIME_IMAGE" =~ ^[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]]
          [[ "$RUNTIME_DEV_IMAGE" =~ ^[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]]
          [[ "$MTP_DEPTH" =~ ^[1-4]$ ]]
          python3 - "$WORKSET_ROOT" "$OUTPUT" "$MODEL" "$BUILD_RECORD" "$MTP" "$MMPROJ" "$VISION_VOCAB" <<'PY'
          import pathlib, sys
          named_root=pathlib.Path(sys.argv[1])
          if (not named_root.is_absolute() or named_root.is_symlink()
                  or not named_root.is_dir()):
              raise SystemExit("fixed Qwen workset is absent or symlinked")
          root=named_root.resolve(strict=True)
          named_evidence=named_root / "evidence"
          if named_evidence.is_symlink() or not named_evidence.is_dir():
              raise SystemExit("fixed evidence root is absent or symlinked")
          evidence=named_evidence.resolve(strict=True)
          try: evidence.relative_to(root)
          except ValueError: raise SystemExit("fixed evidence root escapes workset")
          output=pathlib.Path(sys.argv[2])
          if (not output.is_absolute() or output.exists() or output.is_symlink()
                  or output.parent.is_symlink() or not output.parent.is_dir()
                  or output.parent.resolve(strict=True) != evidence
                  or not output.name.startswith("vision-")):
              raise SystemExit("vision output is not a new direct evidence child")
          for raw in sys.argv[3:]:
              path=pathlib.Path(raw)
              if not path.is_absolute() or path.is_symlink() or not path.is_file():
                  raise SystemExit(f"unsafe artifact input: {path}")
              try: path.resolve().relative_to(root)
              except ValueError: raise SystemExit(f"artifact escapes fixed workset: {path}")
          PY

      - name: Run the exclusive image-text and residency gate
        id: gate
        run: |
          set -euo pipefail
          scripts/qwen_vision_real_weight_gate.sh \
            --image "$RUNTIME_IMAGE" --dev-image "$RUNTIME_DEV_IMAGE" \
            --model "$MODEL" --model-sha256 "$MODEL_SHA256" \
            --model-build-record "$BUILD_RECORD" \
            --model-build-record-sha256 "$BUILD_RECORD_SHA256" \
            --mtp "$MTP" --mtp-sha256 "$MTP_SHA256" --mtp-depth "$MTP_DEPTH" \
            --mmproj "$MMPROJ" --mmproj-sha256 "$MMPROJ_SHA256" \
            --vision-vocab "$VISION_VOCAB" --vision-vocab-sha256 "$VISION_VOCAB_SHA256" \
            --out-dir "$OUTPUT"
          evidence="$OUTPUT/vision-certified.json"
          digest="$(sha256sum "$evidence" | awk '{print $1}')"
          python3 scripts/qwen_vision_differential.py verify \
            --evidence "$evidence" --evidence-sha256 "$digest" \
            --expected-ember-revision "$TARGET_SHA"
          printf 'output=%s\nsha256=%s\n' "$OUTPUT" "$digest" >>"$GITHUB_OUTPUT"

      - name: GitHub-attest the exact vision evidence
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-path: ${{ steps.gate.outputs.output }}/vision-certified.json

      - name: Retain and independently verify the vision attestation
        id: attestation
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          EVIDENCE_DIR: ${{ steps.gate.outputs.output }}
          EVIDENCE_SHA256: ${{ steps.gate.outputs.sha256 }}
        run: |
          set -euo pipefail
          set +x
          subject="$EVIDENCE_DIR/vision-certified.json"
          bundle="$EVIDENCE_DIR/vision-certified.sigstore.json"
          [[ "$ACTION_BUNDLE" = /* && -f "$ACTION_BUNDLE" && ! -L "$ACTION_BUNDLE" ]]
          test ! -e "$bundle"
          install -m 0600 -- "$ACTION_BUNDLE" "$bundle"
          test "$(sha256sum "$subject" | awk '{print $1}')" = "$EVIDENCE_SHA256"
          gh attestation verify "$subject" --bundle "$bundle" --repo OtherU-AI/ember \
            --signer-workflow OtherU-AI/ember/.github/workflows/qwen-gfx1151-vision.yml \
            --source-digest "$TARGET_SHA" --signer-digest "$TARGET_SHA" >/dev/null
          bundle_sha="$(sha256sum "$bundle" | awk '{print $1}')"
          python3 - "$EVIDENCE_DIR/vision-attestation-provenance.json" "$subject" \
            "$EVIDENCE_SHA256" "$bundle" "$bundle_sha" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$TARGET_SHA" <<'PY'
          import json,pathlib,sys
          out,subject,subject_sha,bundle,bundle_sha,run_id,attempt,revision=sys.argv[1:]
          value={"schema":"ember.qwen3.8.vision-attestation-provenance.v1",
                 "subject":{"path":str(pathlib.Path(subject).resolve()),"sha256":subject_sha},
                 "bundle":{"path":str(pathlib.Path(bundle).resolve()),"sha256":bundle_sha},
                 "repository":"OtherU-AI/ember",
                 "signer_workflow":"OtherU-AI/ember/.github/workflows/qwen-gfx1151-vision.yml",
                 "source_digest":revision,"signer_digest":revision,
                 "github_run_id":int(run_id),"github_run_attempt":int(attempt),"verified":True}
          pathlib.Path(out).write_text(json.dumps(value,indent=2,sort_keys=True)+"\n")
          PY
          printf 'evidence_path=%s\nevidence_sha256=%s\nattestation_path=%s\nattestation_sha256=%s\n' \
            "$subject" "$EVIDENCE_SHA256" "$bundle" "$bundle_sha" >>"$GITHUB_OUTPUT"

      - name: Summarize exact protected-runner evidence
        if: success()
        env:
          OUTPUT: ${{ steps.gate.outputs.output }}
          EVIDENCE_SHA256: ${{ steps.gate.outputs.sha256 }}
        run: |
          set -euo pipefail
          python3 - "$OUTPUT/vision-certified.json" "$EVIDENCE_SHA256" >>"$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1]))
          phases=value["residency"]["measurement"]["phases"]
          print("## Qwen gfx1151 vision certification passed")
          print(f"- Evidence SHA-256: `{sys.argv[2]}`")
          print(f"- Comparisons: {len(value['comparisons'])} (cold and warm)")
          for name in ("idle","cold","warm","settled"):
              row=phases[name]
              print(f"- {name}: RSS peak {row['rss_peak_bytes']} bytes; GTT peak {row['gtt_peak_bytes']} bytes; UMA peak {row['uma_used_peak_bytes']} bytes")
          print("- Publication remains disabled; this digest is an input to the protected envelope.")
          PY

      - name: Upload bounded differential records
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qwen-vision-${{ inputs.ember_revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.gate.outputs.output }}/vision-certified.json
            ${{ steps.gate.outputs.output }}/vision-certified.sigstore.json
            ${{ steps.gate.outputs.output }}/vision-attestation-provenance.json
            ${{ steps.gate.outputs.output }}/identity.json
            ${{ steps.gate.outputs.output }}/residency.json
            ${{ steps.gate.outputs.output }}/model-inventory.json
            ${{ steps.gate.outputs.output }}/ember.*.f32
            ${{ steps.gate.outputs.output }}/reference/*.f32
            ${{ steps.gate.outputs.output }}/server.log
            ${{ steps.gate.outputs.output }}/responses/*.json
          if-no-files-found: error
          retention-days: 30
