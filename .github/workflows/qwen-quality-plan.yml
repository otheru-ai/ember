name: Qwen runner-local quality descriptor plan

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
      request_payload_base64:
        required: true
        type: string
      request_payload_sha256:
        required: true
        type: string
      request_output:
        required: true
        type: string
    outputs:
      phase_descriptor:
        value: ${{ jobs.plan.outputs.phase_descriptor }}
      phase_descriptor_sha256:
        value: ${{ jobs.plan.outputs.phase_descriptor_sha256 }}

permissions:
  contents: read

concurrency:
  # The stable dispatcher owns the global gfx1151 group for the entire plan
  # and capture chain, so the nested planner must not queue behind its caller.
  group: qwen-quality-plan-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: [self-hosted, linux, x64, gfx1151]
    timeout-minutes: 120
    outputs:
      phase_descriptor: ${{ steps.generate.outputs.phase_descriptor }}
      phase_descriptor_sha256: ${{ steps.generate.outputs.phase_descriptor_sha256 }}
    env:
      TARGET_SHA: ${{ inputs.commit_sha }}
      REQUEST_PAYLOAD_BASE64: ${{ inputs.request_payload_base64 }}
      REQUEST_PAYLOAD_SHA256: ${{ inputs.request_payload_sha256 }}
      REQUEST_OUTPUT: ${{ inputs.request_output }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Persist and execute one exact runner-local quality descriptor request
        id: generate
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUEST_PAYLOAD_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --quiet --exit-code
          python3 - "$REQUEST_PAYLOAD_BASE64" "$REQUEST_PAYLOAD_SHA256" \
              "$REQUEST_OUTPUT" <<'PY'
          import base64, binascii, hashlib, os, pathlib, stat, sys

          encoded, expected_sha, output_raw = sys.argv[1:]
          root = pathlib.Path(
              "/var/tmp/ember-qwen3.8-flash-next/artifacts/qwen-workset/"
              "evidence/operation-requests")
          output = pathlib.Path(output_raw)

          def fail(message):
              raise SystemExit(message)

          if (not output.is_absolute() or output.parent != root
                  or output.name in {"", ".", ".."} or "\n" in output.name
                  or "\0" in output.name or output.suffix != ".json"):
              fail("quality request output is not one direct JSON child of the fixed evidence root")
          if (not root.is_dir() or root.is_symlink()
                  or any(parent.is_symlink() for parent in output.parents)):
              fail("quality request evidence root is absent or unsafe")
          try:
              payload = base64.b64decode(encoded, validate=True)
          except (binascii.Error, ValueError) as exc:
              fail(f"quality request is not strict base64: {exc}")
          if not payload or len(payload) > 32768:
              fail("decoded quality request must contain 1..32768 bytes")
          if hashlib.sha256(payload).hexdigest() != expected_sha:
              fail("decoded quality request digest differs")
          flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, "O_NOFOLLOW", 0)
          try:
              descriptor = os.open(output, flags, 0o600)
          except FileExistsError:
              if (output.is_symlink() or not output.is_file()
                      or hashlib.sha256(output.read_bytes()).hexdigest() != expected_sha):
                  fail("existing quality request differs")
          else:
              with os.fdopen(descriptor, "wb", closefd=True) as stream:
                  stream.write(payload); stream.flush(); os.fsync(stream.fileno())
              directory = os.open(root, os.O_RDONLY | getattr(os, "O_DIRECTORY", 0))
              try:
                  os.fsync(directory)
              finally:
                  os.close(directory)
          metadata = output.lstat()
          if (output.is_symlink() or not stat.S_ISREG(metadata.st_mode)
                  or metadata.st_size != len(payload)
                  or hashlib.sha256(output.read_bytes()).hexdigest() != expected_sha):
              fail("persisted quality request identity differs")
          PY
          result="$(python3 scripts/qwen_quality_request.py \
            --request "$REQUEST_OUTPUT" --request-sha256 "$REQUEST_PAYLOAD_SHA256" \
            --ember-revision "$TARGET_SHA")"
          generated_output="$(python3 - "$result" <<'PY'
          import json, re, sys
          value=json.loads(sys.argv[1]); descriptor=value.get("phase_descriptor")
          if (not isinstance(descriptor,dict) or set(descriptor)!={"path","sha256"}
                  or not descriptor["path"].startswith("/")
                  or re.fullmatch(r"[0-9a-f]{64}",str(descriptor["sha256"])) is None):
              raise SystemExit("quality request did not produce one exact phase descriptor")
          print(descriptor["path"]); print(descriptor["sha256"])
          PY
          )"
          mapfile -t generated <<<"$generated_output"
          (( ${#generated[@]} == 2 ))
          printf 'phase_descriptor=%s\nphase_descriptor_sha256=%s\n' \
            "${generated[0]}" "${generated[1]}" >>"$GITHUB_OUTPUT"

      - name: Summarize the nonpublishing runner-local quality handoff
        run: |
          {
            echo '## Qwen quality descriptor planned'
            echo
            echo "Request: \`$REQUEST_OUTPUT\`"
            echo "Request SHA-256: \`$REQUEST_PAYLOAD_SHA256\`"
            echo "Phase descriptor: \`${{ steps.generate.outputs.phase_descriptor }}\`"
            echo "Phase descriptor SHA-256: \`${{ steps.generate.outputs.phase_descriptor_sha256 }}\`"
            echo 'The planner did not acquire the GPU, publish, or delete artifacts.'
          } >>"$GITHUB_STEP_SUMMARY"
